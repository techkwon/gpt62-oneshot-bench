function advance(ms){let t=Math.max(0,ms/1000);while(t>1e-8){const dt=Math.min(t,1/120);step(dt);t-=dt}render()}
let last=performance.now();function frame(now){const dt=Math.min(50,now-last);last=now;advance(dt);requestAnimationFrame(frame)}
function directionAt(e){const r=canvas.getBoundingClientRect();return THREE.MathUtils.clamp((e.clientX-r.left-r.width*.5)/(Math.min(r.width,h*1.45)*.45),-1,1)}
let activePointer=null,touchOrigin=0,touchAim=0;
canvas.addEventListener('pointerdown',e=>{
 if(!e.isPrimary||e.button!==0||dialog||phase!=='ready')return;
 e.preventDefault();canvas.focus({preventScroll:true});activePointer=e.pointerId;canvas.setPointerCapture(e.pointerId);
 if(e.pointerType==='touch'){touchOrigin=e.clientX;touchAim=aim}else aim=directionAt(e);
 beginCharge('pointer')
});
canvas.addEventListener('pointermove',e=>{
 if(dialog||!['ready','charging'].includes(phase)||!e.isPrimary)return;
 if(e.pointerType==='touch'){if(e.pointerId===activePointer)aim=THREE.MathUtils.clamp(touchAim+(e.clientX-touchOrigin)/(w*.32),-1,1)}
 else aim=directionAt(e)
});
canvas.addEventListener('pointerup',e=>{if(e.pointerId===activePointer){activePointer=null;shoot('pointer')}});
function clearPointer(e){if(e.pointerId===activePointer){activePointer=null;if(input==='pointer')cancelCharge()}}
canvas.addEventListener('pointercancel',clearPointer);canvas.addEventListener('lostpointercapture',clearPointer);
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else if($('arena').requestFullscreen)await $('arena').requestFullscreen()}catch{}}
if(!document.fullscreenEnabled)$('expand').hidden=true;
$('expand').onclick=fullscreen;
document.addEventListener('keydown',e=>{
 if(dialog){if(e.code==='Escape'||e.code==='Tab'){e.preventDefault();if(e.code==='Escape')closeDialog();else $('dialogAction').focus()}return}
 if(e.altKey||e.ctrlKey||e.metaKey)return;
 if(e.code==='Space'){if(document.activeElement?.tagName==='BUTTON')return;e.preventDefault();if(!e.repeat)beginCharge('keyboard')}
 if(['ArrowLeft','ArrowRight','KeyA','KeyD'].includes(e.code)){e.preventDefault();held.add(e.code)}
 if(e.code==='KeyF'&&!e.repeat)fullscreen()
});
document.addEventListener('keyup',e=>{held.delete(e.code);if(e.code==='Space'&&input==='keyboard'){e.preventDefault();shoot('keyboard')}});
function interrupt(){held.clear();activePointer=null;cancelCharge()}
window.addEventListener('blur',interrupt);document.addEventListener('visibilitychange',()=>{if(document.hidden)interrupt()});
$('sound').onclick=()=>{sound=!sound;audioUI();if(sound){unlock();tone(500,.07)}try{localStorage.setItem('blacktop.sound',sound?'on':'off')}catch{}canvas.focus({preventScroll:true})};
$('helpBtn').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});setDialog('help')};
$('restart').onclick=()=>{reset();canvas.focus({preventScroll:true})};$('dialogAction').onclick=closeDialog;
$('modal').addEventListener('click',e=>{if(e.target===$('modal')&&dialog==='help')closeDialog()});
document.addEventListener('fullscreenchange',()=>{if(document.fullscreenElement)$('arena').append($('modal'));else document.body.append($('modal'));if(!dialog)canvas.focus({preventScroll:true});resize()});
window.render_game_to_text=()=>JSON.stringify({phase,dialog,coordinateSystem:'meters, origin below hoop; +x right, +y up, +z toward player',ball:ball.position.toArray().map(n=>+n.toFixed(3)),velocity:velocity.toArray().map(n=>+n.toFixed(3)),target:rimCenter.toArray(),aim:+aim.toFixed(3),power:+charge.toFixed(3),greenZone:[.65,.77],shot:Number($('attempt').textContent),score:score(),streak,history,best});
window.advanceTime=advance;audioUI();ready();resize();new ResizeObserver(resize).observe(canvas);requestAnimationFrame(frame);

</script></body></html>
