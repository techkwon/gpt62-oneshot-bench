<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" width="900" height="720" role="img" aria-labelledby="title description">
  <title id="title">A pelican riding a bicycle</title>
  <desc id="description">A white pelican with a long coral bill pedals a sea-green bicycle along the coast in the warm afternoon sun.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#f9e7c9"/>
      <stop offset="1" stop-color="#fff6df"/>
    </linearGradient>
    <linearGradient id="sun" x2="0" y2="1">
      <stop stop-color="#ffd081"/>
      <stop offset="1" stop-color="#f6aa69"/>
    </linearGradient>
    <linearGradient id="plumage" x1=".2" y1=".1" x2=".8" y2="1">
      <stop stop-color="#fffdf0"/>
      <stop offset=".61" stop-color="#fff3db"/>
      <stop offset="1" stop-color="#e4d4c6"/>
    </linearGradient>
    <linearGradient id="pouch" x2=".2" y2="1">
      <stop stop-color="#f7a16f"/>
      <stop offset="1" stop-color="#e57664"/>
    </linearGradient>
    <pattern id="sun-dots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#bf674f" opacity=".26"/>
      <circle cx="6" cy="6" r="1" fill="#bf674f" opacity=".26"/>
    </pattern>
    <clipPath id="sun-disc"><circle cx="567" cy="253" r="155"/></clipPath>
    <path id="spoke" d="M-4 0 0-94"/>
    <g id="wheel">
      <circle r="104" fill="none" stroke="#283a42" stroke-width="15"/>
      <path d="M-103 0a103 103 0 0 1 103-103M103 0a103 103 0 0 1-103 103" fill="none" stroke="#516265" stroke-width="2.5" stroke-linecap="round"/>
      <circle r="94.5" fill="none" stroke="#f9dfa7" stroke-width="4"/>
      <circle r="91" fill="none" stroke="#596c6b" stroke-width="1.5"/>
      <g fill="none" stroke="#59716e" stroke-width="1.6" opacity=".79">
        <use href="#spoke"/>
        <use href="#spoke" transform="rotate(30)"/>
        <use href="#spoke" transform="rotate(60)"/>
        <use href="#spoke" transform="rotate(90)"/>
        <use href="#spoke" transform="rotate(120)"/>
        <use href="#spoke" transform="rotate(150)"/>
        <use href="#spoke" transform="rotate(180)"/>
        <use href="#spoke" transform="rotate(210)"/>
        <use href="#spoke" transform="rotate(240)"/>
        <use href="#spoke" transform="rotate(270)"/>
        <use href="#spoke" transform="rotate(300)"/>
        <use href="#spoke" transform="rotate(330)"/>
      </g>
      <circle r="9" fill="#f3d69f" stroke="#283a42" stroke-width="3"/>
    </g>
  </defs>

