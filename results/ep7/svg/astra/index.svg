    <path d="m546 180 64 10 75 7" fill="none" stroke="#ffe3a2" stroke-width="4"/>
    <path d="m534 181 9 2" stroke="#7d633c" stroke-width="3"/>
    <path d="M485 161q10-14 27-7" fill="none" stroke="#243d44" stroke-width="4"/>
    <ellipse cx="506" cy="168" rx="7" ry="8" fill="#18333c"/><circle cx="508" cy="165" r="2.2" fill="#fff8e4"/>
    <!-- Paneled cycling cap. -->
    <path d="M426 157q-16-11-8-30 11-29 51-30 37-2 57 27l-8 11q-45-6-92 22Z" fill="#4b7880" stroke="#213a43" stroke-width="5"/>
    <path d="M430 145q3-29 30-43m-3 35q8-25 18-34" fill="none" stroke="#90afa5" stroke-width="3"/>
