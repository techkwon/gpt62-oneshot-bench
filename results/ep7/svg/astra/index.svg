    <path d="M341 400q9 41 38 66l33 35q5 6 2 16l-34 109q-3 9 3 15 13 8 51 5-4-7-15-11l-23-9 40-111q7-16-5-31l-44-63Z" fill="#eab057" stroke="#203a42" stroke-width="5"/>
