    <!-- Lugged step-through frame. -->
    <path d="m245 604 126-142 62 147-188-5m188 5q83-15 161-133m-232-38 71 171" fill="none" stroke="#263c40" stroke-width="14"/>
    <path d="m245 604 126-142 62 147-188-5m188 5q83-15 161-133m-232-38 71 171" fill="none" stroke="#d95840" stroke-width="8"/>
