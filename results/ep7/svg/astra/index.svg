<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="800" viewBox="0 0 900 800" role="img" aria-labelledby="title desc">
  <title id="title">The coastal commuter</title>
  <desc id="desc">A white pelican in a blue cycling cap and a fluttering red scarf pedals a red bicycle along the coast, one wing resting on the handlebars.</desc>
  <defs>
    <pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#b78b49" opacity=".28"/>
    </pattern>
    <pattern id="sand" width="43" height="19" patternUnits="userSpaceOnUse">
      <path d="m4 8 3-1m19 9 2-1" fill="none" stroke="#b59868" stroke-width="1.6" stroke-linecap="round"/>
    </pattern>
    <g id="spokes" stroke="#637e78" stroke-width="2.2">
      <path id="cross" d="M0-98V98M-98 0H98"/>
      <use xlink:href="#cross" transform="rotate(18)"/>
      <use xlink:href="#cross" transform="rotate(36)"/>
      <use xlink:href="#cross" transform="rotate(54)"/>
      <use xlink:href="#cross" transform="rotate(72)"/>
    </g>
    <g id="wheel">
      <circle r="109" fill="#1e3640"/>
      <circle r="99" fill="#fff1cb"/>
      <circle r="93" fill="#d6e4d7" stroke="#506c6a" stroke-width="3"/>
      <path d="M-85 36Q-62 86-9 90M26-88Q66-78 84-43" fill="none" stroke="#f9f3d8" stroke-width="4"/>
      <use xlink:href="#spokes"/>
      <circle r="10" fill="#e6ae55" stroke="#203b42" stroke-width="4"/>
      <path d="M-101-17A103 103 0 0 1-60-83" fill="none" stroke="#57716e" stroke-width="3" stroke-linecap="round"/>
    </g>
  </defs>
  <rect width="900" height="800" fill="#fcf1d8"/>
  <!-- A low sun and a few distant marks keep the coast quiet behind the rider. -->
  <circle cx="445" cy="338" r="262" fill="#f4d28b"/>
  <circle cx="445" cy="338" r="262" fill="url(#dots)"/>
  <g fill="none" stroke="#81948a" stroke-width="3.4" stroke-linecap="round">
    <path d="M119 237q12-3 21 6 3-9 12-12m575 77q11-2 16 5 6-9 16-9m-6 25q7-2 12 3 4-6 11-7"/>
  </g>
  <path d="M46 550q53 1 86-8 32-9 65-4l54 10 179 4 167-5 70-9 47 4 63-11 77 11v92H46Z" fill="#b7d2c1"/>
  <path d="M46 568q86-7 164 0t173 1 167-2 169 2 135-5v74H46Z" fill="#93b9ac"/>
  <g stroke="#e7ecd7" fill="none" stroke-linecap="round" stroke-width="3">
    <path d="M59 562h44m14-2h11m572-8h47m7-1h8m-674 27h40m637 7h55m-33 7h16m-276-21h60"/>
  </g>
