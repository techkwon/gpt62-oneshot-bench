    <path d="M536 211q21 42 60 47 37 4 66-15-28 29-65 25-40-4-61-38Z" fill="#e58d42"/>
    <path d="M546 209q15 28 38 38m-22-37q12 18 29 29m-12-27 16 17" stroke="#c27e3c" stroke-width="3" fill="none"/>
