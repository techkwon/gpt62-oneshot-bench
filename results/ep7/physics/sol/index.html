<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f5ee">
  <title>회전하는 육각형</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f6f5ee;
      --ink: #151b2c;
      --muted: #505970;
      --line: #d5d7d4;
      --blue: #263fca;
      font-family: "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 0;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      background: var(--paper);
      color: var(--ink);
    }

    .page {
      width: min(100% - 112px, 1320px);
      min-height: 100vh;
      min-height: 100svh;
      margin-inline: auto;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    .masthead {
      min-height: 84px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 1px solid var(--line);
    }

    .collection, .state {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.875rem;
      font-weight: 700;
    }

    .mark {
      width: 27px;
      height: 27px;
      display: grid;
      place-items: center;
      background: var(--blue);
      clip-path: polygon(25% 7%, 75% 7%, 100% 50%, 75% 93%, 25% 93%, 0 50%);
    }

    .mark::after {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: white;
      content: "";
    }

    .state { color: var(--blue); }

    .state::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 0 4px #263fca16;
      content: "";
    }

    .state[data-paused] { color: var(--muted); }

    main {
      display: grid;
      grid-template-columns: minmax(0, 0.86fr) minmax(0, 1.14fr);
      grid-template-rows: 1fr auto 1fr;
      grid-template-areas:
        ". stage"
        "intro stage"
        "controls stage";
      column-gap: 20px;
      align-items: center;
      padding-block: 20px;
    }

    .intro { grid-area: intro; }

    h1 {
      margin: 0;
      font-size: clamp(3.5rem, 7vw, 7rem);
      line-height: 1.04;
      font-weight: 850;
      letter-spacing: -0.075em;
    }

    h1 span {
      display: block;
      color: var(--blue);
    }

    .intro p {
      margin: 26px 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 1.4vw, 1.2rem);
      line-height: 1.6;
      word-break: keep-all;
    }

    .stage {
      grid-area: stage;
      position: relative;
      width: min(100%, 70vh, 690px);
      margin: 0;
      justify-self: center;
      aspect-ratio: 1;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .controls {
      grid-area: controls;
      align-self: start;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 30px;
    }

    button {
      min-height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 0 17px;
      border: 1px solid transparent;
      border-radius: 7px;
      background: var(--blue);
      color: white;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      line-height: 1.2;
      transition: background-color 160ms ease, border-color 160ms ease;
    }

    button:hover { background: #182d9d; }
    button:focus-visible { outline: 2px solid var(--blue); outline-offset: 4px; }
    button.secondary { background: transparent; color: var(--ink); border-color: #c6cacb; }
    button.secondary:hover { background: #e9e9e2; border-color: #a5a9af; }

    .icon {
      display: inline-block;
      flex: 0 0 14px;
      width: 14px;
      height: 14px;
    }

    .pause-icon {
      background: currentColor;
      clip-path: polygon(12% 8%, 40% 8%, 40% 92%, 12% 92%, 12% 8%, 60% 8%, 88% 8%, 88% 92%, 60% 92%, 60% 8%);
    }

    [data-paused] .pause-icon { clip-path: polygon(18% 3%, 91% 50%, 18% 97%); }

    .reset-icon {
      position: relative;
      width: 13px;
      height: 13px;
      flex-basis: 13px;
      border: 1.5px solid currentColor;
      border-top-color: transparent;
      border-radius: 50%;
    }

    .reset-icon::after {
      position: absolute;
      top: -2px;
      left: -2px;
      width: 5px;
      height: 5px;
      border-left: 1.5px solid currentColor;
      border-bottom: 1.5px solid currentColor;
      content: "";
    }

    .details {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 13px 36px;
      min-height: 68px;
      margin: 0;
      padding-block: 14px;
      border-top: 1px solid var(--line);
      font-size: 0.875rem;
    }

    .details div { display: flex; align-items: baseline; gap: 11px; }
    dt { color: var(--muted); }
    dd { margin: 0; font-weight: 750; }

    @media (max-width: 800px) {
      .page { width: calc(100% - 48px); }
      .masthead { min-height: 66px; }
      main {
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: auto auto auto;
        grid-template-areas: "intro" "stage" "controls";
        align-content: center;
        padding-block: 36px 25px;
      }
      h1 { font-size: clamp(2.65rem, 8.5vw, 5rem); }
      h1 span { display: inline; }
      .intro p { margin-top: 14px; }
      .stage { width: min(100%, 60vh, 540px); }
      .controls { margin-top: 0; }
      .details { min-height: 60px; }
    }

    @media (prefers-reduced-motion: reduce) {
      button { transition: none; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="masthead">
      <div class="collection"><span class="mark" aria-hidden="true"></span>물리 시뮬레이션</div>
      <span class="state" id="state" role="status">재생 중</span>
    </header>

    <main>
      <div class="intro">
        <h1>회전하는 <span>육각형</span></h1>
        <p>공은 서로 부딪히고, 회전하는 벽에 닿으면 튕겨 나옵니다.</p>
      </div>

      <figure class="stage">
        <canvas id="scene" role="img" aria-label="시계 방향으로 회전하는 육각형 안에서 튀는 공 10개">
          회전하는 육각형 안에서 공 10개가 튑니다.
        </canvas>
      </figure>

      <div class="controls">
        <button type="button" id="toggle">
          <span class="icon pause-icon" aria-hidden="true"></span><span id="toggle-label">일시 정지</span>
        </button>
        <button type="button" class="secondary" id="reset">
          <span class="icon reset-icon" aria-hidden="true"></span>처음부터
        </button>
      </div>
    </main>

    <footer>
      <dl class="details">
        <div><dt>공의 수</dt><dd>10개</dd></div>
        <div><dt>회전 방향</dt><dd>시계 방향</dd></div>
      </dl>
    </footer>
  </div>

  <script>
    "use strict";

    const canvas = document.querySelector("#scene");
    const ctx = canvas.getContext("2d");
    const toggle = document.querySelector("#toggle");
    const toggleLabel = document.querySelector("#toggle-label");
    const status = document.querySelector("#state");
    const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");

    const turn = 2 * Math.PI;
    const hexRadius = 252;
    const apothem = hexRadius * Math.cos(Math.PI / 6);
    const spin = 0.44;
    const step = 1 / 180;
    const initialAngle = -0.17;
    const gravity = 125;

    const colors = {
      cream: ["#fffdf1", "#eee7cc", "#a49b79", "#f4ebca"],
      blue: ["#dbfaff", "#92bcff", "#4d69c7", "#87b7ff"],
      gold: ["#fff9a8", "#edcf54", "#a38431", "#f1d564"]
    };

    // x, y, radius, horizontal speed, vertical speed, color
    const layout = [
      [-127, -93, 17, 171, 45, "cream"],
      [-32, -140, 13, -48, 165, "blue"],
      [78, -100, 19, -148, -70, "gold"],
      [154, -25, 12, -115, 130, "cream"],
      [-73, -15, 16, 90, -215, "blue"],
      [35, -22, 12, 145, 85, "cream"],
      [-155, 45, 13, 136, -72, "gold"],
      [-55, 93, 19, -152, 37, "cream"],
      [59, 111, 16, 117, -172, "blue"],
      [138, 69, 14, -89, 167, "cream"]
    ];

    let balls;
    let angle;
    let running = !reduceMotion.matches;
    let frameId = 0;
    let lastTime = null;
    let accumulator = 0;
    let scale = 1;

    function reset() {
      angle = initialAngle;
      balls = layout.map(([x, y, radius, vx, vy, color]) => ({
        x, y, radius, vx, vy, color,
        inverseMass: 1 / (radius * radius)
      }));
      lastTime = null;
      accumulator = 0;
      draw();
    }

    function resolveWall(ball, nx, ny) {
      // The six inward-facing half-planes also handle contacts near vertices.
      const distance = apothem + ball.x * nx + ball.y * ny;
      const penetration = ball.radius - distance;
      if (penetration <= 0) return;

      const contactX = ball.x - nx * distance;
      const contactY = ball.y - ny * distance;
      const wallVx = -spin * contactY;
      const wallVy = spin * contactX;
      const relativeNormal = (ball.vx - wallVx) * nx + (ball.vy - wallVy) * ny;

      ball.x += nx * penetration;
      ball.y += ny * penetration;
      if (relativeNormal < 0) {
        const bounce = relativeNormal < -8 ? 0.96 : 0;
        const impulse = -(1 + bounce) * relativeNormal;
        ball.vx += impulse * nx;
        ball.vy += impulse * ny;
      }
    }

    function resolvePair(a, b) {
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const radii = a.radius + b.radius;
      const squaredDistance = dx * dx + dy * dy;
      if (squaredDistance >= radii * radii) return;

      const distance = Math.sqrt(squaredDistance);
      const nx = distance > 0 ? dx / distance : 1;
      const ny = distance > 0 ? dy / distance : 0;
      const inverseMass = a.inverseMass + b.inverseMass;
      const correction = (radii - distance) / inverseMass;
      a.x -= nx * correction * a.inverseMass;
      a.y -= ny * correction * a.inverseMass;
      b.x += nx * correction * b.inverseMass;
      b.y += ny * correction * b.inverseMass;

      const relativeNormal = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
      if (relativeNormal < 0) {
        const bounce = relativeNormal < -8 ? 0.98 : 0;
        const impulse = -(1 + bounce) * relativeNormal / inverseMass;
        a.vx -= nx * impulse * a.inverseMass;
        a.vy -= ny * impulse * a.inverseMass;
        b.vx += nx * impulse * b.inverseMass;
        b.vy += ny * impulse * b.inverseMass;
      }
    }

    function advance() {
      angle = (angle + spin * step) % turn;

      for (const ball of balls) {
        ball.vy += gravity * step;
        ball.x += ball.vx * step;
        ball.y += ball.vy * step;
      }

      const normals = Array.from({ length: 6 }, (_, side) => {
        const normalAngle = angle + (side + 0.5) * turn / 6;
        return [-Math.cos(normalAngle), -Math.sin(normalAngle)];
      });

      // Iterate because solving one contact can create another nearby.
      for (let pass = 0; pass < 5; pass++) {
        for (let i = 0; i < balls.length; i++) {
          for (let j = i + 1; j < balls.length; j++) {
            resolvePair(balls[i], balls[j]);
          }
        }
        for (const ball of balls) {
          for (const [nx, ny] of normals) resolveWall(ball, nx, ny);
        }
      }
    }

    function hexPath(radius) {
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const theta = angle + i * turn / 6;
        const x = Math.cos(theta) * radius;
        const y = Math.sin(theta) * radius;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
    }

    function drawGuides() {
      ctx.strokeStyle = "#c8cecf";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(-295, 0);
      ctx.lineTo(295, 0);
      ctx.moveTo(0, -295);
      ctx.lineTo(0, 295);
      ctx.stroke();

      ctx.setLineDash([2, 6]);
      ctx.beginPath();
      ctx.arc(0, 0, 275, 0, turn);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.beginPath();
      for (let tick = 0; tick < 12; tick++) {
        const theta = tick * turn / 12;
        const cos = Math.cos(theta);
        const sin = Math.sin(theta);
        ctx.moveTo(cos * 270, sin * 270);
        ctx.lineTo(cos * 281, sin * 281);
      }
      ctx.stroke();
    }

    function drawBall(ball) {
      const { x, y, radius, vx, vy } = ball;
      const [light, mid, dark, trace] = colors[ball.color];
      const speed = Math.hypot(vx, vy);

      if (speed > 65) {
        const tailLength = Math.min(43, speed * 0.105);
        const tailX = x - vx / speed * tailLength;
        const tailY = y - vy / speed * tailLength;
        const trail = ctx.createLinearGradient(tailX, tailY, x, y);
        trail.addColorStop(0, trace + "00");
        trail.addColorStop(1, trace + "51");
        ctx.strokeStyle = trail;
        ctx.lineWidth = radius * 0.84;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(tailX, tailY);
        ctx.lineTo(x, y);
        ctx.stroke();
      }

      const surface = ctx.createRadialGradient(
        x - radius * 0.32, y - radius * 0.38, radius * 0.08,
        x, y, radius * 1.04
      );
      surface.addColorStop(0, light);
      surface.addColorStop(0.57, mid);
      surface.addColorStop(1, dark);
      ctx.fillStyle = surface;
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, turn);
      ctx.fill();
    }

    function draw() {
      ctx.setTransform(scale, 0, 0, scale, canvas.width / 2, canvas.height / 2);
      const half = canvas.width / (2 * scale);
      ctx.clearRect(-half, -half, 2 * half, 2 * half);
      drawGuides();

      const interior = ctx.createLinearGradient(-185, -240, 180, 240);
      interior.addColorStop(0, "#172d5a");
      interior.addColorStop(0.62, "#101d3b");
      interior.addColorStop(1, "#0a152c");
      hexPath(hexRadius);
      ctx.fillStyle = interior;
      ctx.save();
      ctx.shadowColor = "#18294b38";
      ctx.shadowBlur = 26 * scale;
      ctx.shadowOffsetY = 15 * scale;
      ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.clip();
      ctx.strokeStyle = "#a9c2ff16";
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let line = -256; line <= 256; line += 32) {
        ctx.moveTo(line, -hexRadius);
        ctx.lineTo(line, hexRadius);
        ctx.moveTo(-hexRadius, line);
        ctx.lineTo(hexRadius, line);
      }
      ctx.stroke();

      hexPath(hexRadius - 9);
      ctx.strokeStyle = "#a9c2ff42";
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(-10, 0);
      ctx.lineTo(10, 0);
      ctx.moveTo(0, -10);
      ctx.lineTo(0, 10);
      ctx.stroke();

      for (const ball of balls) drawBall(ball);
      ctx.restore();

      hexPath(hexRadius);
      const rim = ctx.createLinearGradient(-200, -200, 200, 200);
      rim.addColorStop(0, "#6f8af4");
      rim.addColorStop(0.44, "#3f5dd4");
      rim.addColorStop(1, "#152b85");
      ctx.strokeStyle = rim;
      ctx.lineWidth = 3;
      ctx.lineJoin = "round";
      ctx.stroke();
    }

    function resize() {
      const width = canvas.getBoundingClientRect().width;
      const pixels = Math.max(1, Math.round(width * Math.min(devicePixelRatio || 1, 2)));
      canvas.width = pixels;
      canvas.height = pixels;
      scale = pixels / 620;
      draw();
    }

    function animate(now) {
      if (lastTime !== null) accumulator += Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;
      while (accumulator >= step) {
        advance();
        accumulator -= step;
      }
      draw();
      frameId = requestAnimationFrame(animate);
    }

    function setRunning(next) {
      running = next;
      toggle.toggleAttribute("data-paused", !running);
      status.toggleAttribute("data-paused", !running);
      toggleLabel.textContent = running ? "일시 정지" : "재생";
      status.textContent = running ? "재생 중" : "일시 정지됨";
      cancelAnimationFrame(frameId);
      lastTime = null;
      if (running) frameId = requestAnimationFrame(animate);
    }

    toggle.addEventListener("click", () => setRunning(!running));
    document.querySelector("#reset").addEventListener("click", reset);
    reduceMotion.addEventListener("change", ({ matches }) => {
      if (matches) setRunning(false);
    });

    reset();
    resize();
    new ResizeObserver(resize).observe(canvas);
    setRunning(running);
  </script>
</body>
</html>
