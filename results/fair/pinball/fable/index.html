<script type="module">
import * as THREE from 'three';

/* =====================================================================================================
   PHYSICS  (pure 2D simulation on the table plane: x = across, y = up the table, units ~ 2 inches)
   ===================================================================================================== */
//#PHYS-BEGIN
const D2R = Math.PI / 180;
const XL = -4.6, XR = 5.4, YT = 19.6;          // playfield bounds
const ACX = 0.4, ACY = 14.6, AR = 5;           // top arch centre + radius
const BR = 0.27;                               // ball radius
const GRAV = 22, GRAVZ = 60;                   // gravity down the table / effective gravity when climbing a ramp
const DT = 1 / 800, MAXV = 56;
const LANE_X = 5.05, PLUNGER_Y = 0.7, SPIN_Y = 13.2;
const RAMP_X = 1.4, RAMP_Y = 9.3, RAMP_HW = 0.62;   // ramp entrance centre / capture line / half width of its housing
const BUMP_KICK = 14, SLING_KICK = 11;

const segs = [], circs = [], sensors = [], thinWalls = [], solids = [], posts = [], gates = [];
let emit = function () {};

function arcPts(cx, cy, r, a0, a1, n) {
  const p = [];
  for (let i = 0; i <= n; i++) { const a = (a0 + (a1 - a0) * i / n) * D2R; p.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]); }
  return p;
}
function addSeg(a, b, o) {
  o = o || {};
  const s = { ax: a[0], ay: a[1], bx: b[0], by: b[1], dx: b[0] - a[0], dy: b[1] - a[1], rad: o.rad || 0,
    e: o.e == null ? 0.35 : o.e, type: o.type || 'wall', ref: o.ref == null ? null : o.ref, oneWay: false, gnx: 0, gny: 0 };
  s.len2 = s.dx * s.dx + s.dy * s.dy;
  const l = Math.sqrt(s.len2); s.nx = -s.dy / l; s.ny = s.dx / l;
  segs.push(s); return s;
}
function addLine(pts, o) { for (let i = 0; i < pts.length - 1; i++) addSeg(pts[i], pts[i + 1], o); }
function thinWall(pts, o) {
  o = o || {};
  const rad = o.rad || 0.06;
  addLine(pts, { rad: rad, e: o.e });
  thinWalls.push({ pts: pts, rad: rad, h: o.h || 0.5, mat: o.mat || 'metal' });
}
function solid(pts, o) {
  o = o || {};
  const n = pts.length, skip = o.skip || [];
  for (let i = 0; i < n; i++) {
    if (skip.indexOf(i) >= 0) continue;
    addSeg(pts[i], pts[(i + 1) % n], { e: o.e, type: (o.types && o.types[i]) || 'wall', ref: o.ref });
  }
  solids.push({ pts: pts, h: o.h || 0.5, mat: o.mat || 'plastic', ref: o.ref });
}
function addCirc(x, y, r, o) {
  o = o || {};
  const c = { x: x, y: y, r: r, e: o.e == null ? 0.5 : o.e, type: o.type || 'post', ref: o.ref == null ? null : o.ref };
  circs.push(c); return c;
}
function post(x, y, r) { addCirc(x, y, r, { e: 0.55 }); posts.push({ x: x, y: y, r: r }); }
function addSensor(name, x, y, r) { sensors.push({ name: name, x: x, y: y, r2: r * r, inside: false }); }

// ---- outer boundary --------------------------------------------------------------------------------
addSeg([XL, 0], [XL, ACY]);
addSeg([XR, 0], [XR, ACY]);
addLine(arcPts(ACX, ACY, AR, 0, 180, 72), { e: 0.3 });
addSeg([XL, 0], [XR, 0]);

// ---- shooter lane (right) : straight wall that curves into the top arch --------------------------------
thinWall([[4.65, 0], [4.65, ACY]].concat(arcPts(ACX, ACY, 4.25, 0, 55, 16).slice(1)), { rad: 0.05 });
// ---- left orbit lane guide, with a funnel at the bottom that carries the stand-up targets -------------
const TGT_A = [-2.3, 9.6], TGT_B = [-2.8, 11.6];
thinWall([TGT_A, TGT_B, [-3.6, 13.0], [-3.6, ACY]].concat(arcPts(ACX, ACY, 4.0, 180, 125, 14).slice(1)), { rad: 0.06 });

// ---- one-way gates at both ends of the top arch --------------------------------------------------------
function addGate(angDeg, r0, sign) {
  const a = angDeg * D2R, c = Math.cos(a), s = Math.sin(a);
  const g = addSeg([ACX + r0 * c, ACY + r0 * s], [ACX + AR * c, ACY + AR * s], { e: 0.25 });
  g.oneWay = true; g.gnx = -s * sign; g.gny = c * sign;       // gate only stops balls on its +normal side
  gates.push(g);
}
addGate(55, 4.25, 1);     // shooter-lane exit: lets the launched ball out, never back in
addGate(125, 4.0, -1);    // orbit exit: lets orbit shots through, stops the launched ball

// ---- top rollover lanes ------------------------------------------------------------------------------
const LANE_GUIDES = [-1.1, -0.1, 0.9, 1.9];
LANE_GUIDES.forEach(function (x) { thinWall([[x, 16.4], [x, 17.5]], { rad: 0.08, mat: 'guide', h: 0.55 }); });
[-0.6, 0.4, 1.4].forEach(function (x, i) { addSensor('lane' + i, x, 16.95, 0.3); });

// ---- pop bumpers --------------------------------------------------------------------------------------
const BUMPERS = [[-1.45, 14.6], [2.0, 14.7], [0.3, 12.8], [3.85, 11.3]];
BUMPERS.forEach(function (p, i) { addCirc(p[0], p[1], 0.55, { type: 'bumper', ref: i }); });

// ---- stand-up targets on the orbit funnel ---------------------------------------------------------------
const TARGETS = [];
(function () {
  const ux = TGT_B[0] - TGT_A[0], uy = TGT_B[1] - TGT_A[1], l = Math.hypot(ux, uy);
  const tx = ux / l, ty = uy / l, nx = ty, ny = -tx;          // normal points right, into the playfield
  [0.2, 0.5, 0.8].forEach(function (t, i) {
    const cx = TGT_A[0] + ux * t + nx * 0.13, cy = TGT_A[1] + uy * t + ny * 0.13;
    addSeg([cx - tx * 0.27, cy - ty * 0.27], [cx + tx * 0.27, cy + ty * 0.27], { rad: 0.05, e: 0.45, type: 'target', ref: i });
    TARGETS.push({ x: cx, y: cy, ang: Math.atan2(ty, tx), nx: nx, ny: ny });
  });
})();

// ---- ramp entrance housing (an upside-down U with a flared mouth; the ramp rises inside it) ------------
thinWall([[RAMP_X - 1.0, 8.0], [RAMP_X - RAMP_HW, 8.8], [RAMP_X - RAMP_HW, 11.5], [RAMP_X, 11.95], [RAMP_X + RAMP_HW, 11.5], [RAMP_X + RAMP_HW, 8.8], [RAMP_X + 1.0, 8.0]],
  { rad: 0.06, mat: 'ramp', h: 0.55 });

// ---- wall deflectors above the outlanes ---------------------------------------------------------------
solid([[-4.6, 8.8], [-4.05, 7.7], [-4.6, 7.2]], { skip: [2], mat: 'bump', e: 0.4 });
solid([[4.6, 8.8], [4.05, 7.7], [4.6, 7.2]], { skip: [2], mat: 'bump', e: 0.4 });

// ---- slingshots, inlane/outlane dividers, aprons (mirrored) --------------------------------------------
const SLINGS = [];
[-1, 1].forEach(function (s, i) {
  const P1 = [s * 3.05, 6.3], P2 = [s * 3.05, 4.35], P3 = [s * 1.85, 3.55];
  solid([P1, P2, P3], { types: { 2: 'sling' }, ref: i, mat: 'sling', e: 0.4 });
  SLINGS.push({ pts: [P1, P2, P3], s: s });
  post(s * 2.98, 6.28, 0.13); post(s * 1.87, 3.58, 0.12);
  thinWall([[s * 3.9, 6.3], [s * 3.9, 3.9], [s * 2.25, 2.8]], { rad: 0.06 });
  solid([[s * 4.6, 1.6], [s * 1.2, 0.35], [s * 1.2, 0], [s * 4.6, 0]], { skip: [2, 3], mat: 'apron', h: 0.45 });
  addSensor(s < 0 ? 'inL' : 'inR', s * 3.47, 5.3, 0.3);
  addSensor(s < 0 ? 'outL' : 'outR', s * 4.25, 5.0, 0.3);
});

// ---- other rollovers ----------------------------------------------------------------------------------
const STARS = [[-0.9, 9.5], [0.1, 10.4], [-0.3, 8.7]];
STARS.forEach(function (p, i) { addSensor('star' + i, p[0], p[1], 0.36); });
addSensor('rlane', 3.2, 9.6, 0.4);
addSensor('orbit', ACX + 4.55 * Math.cos(112 * D2R), ACY + 4.55 * Math.sin(112 * D2R), 0.5);

// ---- plunger ------------------------------------------------------------------------------------------
const plungerSeg = addSeg([4.7, PLUNGER_Y], [XR, PLUNGER_Y], { e: 0.1 });
const plunger = { charging: false, pull: 0 };

// ---- flippers -----------------------------------------------------------------------------------------
function makeFlipper(x, y, rest, up) {
  return { x: x, y: y, len: 1.75, r1: 0.25, r2: 0.14, aRest: rest * D2R, aUp: up * D2R, angle: rest * D2R, omega: 0, pressed: false };
}
const flipL = makeFlipper(-2.1, 2.5, -32, 24);
const flipR = makeFlipper(2.1, 2.5, 212, 156);
const flippers = [flipL, flipR];

// ---- ramp path: Catmull-Rom through (x, y, height), resampled at equal arc length -----------------------
const RAMP_CTL = [[RAMP_X, RAMP_Y, 0], [RAMP_X, 10.4, 0.42], [RAMP_X, 11.6, 0.9], [1.6, 12.5, 1.18], [2.2, 13.3, 1.36], [3.0, 13.9, 1.45],
  [3.9, 14.2, 1.47], [4.6, 13.9, 1.44], [4.95, 13.1, 1.4], [4.95, 11.5, 1.3], [4.95, 9.5, 1.2], [4.92, 8.3, 1.1],
  [4.7, 7.5, 1.0], [4.1, 7.0, 0.92], [3.62, 6.7, 0.86], [3.475, 6.2, 0.82], [3.475, 5.8, 0.8]];
function catmull(P, n) {
  const out = [], m = P.length;
  for (let i = 0; i < m - 1; i++) {
    const p0 = P[Math.max(0, i - 1)], p1 = P[i], p2 = P[i + 1], p3 = P[Math.min(m - 1, i + 2)];
    for (let j = 0; j < n; j++) {
      const t = j / n, t2 = t * t, t3 = t2 * t, q = [];
      for (let k = 0; k < 3; k++) {
        q.push(0.5 * (2 * p1[k] + (-p0[k] + p2[k]) * t + (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * t2 + (-p0[k] + 3 * p1[k] - 3 * p2[k] + p3[k]) * t3));
      }
      out.push(q);
    }
  }
  out.push(P[m - 1].slice());
  return out;
}
function resample(pts, N) {
  const cum = [0];
  for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1], pts[i][2] - pts[i - 1][2]));
  const L = cum[cum.length - 1], out = [];
  let j = 0;
  for (let i = 0; i <= N; i++) {
    const d = L * i / N;
    while (j < pts.length - 2 && cum[j + 1] < d) j++;
    const f = (d - cum[j]) / Math.max(1e-9, cum[j + 1] - cum[j]);
    out.push([pts[j][0] + (pts[j + 1][0] - pts[j][0]) * f, pts[j][1] + (pts[j + 1][1] - pts[j][1]) * f, pts[j][2] + (pts[j + 1][2] - pts[j][2]) * f]);
  }
  return { pts: out, len: L };
}
const RAMP_N = 600;
const rampPath = resample(catmull(RAMP_CTL, 24), RAMP_N);
const RAMP_DS = rampPath.len / RAMP_N;

// ---- ball + spinner state -----------------------------------------------------------------------------
const ball = { x: LANE_X, y: PLUNGER_Y + BR, vx: 0, vy: 0, h: 0, vh: 0, active: false, onRamp: false, rs: 0, rv: 0, roff: 0 };
const spinner = { angle: 0, w: 0, acc: 0 };

function restit(vn, e) { const s = -vn; return s < 1.5 ? 0 : (s > 4 ? e : e * (s - 1.5) / 2.5); }

function collideSeg(s) {
  const b = ball, px = b.x - s.ax, py = b.y - s.ay;
  let t = (px * s.dx + py * s.dy) / s.len2; if (t < 0) t = 0; else if (t > 1) t = 1;
  let nx = px - s.dx * t, ny = py - s.dy * t;
  const rr = BR + s.rad, d2 = nx * nx + ny * ny;
  if (d2 >= rr * rr) return;
  if (s.oneWay) {
    if (px * s.gnx + py * s.gny <= 0) return;
    if (b.vx * s.gnx + b.vy * s.gny >= 0) return;
  }
  let d = Math.sqrt(d2);
  if (d < 1e-7) { nx = s.nx; ny = s.ny; d = 0; } else { nx /= d; ny /= d; }
  b.x += nx * (rr - d); b.y += ny * (rr - d);
  const vn = b.vx * nx + b.vy * ny;
  if (vn < 0) {
    const e = restit(vn, s.e);
    b.vx -= (1 + e) * vn * nx; b.vy -= (1 + e) * vn * ny;
    if (s.type === 'sling') {
      if (vn < -1.2 && t > 0.1 && t < 0.9) { b.vx += nx * SLING_KICK; b.vy += ny * SLING_KICK; emit('sling', s.ref); }
    } else if (s.type === 'target') {
      if (vn < -1.5) emit('target', s.ref);
    }
    if (vn < -5) emit('knock', -vn);
  }
}
function collideCirc(c) {
  const b = ball;
  let nx = b.x - c.x, ny = b.y - c.y;
  const rr = BR + c.r, d2 = nx * nx + ny * ny;
  if (d2 >= rr * rr) return;
  const d = Math.sqrt(d2) || 1e-7; nx /= d; ny /= d;
  b.x += nx * (rr - d); b.y += ny * (rr - d);
  const vn = b.vx * nx + b.vy * ny;
  if (c.type === 'bumper') {
    if (vn < 0) { b.vx -= 1.5 * vn * nx; b.vy -= 1.5 * vn * ny; }
    const v2 = b.vx * nx + b.vy * ny;
    if (v2 < BUMP_KICK) { b.vx += (BUMP_KICK - v2) * nx; b.vy += (BUMP_KICK - v2) * ny; }
    emit('bumper', c.ref);
  } else if (vn < 0) {
    const e = restit(vn, c.e);
    b.vx -= (1 + e) * vn * nx; b.vy -= (1 + e) * vn * ny;
    if (vn < -5) emit('knock', -vn);
  }
}
function stepFlipper(f, dt) {
  const target = f.pressed ? f.aUp : f.aRest;
  const diff = target - f.angle;
  if (diff === 0) { f.omega = 0; return; }
  const dir = diff > 0 ? 1 : -1;
  const acc = f.pressed ? 800 : 500, wmax = f.pressed ? 20 : 16;
  let w = f.omega + dir * acc * dt;
  if (w * dir > wmax) w = dir * wmax;
  let na = f.angle + w * dt;
  if ((target - na) * dir <= 0) { na = target; w = 0; }
  f.angle = na; f.omega = w;
}
function collideFlipper(f) {
  const b = ball, ca = Math.cos(f.angle), sa = Math.sin(f.angle);
  const px = b.x - f.x, py = b.y - f.y;
  let t = (px * ca + py * sa) / f.len; if (t < 0) t = 0; else if (t > 1) t = 1;
  const cx = f.x + ca * f.len * t, cy = f.y + sa * f.len * t;
  let nx = b.x - cx, ny = b.y - cy;
  const fr = f.r1 + (f.r2 - f.r1) * t, rr = fr + BR, d2 = nx * nx + ny * ny;
  if (d2 >= rr * rr) return;
  const d = Math.sqrt(d2) || 1e-7; nx /= d; ny /= d;
  const qx = cx + nx * fr - f.x, qy = cy + ny * fr - f.y;      // contact point relative to the pivot

/* =====================================================================================================
   AUDIO (tiny synthesised effects)
   ===================================================================================================== */
let ac = null, master = null, muted = false, noiseBuf = null;

  if (ac) { if (ac.state === 'suspended') ac.resume(); return; }

    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = muted ? 0 : 0.5; master.connect(ac.destination);
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 0.5, ac.sampleRate);

}

  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}

  s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.value = freq || 2000;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + 0.02);

let lastKnock = 0;
const sfx = {
  flip: function () { noise(0.05, 0.5, 1400); tone(150, 60, 0.07, 'triangle', 0.5); },
  flipDown: function () { noise(0.03, 0.15, 700); },
  bumper: function (i) { tone(300 + i * 90, 90, 0.16, 'square', 0.22); noise(0.07, 0.45, 3000); },
  sling: function () { noise(0.06, 0.5, 4500); tone(520, 180, 0.08, 'sawtooth', 0.14); },
  target: function () { tone(880, 860, 0.2, 'triangle', 0.35); tone(1320, 1300, 0.25, 'sine', 0.2, 0.03); },
  lane: function () { tone(1250, 1560, 0.14, 'sine', 0.3); },
  tick: function () { tone(1800, 1200, 0.03, 'square', 0.08); },
  roll: function () { tone(660, 990, 0.09, 'triangle', 0.2); },
  launch: function (p) { noise(0.25, 0.3 + p * 0.4, 900 + p * 2500); tone(90, 240 + p * 260, 0.22, 'sawtooth', 0.18); },
  rampUp: function () { tone(300, 1300, 0.45, 'sawtooth', 0.12); },
  ramp: function () { [523, 659, 784, 1047, 1319].forEach(function (f, i) { tone(f, f, 0.14, 'square', 0.16, i * 0.07); }); },
  jackpot: function () { [784, 988, 1175, 1568, 1175, 1568, 1976].forEach(function (f, i) { tone(f, f, 0.12, 'square', 0.18, i * 0.075); }); },
  bonus: function () { [392, 523, 659, 784].forEach(function (f, i) { tone(f, f, 0.12, 'triangle', 0.25, i * 0.09); }); },
  drain: function () { tone(420, 55, 0.9, 'sawtooth', 0.22); },
  save: function () { tone(500, 1000, 0.2, 'square', 0.18); tone(1000, 1500, 0.2, 'square', 0.18, 0.2); },
  start: function () { [392, 523, 659, 784, 1047].forEach(function (f, i) { tone(f, f, 0.13, 'square', 0.17, i * 0.085); }); },
  over: function () { [523, 494, 440, 392, 330, 262].forEach(function (f, i) { tone(f, f, 0.26, 'triangle', 0.26, i * 0.2); }); },

/* =====================================================================================================
   GAME LOGIC
   ===================================================================================================== */
let state = 'attract';              // attract | play | bonus | over

let score = 0, shownScore = -1, ballNum = 0, mult = 1, bonusUnits = 0, high = 0;
let saveUntil = 0, superUntil = 0, lampFlash = 0, stuckT = 0, freshBall = false, overAt = 0, orbitUpT = -9;
const lanes = [false, false, false], tgts = [false, false, false];
let msgUntil = 0, msgSticky = '';

  g.textAlign = 'right'; g.fillText(mult + 'X', 742, 34);
  g.font = '700 70px "Courier New", monospace'; g.fillText(fmt(score), 742, 88);
  g.shadowBlur = 0; g.fillStyle = 'rgba(18,6,0,0.55)';
  for (let y = 0; y < 128; y += 4) g.fillRect(0, y, 768, 1.4);

}
function serveBall(fresh) {

}

}
function nextBall() {

  state = 'play'; serveBall(true); showMsg('BALL ' + ballNum, 2); shownScore = -1; updateHud();
}
function gameOver() {

  const isHigh = score > high;

  sfx.over(); shownScore = -1; updateHud();
  $('card').innerHTML = '<h1>GAME OVER</h1><h2>FINAL SCORE</h2><div class="big">' + fmt(score) + '</div>' +
    '<div class="hs">' + (isHigh ? '★ NEW HIGH SCORE ★' : 'HIGH SCORE ' + fmt(high)) + '</div><br>' +
    '<div class="go" id="goBtn">PRESS ENTER TO PLAY AGAIN</div>';

}
function showAttract() {
  $('card').innerHTML = '<h1>NEON SUNBURST</h1><h2>3D PINBALL</h2>' +
    '<div class="keys"><span><kbd>←</kbd> <kbd>Z</kbd> <kbd>A</kbd></span><span>Left flipper</span>' +
    '<span><kbd>→</kbd> <kbd>/</kbd> <kbd>D</kbd></span><span>Right flipper</span>' +
    '<span>hold <kbd>SPACE</kbd> <kbd>↓</kbd></span><span>Pull plunger — release to launch</span>' +
    '<span><kbd>C</kbd> <kbd>P</kbd> <kbd>M</kbd></span><span>Camera · Pause · Mute</span></div><br>' +
    '<div class="go" id="goBtn">PRESS ENTER TO START</div>' +
    '<div class="hs">3 BALLS · HIGH SCORE ' + fmt(high) + '</div>';
  $('overlay').classList.remove('hidden');
}
function onDrain() {
  if (state !== 'play' || !ball.active) return;
  if (time < saveUntil) { saveUntil = 0; serveBall(false); showMsg('BALL SAVED — LAUNCH AGAIN', 2.5); sfx.save(); return; }
  ball.active = false; sfx.drain();
  const bonus = bonusUnits * 100 * mult;
  score += bonus; state = 'bonus'; stateT = time + 2.6;
  showMsg(ballNum >= 3 ? 'LAST BALL LOST · BONUS ' + fmt(bonus) : 'BALL LOST · BONUS ' + fmt(bonus), 2.5);

function onSensor(name) {

    case 'sling': addScore(10); slingVis[d].t = 1; sfx.sling(); break;
    case 'target': onTarget(d); break;

        showMsg((sup ? 'SUPER RAMP · ' : 'RAMP · ') + fmt(v * mult), 1.8); if (sup) sfx.jackpot(); else sfx.ramp();

    case 'orbitUp': orbitUpT = time; break;

/* =====================================================================================================
   INPUT
   ===================================================================================================== */
const KEYS_L = { ArrowLeft: 1, KeyZ: 1, KeyA: 1, ShiftLeft: 1 }, KEYS_R = { ArrowRight: 1, Slash: 1, KeyD: 1, ShiftRight: 1 };
const KEYS_P = { Space: 1, ArrowDown: 1, Enter: 1, NumpadEnter: 1 };
function rotateLanes(dir) {
  if (state !== 'play') return;
  if (dir < 0) lanes.push(lanes.shift()); else lanes.unshift(lanes.pop());
}
function setFlipper(f, down) {
  if (f.pressed === down) return;
  f.pressed = down;
  if (state === 'play' && !paused) { if (down) { sfx.flip(); rotateLanes(f === flipL ? -1 : 1); } else sfx.flipDown(); }
}
function plungerDown() { if (state === 'play' && !paused) plunger.charging = true; }
function plungerUp() { if (plunger.charging) releasePlunger(); plunger.charging = false; }

  if (state === 'attract') { startGame(); return true; }
  if (state === 'over' && performance.now() - overAt > 900) { startGame(); return true; }

}
window.addEventListener('keydown', function (e) {
  const c = e.code;
  if (KEYS_L[c] || KEYS_R[c] || KEYS_P[c] || c === 'ArrowUp') e.preventDefault();
  if (e.repeat) return;
  initAudio();
  if (KEYS_L[c]) setFlipper(flipL, true);
  else if (KEYS_R[c]) setFlipper(flipR, true);
  else if (KEYS_P[c]) { if (!tryStart()) plungerDown(); }
  else if (c === 'KeyC') { viewIdx = (viewIdx + 1) % VIEWS.length; fitCamera(); }
  else if (c === 'KeyP') { if (state === 'play' || state === 'bonus') { paused = !paused; if (paused) { showMsg('PAUSED', 1e9); plunger.charging = false; } else msgUntil = 0; } }
  else if (c === 'KeyM') { muted = !muted; if (master) master.gain.value = muted ? 0 : 0.5; showMsg(muted ? 'SOUND OFF' : 'SOUND ON', 1); }
});
window.addEventListener('keyup', function (e) {
  const c = e.code;

  else if (KEYS_R[c]) setFlipper(flipR, false);

// touch / mouse: left half = left flipper, right half = right flipper; while the ball waits in the shooter lane any press pulls the plunger
const pointers = {};
window.addEventListener('pointerdown', function (e) {
  initAudio();
  if (tryStart()) return;
  if (state !== 'play') return;
  const side = e.clientX < window.innerWidth / 2 ? 'L' : 'R';
  pointers[e.pointerId] = { side: side, plunge: onPlunger() };

function pointerEnd(e) {
  const p = pointers[e.pointerId]; if (!p) return;

  if (p.plunge) plungerUp(); else setFlipper(p.side === 'L' ? flipL : flipR, false);

window.addEventListener('pointerup', pointerEnd); window.addEventListener('pointercancel', pointerEnd);
window.addEventListener('contextmenu', function (e) { e.preventDefault(); });

/* =====================================================================================================
   FRAME LOOP
   ===================================================================================================== */
const colTmp = new THREE.Color();
function setInsert(ins, dt) {
  let on = ins.on;
  if (ins.flash > time) on = Math.floor(time * 14) % 2 === 0;
  else if (ins.blink > 0) on = Math.floor(time * ins.blink * 2) % 2 === 0;
  ins.level += ((on ? 1 : 0) - ins.level) * Math.min(1, dt * 22);
  const l = ins.level;
  colTmp.copy(ins.base).multiplyScalar(0.13 + 0.87 * l); if (l > 0.5) colTmp.lerp(WHITE, (l - 0.5) * 0.5);

}
const WHITE = new THREE.Color(0xffffff);

  ballMesh.position.set(ball.x, ball.y, BR + ball.h);
  // flippers, plunger, spinner

  plungerVis.position.y = plungerSeg.ay;
  spinVis.rotation.x = spinner.angle;
  // bumpers
  for (let i = 0; i < bumperVis.length; i++) {
    const b = bumperVis[i]; b.t = Math.max(0, b.t - dt * 4.5);

    const k = Math.max(b.t, idle);

    b.light.intensity = b.t * 30; b.glow.opacity = b.t * 0.95;

  }
  for (let i = 0; i < slingVis.length; i++) {
    const s = slingVis[i]; s.t = Math.max(0, s.t - dt * 5);

  }
  for (let i = 0; i < targetVis.length; i++) {
    const t = targetVis[i]; t.t = Math.max(0, t.t - dt * 4);
    t.mat.emissiveIntensity = (tgts[i] ? 1.1 : 0.2) + t.t * 2.5;
  }

  for (let m = 2; m <= 5; m++) inserts['x' + m].on = attract ? Math.floor(time * 4) % 4 === m - 2 : mult >= m;

  inserts.ramp.blink = sup ? 5 : 0.9; inserts.ramp2.blink = sup ? 5 : 0.9; inserts.ramp.on = inserts.ramp2.on = false;
  inserts.orbit.blink = inserts.orbit2.blink = 0.7;

  for (let i = 0; i < insertList.length; i++) setInsert(insertList[i], dt);

function gameTick(dt) {
  if (state === 'bonus' && time >= stateT) nextBall();
  if (state !== 'play' || !ball.active) return;

}
let lastT = performance.now(), accum = 0;
function frame(now) {

  renderer.render(scene, camera);

document.addEventListener('visibilitychange', function () { lastT = performance.now(); });

showAttract(); updateHud(); drawDmd();
window.__pinballReady = true;
requestAnimationFrame(frame);
</script>
