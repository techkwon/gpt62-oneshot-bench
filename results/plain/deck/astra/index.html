<script>
(() => {
  const pages = [...document.querySelectorAll('.page')];
  const ticks = [...document.querySelectorAll('.ticks i')];
  const prev = document.getElementById('prev');
  const next = document.getElementById('next');
  let current = 0;
  function show(index) {
    current = Math.max(0, Math.min(pages.length - 1, index));
    pages.forEach((page, i) => {
      page.toggleAttribute('hidden', i !== current);
      ticks[i].classList.toggle('on', i === current);
    });
    prev.disabled = current === 0;
    next.disabled = current === pages.length - 1;
    document.getElementById('counter').textContent = String(current + 1).padStart(2, '0') + ' / ' + pages.length;
    document.getElementById('status').textContent = 'Slide ' + (current + 1) + ' of ' + pages.length + '. ' + pages[current].querySelector('title').textContent;
  }
  prev.addEventListener('click', () => show(current - 1));
  next.addEventListener('click', () => show(current + 1));
  document.addEventListener('keydown', event => {
    if (event.altKey || event.ctrlKey || event.metaKey) return;
    const targets = {ArrowRight:current+1, ArrowDown:current+1, ArrowLeft:current-1, ArrowUp:current-1, Home:0, End:pages.length-1};
    if (Object.hasOwn(targets, event.key)) {
      event.preventDefault();
      show(targets[event.key]);
    }
  });
  show(0);
})();
</script></body></html>
