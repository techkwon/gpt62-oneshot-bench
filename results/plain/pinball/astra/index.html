<script>
function createPinball(){
  const g={ball:{},walls:[],bumpers:[{x:160,y:180,r:33},{x:303,y:195,r:33},{x:223,y:290,r:33}],
    targets:[{x:113,y:367},{x:140,y:343},{x:338,y:340}],flippers:[],onEvent:()=>{}};
  const line=(x1,y1,x2,y2,type='rail')=>g.walls.push({x1,y1,x2,y2,type});
  function chain(points,type){points.slice(1).forEach(([x,y],i)=>line(...points[i],x,y,type));}
  chain([[9,787],[9,130],[13,94],[26,64],[56,37],[92,21],[135,13],[374,13],[421,20],[452,39],[476,67],[488,107],[488,812]]);
  chain([[451,805],[451,128],[443,107],[428,91]],'divider');
  chain([[17,390],[53,452],[74,500]],'guide');
  chain([[421,393],[391,448],[371,487]],'guide');
  chain([[11,565],[36,638],[62,687],[145,711]],'guide');
  chain([[442,566],[415,642],[389,688],[311,711]],'guide');
  chain([[67,548],[84,629],[145,678],[67,548]],'sling');
  chain([[388,548],[372,629],[312,678],[388,548]],'sling');
  for(const x of [132,206,280])line(x,76,x-4,115,'lane');
  const left={x:151,y:715,angle:.4},right={x:305,y:715,angle:Math.PI-.4};
  g.flippers=[left,right];
  let buttons={},timer=0,laneGate=false,clock=0,lastSling=-1,startX=475;
  const ball=g.ball,R=10;
  function end(f){f.tx=f.x+60*Math.cos(f.angle);f.ty=f.y+60*Math.sin(f.angle);}
  function ready(){g.mode='ready';g.charge=0;g.charging=false;laneGate=false;Object.assign(ball,{x:startX,y:721,vx:0,vy:0});}
  g.reset=()=>{g.score=0;g.ballNumber=1;buttons={};timer=0;lastSling=-1;clock=0;
    for(const target of [...g.bumpers,...g.targets])target.lit=0;
    g.flippers.forEach((f,i)=>{f.angle=i?Math.PI-.4:.4;end(f);});ready();};
  function score(name,n){g.score+=n;g.onEvent(name,n);}
  g.setControl=(key,down)=>{
    if(!!buttons[key]===down)return;
    buttons[key]=down;
    if(key==='plunger'&&g.mode==='ready'){
      if(down){g.charging=true;}
      else if(g.charging){g.charging=false;g.mode='playing';ball.vy=-(1010+g.charge*410);g.charge=0;g.onEvent('launch',0);}
    }else if(down&&key!=='plunger'&&g.mode!=='over')g.onEvent('flipper',0);
  };
  function collide(x1,y1,x2,y2,r,bounce,surface,boost=0){
    const dx=x2-x1,dy=y2-y1;
    const t=Math.max(0,Math.min(1,((ball.x-x1)*dx+(ball.y-y1)*dy)/(dx*dx+dy*dy||1)));
    const cx=x1+t*dx,cy=y1+t*dy,nx=ball.x-cx,ny=ball.y-cy,d=Math.hypot(nx,ny);
    if(d>=r+R)return false;
    const ux=d>.00001?nx/d:0,uy=d>.00001?ny/d:-1;
    ball.x=cx+ux*(r+R+.01);ball.y=cy+uy*(r+R+.01);
    const sv=surface?surface(t):[0,0],vn=(ball.vx-sv[0])*ux+(ball.vy-sv[1])*uy;
    if(vn>=0)return false;
    const j=-(1+bounce)*vn+boost;
    ball.vx+=j*ux;ball.vy+=j*uy;return true;
  }
  g.step=dt=>{
    clock+=dt;
    g.flippers.forEach((f,i)=>{
      const hit=buttons[i?'right':'left'],dest=i?Math.PI-(hit?-.63:.4):(hit?-.63:.4);
      const delta=Math.max(-dt*(hit?19:11),Math.min(dt*(hit?19:11),dest-f.angle));
      f.omega=delta/dt;f.angle+=delta;end(f);
    });
    for(const t of [...g.targets,...g.bumpers])t.lit=Math.max(0,t.lit-dt);
    if(g.mode==='ready'){if(g.charging)g.charge=Math.min(1,g.charge+dt*1.15);ball.y=721+45*g.charge;return;}
    if(g.mode==='drained'){timer-=dt;if(timer<=0){g.ballNumber++;ready();g.onEvent('ready',0);}return;}
    if(g.mode!=='playing')return;
    ball.vy+=485*dt;
    const drag=Math.exp(-.105*dt);ball.vx*=drag;ball.vy*=drag;
    const speed=Math.hypot(ball.vx,ball.vy);if(speed>1500){ball.vx*=1500/speed;ball.vy*=1500/speed;}
    ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
    if(!laneGate&&ball.y<118&&ball.x<427){laneGate=true;score('lane',100);}
    if(laneGate)collide(426,88,477,60,2,.75);
    for(const w of g.walls){
      const sling=w.type==='sling',active=sling&&clock-lastSling>.18;
      if(collide(w.x1,w.y1,w.x2,w.y2,sling?5:3,sling?.82:.7,null,active?100:0)&&active){lastSling=clock;score('sling',50);}
    }
    for(const b of g.bumpers){
      if(collide(b.x,b.y,b.x,b.y,b.r,.87,null,235)&&b.lit<.12){b.lit=.4;score('bumper',500);}
    }
    for(const t of g.targets){
      if(collide(t.x-5,t.y+3,t.x+5,t.y-3,4,.85,null,65)&&!t.lit){t.lit=.48;score('target',250);}
    }
    for(const f of g.flippers)collide(f.x,f.y,f.tx,f.ty,8,.78,t=>[-(f.ty-f.y)*t*f.omega,(f.tx-f.x)*t*f.omega]);
    if(ball.x>454&&ball.y>=724&&ball.vy>0){ready();g.onEvent('ready',0);}
    if(ball.y>833){g.mode=g.ballNumber===3?'over':'drained';timer=1.05;g.onEvent('drain',0);}
  };
  g.reset();return g;
}
// Screen-printed playfield and illuminated backglass textures.
function makeArtwork(w,h,painter){
  const texture=document.createElement('canvas');texture.width=w*2;texture.height=h*2;
  const c=texture.getContext('2d');c.scale(2,2);c.lineCap='round';c.lineJoin='round';painter(c,w,h);return texture;
}
const ink='#122b2d',ivory='#f6e7b7',rust='#de5032',gold='#ebb947',aqua='#65b6a7';
function poly(c,points,fill,stroke,width=1){c.beginPath();points.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.closePath();if(fill){c.fillStyle=fill;c.fill();}if(stroke){c.strokeStyle=stroke;c.lineWidth=width;c.stroke();}}
function ellipse(c,x,y,rx,ry,fill,stroke,width=1){c.beginPath();c.ellipse(x,y,rx,ry,0,0,Math.PI*2);if(fill){c.fillStyle=fill;c.fill();}if(stroke){c.strokeStyle=stroke;c.lineWidth=width;c.stroke();}}
function line(c,x,y,X,Y,color,width=1){c.beginPath();c.moveTo(x,y);c.lineTo(X,Y);c.lineWidth=width;c.strokeStyle=color;c.stroke();}
function lettering(c,text,x,y,size,color,angle=0,style='900 italic'){
  c.save();c.translate(x,y);c.rotate(angle);c.transform(1,0,-.11,1,0,0);c.fillStyle=color;c.textAlign='center';c.font=style+' '+size+'px Helvetica Neue, Arial, sans-serif';c.fillText(text,0,0);c.restore();
}
function fourStar(c,x,y,r,col){poly(c,[[x,y-r],[x+r*.2,y-r*.24],[x+r*.8,y],[x+r*.2,y+r*.17],[x,y+r],[x-r*.18,y+r*.2],[x-r*.8,y],[x-r*.18,y-r*.2]],col);}
function randomSource(seed){return ()=>{seed=(Math.imul(1664525,seed)+1013904223)>>>0;return seed/4294967296;};}
function starfield(c,w,h,count,seed){
  const rand=randomSource(seed);for(let n=0;n<count;n++){const x=rand()*w,y=rand()*h,s=rand();if(s>.94)fourStar(c,x,y,3+rand()*6,ivory);else ellipse(c,x,y,s*1.45+.3,s*1.45+.3,n%4?ivory:aqua);}
}
function grain(c,w,h,seed){const rand=randomSource(seed);for(let i=0;i<w*h/9;i++){c.fillStyle=rand()>.52?'#fff4cf18':'#00171721';c.fillRect(rand()*w,rand()*h,rand()*1.7+.2,rand()*1.3+.25);}}
function planet(c,x,y,r,body,stripe,ring){
  c.save();c.translate(x,y);c.rotate(-.28);
  if(ring){ellipse(c,0,0,r*1.67,r*.34,null,ink,r*.22);ellipse(c,0,0,r*1.67,r*.34,null,ring,r*.12);}
  ellipse(c,0,0,r,r,body,ink,2);c.save();c.clip();
  for(let i=-3;i<=3;i++){c.beginPath();c.moveTo(-r*1.2,i*r*.30);c.bezierCurveTo(-r*.4,i*r*.3+r*.22,r*.7,i*r*.3+r*.29,r*1.2,i*r*.3-r*.14);c.strokeStyle=stripe;c.lineWidth=i%2?r*.08:r*.17;c.stroke();}
  c.restore();
  if(ring){c.beginPath();c.ellipse(0,0,r*1.67,r*.34,0,0,Math.PI);c.strokeStyle=ink;c.lineWidth=r*.2;c.stroke();c.strokeStyle=ring;c.lineWidth=r*.1;c.stroke();}c.restore();
}
function rocket(c,x,y,scale,theta){
  c.save();c.translate(x,y);c.rotate(theta);c.scale(scale,scale);
  function shape(d,f,s=ink,w=2.6){const p=new Path2D(d);c.fillStyle=f;c.fill(p);if(s){c.strokeStyle=s;c.lineWidth=w;c.stroke(p);}}
  shape('M-12 45 Q-22 66 -10 86 L-9 75 Q-4 111 0 123 Q4 97 14 83 L10 88 Q22 62 12 45Z',rust);
  shape('M-8 48 Q-11 67 -3 79 L0 99 Q10 74 7 48Z',gold,null);
  shape('M-4 48 Q-5 63 1 78 Q7 61 5 48Z',ivory,null);
  shape('M-13 -9 Q-42 17 -44 59 L-23 43 -12 40Z',rust);shape('M13 -9 Q42 17 44 59 L24 43 12 40Z',rust);
  shape('M0 -91 Q32 -46 20 21 L12 47 -12 47 -20 21 Q-32 -46 0 -91Z',ivory);
  shape('M0 -91 Q18 -33 10 13 L5 40 12 43 Q37 -28 0 -91Z','#79afa0',null);
  shape('M-16 -60 Q-9 -84 0 -91 Q11 -75 17 -57 Q0 -64 -16 -60Z',rust);
  shape('M-19 23 Q0 29 20 20 L16 34 Q0 41 -16 35Z',rust);
  shape('M-12 42 L13 40 12 51 -12 52Z','#667770');
  ellipse(c,0,-25,13,15,gold,ink,2.8);ellipse(c,0,-25,9,11,'#335d62',ink,2);line(c,-3,-31,3,-34,ivory,2.5);
  shape('M-2 7 Q5 18 2 59 Q-5 44 -2 7Z',rust);
  line(c,-15,-49,-18,-35,ivory,2);line(c,-36,47,-26,34,ivory,1.6);c.restore();
}
function makeField(c){
 c.fillStyle='#17373b';c.fillRect(0,0,500,820);
 const sky=c.createLinearGradient(0,0,420,550);sky.addColorStop(0,'#256462');sky.addColorStop(.6,'#16383c');sky.addColorStop(1,'#142c30');c.fillStyle=sky;c.fillRect(0,0,500,820);
 starfield(c,451,802,290,75);
 for(const [x,y,rx,ry,rot] of [[215,247,228,136,-.65],[228,220,212,157,-.68],[130,428,244,91,-.89],[220,410,202,115,-.8]]){

const held={left:new Set(),right:new Set(),plunger:new Set()};
function input(key,id,down){
 const sources=held[key];if(down){if(paused||game.mode==='over')return;unlock();sources.add(id);}else sources.delete(id);
 game.setControl(key,!!sources.size);document.querySelector('[data-key="'+key+'"]').classList.toggle('active',!!sources.size);
}
function releaseInputs(){game.charging=false;for(const key in held){held[key].clear();game.setControl(key,false);document.querySelector('[data-key="'+key+'"]').classList.remove('active');}}
function showModal(over){
 releaseInputs();$('.overlay').hidden=false;$('#modalTitle').textContent=over?'Game over':'Paused';
 $('#modalMessage').textContent=over?'Final score · '+game.score.toLocaleString():'Ball '+game.ballNumber+' of 3';
 $('#action').textContent=over?'Play again':'Resume game';$('#action').focus({preventScroll:true});
 $('#announce').textContent=over?'Game over. Final score '+game.score:'Game paused.';
}
function togglePause(){
 if(game.mode==='over')return;paused=!paused;
 if(paused)showModal(false);else{$('.overlay').hidden=true;$('#action').blur();}
 $('#pause').setAttribute('aria-label',paused?'Resume game':'Pause game');updateUI();
}
$('#action').onclick=()=>{if(game.mode==='over'){game.reset();paused=false;eventTimer=0;lastEvent='';$('.overlay').hidden=true;$('#announce').textContent='New game. Ball one ready.';unlock();updateUI();render();}else togglePause();};
$('#pause').onclick=togglePause;
$('#sound').onclick=()=>{soundOn=!soundOn;if(soundOn){unlock();tone(520,840,.13,'sine',.08);}$('#sound span').textContent=soundOn?'SOUND ON':'SOUND OFF';$('#sound').setAttribute('aria-pressed',soundOn);$('#sound').setAttribute('aria-label',soundOn?'Mute sound':'Enable sound');$('.waves').setAttribute('d',soundOn?'M16 8q4 4 0 8m3-11q7 7 0 14':'M16 9l6 6m0-6-6 6');};
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{}}
$('#full').onclick=fullscreen;
const bindings={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Space:'plunger',ArrowDown:'plunger'};
document.addEventListener('keydown',e=>{
 if(e.ctrlKey||e.metaKey||e.altKey)return;
 if(e.code==='Space'&&e.target.tagName==='BUTTON'&&(e.target===$('#action')||!$('.overlay').hidden))return;
 if(bindings[e.code]){e.preventDefault();if(!e.repeat)input(bindings[e.code],e.code,true);}
 if(!e.repeat&&(e.code==='KeyP'||(e.code==='Escape'&&paused)))togglePause();
 if(!e.repeat&&e.code==='KeyF')fullscreen();
});
document.addEventListener('keyup',e=>{if(bindings[e.code]){input(bindings[e.code],e.code,false);}});
document.querySelectorAll('[data-control]').forEach(b=>{
 const key=b.dataset.control;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);input(key,e.pointerId,true);});
 for(const evt of ['pointerup','lostpointercapture','pointercancel'])b.addEventListener(evt,e=>input(key,e.pointerId,false));
});
function deactivate(){releaseInputs();if(!paused&&game.mode==='playing')togglePause();}
window.addEventListener('blur',deactivate);document.addEventListener('visibilitychange',()=>{if(document.hidden)deactivate();});
let remainder=0,last=0;const step=1/240;
function advance(seconds){if(!paused){remainder+=seconds;while(remainder>=step){game.step(step);eventTimer=Math.max(0,eventTimer-step);remainder-=step;}}}
function frame(time){if(last)advance(Math.min(.055,(time-last)/1000));last=time;render();updateUI();requestAnimationFrame(frame);}
window.advanceTime=ms=>{advance(Math.min(120,Math.max(0,ms/1000)));render();updateUI();};
window.render_game_to_text=()=>JSON.stringify({coordinates:'Playfield origin top left; x right, y toward drain.',mode:paused?'paused':game.mode,score:game.score,ballNumber:game.ballNumber,ball:game.ball,charge:game.charge,flippers:game.flippers.map(f=>({x:f.x,y:f.y,tipX:f.tx,tipY:f.ty})),bumpers:game.bumpers,targets:game.targets,lastEvent});
new ResizeObserver(resize).observe(canvas);resize();updateUI();requestAnimationFrame(frame);
</script></body></html>
