<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#121222">
<title>Solar Flare Pinball</title>
<style>
:root{color-scheme:dark;--ink:#f5ead8;--muted:#a39caf;--line:#373243;--gold:#ffc578;--pink:#fa7196;--floor:#11111e;--mono:"Courier New",monospace;--display:Impact,"Arial Black","Helvetica Neue",sans-serif}
*{box-sizing:border-box}
body{margin:0;min-width:280px;background:radial-gradient(ellipse at 69% 46%,#30233d 0%,#1b192d 30%,#12121f 65%,#0e0e19 100%);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle,#bca8cd 1px,transparent 1.2px) 0 0/26px 26px;opacity:.10;mask-image:linear-gradient(#000,transparent 88%)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
.top{height:70px;border-bottom:1px solid #c2a7ca21}
.top-inner{max-width:1240px;width:calc(100% - 80px);margin:auto;height:100%;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:11px;color:#f5e4cd;font-size:14px;font-weight:830;letter-spacing:.13em}
.logo{width:31px;height:31px;display:grid;place-items:center}
.logo svg{width:100%;height:100%;overflow:visible}
.actions{display:flex;gap:9px}
.icon-btn{height:36px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 11px;background:#13132080;border:1px solid #91839c47;border-radius:5px;color:#ded2df;font:700 10px var(--mono);letter-spacing:.075em;transition:background .15s,border-color .15s}
.icon-btn:hover,.key:hover{background:#383047;border-color:#c1a6c0}
.icon-btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}
.icon-btn[aria-pressed="true"]{color:var(--gold)}
.machine{position:relative;max-width:1120px;width:calc(100% - 88px);margin:0 auto;display:grid;grid-template-columns:290px minmax(0,1fr);grid-template-rows:1fr auto 1fr;column-gap:42px;align-items:center;min-height:calc(100svh - 70px)}
.identity{grid-column:1;grid-row:1;align-self:end;margin-top:24px;z-index:1}
.eyebrow{display:flex;align-items:center;gap:12px;margin:0 0 15px;font:700 11px var(--mono);letter-spacing:.26em;color:var(--gold)}
.eyebrow::before{content:"";width:25px;height:1px;background:currentColor}
h1{display:flex;flex-direction:column;align-items:flex-start;margin:0 0 19px;font:950 clamp(65px,7vw,101px)/.78 var(--display);letter-spacing:-.035em;font-style:italic;width:max-content;transform:skewX(-5deg);text-shadow:3px 5px #77416170}
h1 span:last-child{color:#ff9b76;margin-top:8px}
.scoreboard{grid-column:1;grid-row:2;align-self:start;margin-top:16px;z-index:1}
.display{display:flex;flex-direction:column;gap:8px;padding:14px 16px 12px;background:linear-gradient(155deg,#2d1e30,#191421);border:1px solid #6d4956;border-radius:7px;box-shadow:inset 0 0 0 3px #140e19,0 8px 22px #0a071a35}
.readout{display:flex;justify-content:space-between;align-items:center;gap:10px}
.label{font:700 10px var(--mono);letter-spacing:.19em;color:#d2aeb1}
.display .digits{color:#ffca7f;font:700 clamp(28px,3.4vw,42px)/1.1 var(--mono);letter-spacing:.065em;text-align:right;text-shadow:0 0 14px #f88c3c78;font-variant-numeric:tabular-nums}
.display .digits .zeros{color:#765040;text-shadow:none}
.display .best{color:#eebc92;font:700 12px var(--mono);letter-spacing:.10em}
.resources{display:flex;justify-content:space-between;align-items:center;padding:15px 1px 13px;border-bottom:1px solid var(--line)}
.resources .label{color:#c1b4ca}
.balls{display:flex;gap:9px}
.balls i{width:10px;height:10px;border:1px solid #625264;border-radius:50%;background:#292132}
.balls i[data-live]{background:#ffb77c;border-color:#ffd7a4;box-shadow:0 0 9px #f29b6b75}
.controls{grid-column:1;grid-row:3;align-self:start;margin:18px 0 25px;z-index:1}
.control-row{min-height:42px;display:flex;align-items:center;justify-content:space-between;gap:9px}
.control-row + .control-row{border-top:1px solid #c3a7cd18}
.control-label{font-size:12px;color:#d8cbd9}
.key{height:29px;min-width:34px;padding:0 8px;border:1px solid #796380;border-bottom:2px solid #796380;border-radius:4px;background:#262035;color:#e7d9e9;font:700 13px var(--mono);touch-action:none;user-select:none}
.key[aria-pressed="true"]{background:#ffc982;color:#302032;border-color:#ffd89e}
.key.plunge{font-size:10px;letter-spacing:.11em;min-width:64px}
.touch-copy{display:none}
@media(pointer:coarse){.touch-copy{display:inline}.keyboard-copy{display:none}}
.hint{margin:9px 0 0;font-size:11px;line-height:1.5;color:#b1a4b9}
.stage{grid-column:2;grid-row:1 / span 3;position:relative;align-self:center;justify-self:center;width:min(100%,calc((100svh - 78px)*.86585),710px);margin:4px 0}
canvas{display:block;width:100%;aspect-ratio:710/820}
.game-message{position:absolute;left:50%;bottom:3.9%;transform:translateX(-50%);color:#ffe4ae;text-align:center;white-space:nowrap;font:700 clamp(8px,1vw,11px)/1 var(--mono);letter-spacing:.16em;pointer-events:none;text-shadow:0 1px 5px #150c12}
.game-over{position:absolute;z-index:2;inset:0;display:grid;place-items:center;background:#100d1bbd;border-radius:11px;backdrop-filter:blur(4px)}
.game-over[hidden]{display:none}
.end-panel{width:min(84%,315px);padding:29px;text-align:center;background:#20172a;border:1px solid #815065;border-radius:9px;box-shadow:0 15px 45px #07050ea6}
.end-panel h2{margin:0 0 23px;color:#ffd08c;font:italic 900 clamp(29px,5vw,48px)/1 var(--display);text-transform:uppercase;letter-spacing:.015em}
.final-score{margin:6px 0 21px;color:#ffe6ba;font:700 clamp(30px,5vw,46px)/1 var(--mono)}
.replay{min-height:41px;padding:0 16px;border:1px solid #ffcf99;border-radius:4px;background:#ffc27d;color:#26172b;font:800 12px var(--mono);letter-spacing:.08em}
.replay:hover{background:#ffdaac}
@media(max-width:900px){
  .machine{width:calc(100% - 50px);grid-template-columns:235px minmax(0,1fr);column-gap:12px}
  .top-inner{width:calc(100% - 50px)}
  h1{font-size:clamp(61px,9vw,86px)}
}
@media(max-width:650px){
  .top{height:52px}.top-inner{width:calc(100% - 30px)}.brand{font-size:11px}.logo{width:24px;height:24px}.icon-btn{height:30px;padding:0 7px;font-size:9px}
  .machine{width:100%;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;column-gap:10px}
  .identity{width:calc(43% - 20px);margin:13px 0 5px;align-self:center}
  .eyebrow{font-size:8px;gap:5px;margin:0 0 6px;letter-spacing:.13em}.eyebrow::before{width:13px}
  h1{display:block;white-space:nowrap;font-size:clamp(22px,6.8vw,44px);margin:0;letter-spacing:-.025em}
  h1 span:last-child{margin:0 0 0 3px}
  .scoreboard{width:calc(57% - 20px);margin:9px 0 0;align-self:center}
  .display{gap:2px;padding:6px 9px}.display .digits{font-size:clamp(17px,5vw,27px)}.display .label{font-size:8px}.display .best{font-size:9px}
  .resources{padding:6px 3px 1px;border:0}.resources .label{font-size:8px}.balls{gap:6px}.balls i{width:7px;height:7px}
  .stage{order:2;width:min(100%, max(305px,calc((100svh - 180px)*.86585)),470px);margin:2px auto 0}
  .controls{order:3;width:min(100% - 30px,410px);margin:2px auto 13px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px 8px}
  .control-row:nth-child(2){order:2}.control-row:nth-child(3){order:1}.hint{order:3}
  .control-row{min-height:0;flex-direction:column-reverse;gap:3px}.control-row + .control-row{border:0}.control-label{font-size:9px}
  .key{width:100%;min-height:36px}.hint{grid-column:1/-1;text-align:center;margin:0}
  .game-message{font-size:8px}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand">
      <span class="logo" aria-hidden="true"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="10" fill="#ffb878"/><path d="M8 11h16M6 15h20M6 19h20M9 23h14" stroke="#312238" stroke-width="1.45"/><ellipse cx="16" cy="16" rx="16.2" ry="5.2" transform="rotate(-31 16 16)" fill="none" stroke="#fbb4b8" stroke-width="1.2"/></svg></span>
      ORBIT ARCADE
    </div>
    <div class="actions">
      <button type="button" id="sound" class="icon-btn" aria-pressed="true" aria-label="Toggle sound"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 8h3l4-3v10l-4-3H3zM13 7c2 2 2 4 0 6m2-8c3 3 3 7 0 10"/></svg><span>SOUND ON</span></button>
      <button type="button" id="full" class="icon-btn" aria-pressed="false" aria-label="Toggle fullscreen"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M8 4H4v4m8-4h4v4M4 12v4h4m8-4v4h-4"/></svg></button>
    </div>
  </div>
</header>
<main class="machine">
  <div class="identity">
    <p class="eyebrow">PINBALL</p>
    <h1><span>SOLAR</span> <span>FLARE</span></h1>
  </div>
  <section class="scoreboard" aria-label="Score and balls">
    <div class="display">
      <div class="readout"><span class="label">SCORE</span><output id="score" class="digits" aria-live="off"></output></div>
      <div class="readout"><span class="label">BEST</span><span id="best" class="best">000000</span></div>
    </div>
    <div class="resources"><span class="label" id="balls-label">BALLS LEFT</span><span id="balls" class="balls" role="img" aria-label="3 balls left"><i></i><i></i><i></i></span></div>
  </section>
  <section class="controls" aria-label="Controls">
    <div class="control-row"><span class="control-label">Left flipper</span><button type="button" class="key" data-control="left" aria-label="Left flipper" aria-pressed="false">←</button></div>
    <div class="control-row"><span class="control-label">Right flipper</span><button type="button" class="key" data-control="right" aria-label="Right flipper" aria-pressed="false">→</button></div>
    <div class="control-row"><span class="control-label">Plunger</span><button type="button" class="key plunge" data-control="launch" aria-label="Hold and release plunger" aria-pressed="false"><span class="keyboard-copy">SPACE</span><span class="touch-copy">PULL</span></button></div>
    <p class="hint"><span class="keyboard-copy">Hold and release Space to launch.</span><span class="touch-copy">Hold and release the plunger to launch.</span></p>
  </section>
  <div class="stage">
    <canvas id="table" width="710" height="820" role="img" aria-label="Solar Flare pinball cabinet with colored bumpers and a right-hand launch lane">Your browser needs Canvas to display the table.</canvas>
    <div id="message" class="game-message" aria-live="polite">BALL 1 READY</div>
    <div id="game-over" class="game-over" hidden>
      <div class="end-panel" role="dialog" aria-modal="true" aria-labelledby="end-title">
        <h2 id="end-title">Game over</h2>
        <div class="label">FINAL SCORE</div>
        <p id="final-score" class="final-score">0</p>
        <button type="button" class="replay" id="replay">PLAY AGAIN ↵</button>
      </div>
    </div>
  </div>
</main>
<script>
'use strict';

const canvas = document.getElementById('table');
const screen = canvas.getContext('2d', { alpha:true });
const backdrop = document.createElement('canvas');
let ctx = screen;
const width = 710, height = 820;
const cam = {x:355, y:401, z:7.42, distance:37, sin:.855, cos:Math.sqrt(1-.855**2), scale:50};
const scoreOutput = document.getElementById('score');
const bestOutput = document.getElementById('best');
const ballsOutput = document.getElementById('balls');
const message = document.getElementById('message');
const gameOver = document.getElementById('game-over');
const replay = document.getElementById('replay');

const clamp = (value, low, high) => Math.max(low, Math.min(high, value));
const mix = (from, to, t) => from + (to - from) * t;
const plane = (x, z, y=0) => [x,y,z];

function project([x,y,z]) {
  const forward = z-cam.z;
  const scale = cam.scale*cam.distance/(cam.distance-forward*cam.cos-y*cam.sin);
  return [cam.x+x*scale, cam.y+(forward*cam.sin-y*cam.cos)*scale, scale];
}
function path(points, closed=false) {
  ctx.beginPath();
  points.forEach(([x,y],index) => index ? ctx.lineTo(x,y) : ctx.moveTo(x,y));
  if (closed) ctx.closePath();
}
function polygon(points, fill, edge=null, thickness=1) {
  path(points.map(project),true);
  if (fill) { ctx.fillStyle=fill; ctx.fill(); }
  if (edge) { ctx.strokeStyle=edge; ctx.lineWidth=thickness; ctx.stroke(); }
}
function line(points,color,thickness=1) {
  path(points.map(project));
  ctx.strokeStyle=color;
  ctx.lineWidth=thickness;
  ctx.lineCap='round';
  ctx.lineJoin='round';
  ctx.stroke();
}
function linear(x0,y0,x1,y1,stops) {
  const gradient=ctx.createLinearGradient(x0,y0,x1,y1);
  for (const [position,color] of stops) gradient.addColorStop(position,color);
  return gradient;
}
function quad(x0,z0,x1,z1,y=0) {
  return [plane(x0,z0,y),plane(x1,z0,y),plane(x1,z1,y),plane(x0,z1,y)];
}
function outlineCircle(x,z,r,y=0,count=36,start=0,end=2*Math.PI) {
  return Array.from({length:count+1},(_,i)=>{
    const angle=mix(start,end,i/count);
    return plane(x+r*Math.cos(angle),z+r*Math.sin(angle),y);
  });
}
function flatText(text,x,z,size,color,{angle=0,weight=800,tracking=0,y=.011}={}) {
  const [px,py,s]=project(plane(x,z,y));
  ctx.save();
  ctx.translate(px,py);
  ctx.scale(1,.79);
  ctx.rotate(angle);
  ctx.font=weight+' '+size*s+'px system-ui, sans-serif';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillStyle=color;
  ctx.letterSpacing=tracking+'px';
  ctx.fillText(text,0,0);
  ctx.restore();
}
function box(x0,z0,x1,z1,bottom,top,colors) {
  const a=quad(x0,z0,x1,z1,bottom);
  const b=quad(x0,z0,x1,z1,top);
  if (x0>0) polygon([a[0],a[3],b[3],b[0]],colors[2]);
  if (x1<0) polygon([a[1],a[2],b[2],b[1]],colors[2]);
  polygon([a[3],a[2],b[2],b[3]],colors[1]);
  polygon(b,colors[0]);
}
function cylinder(x,z,r,bottom,top,colors,count=36) {
  const a=outlineCircle(x,z,r,bottom,count);
  const b=outlineCircle(x,z,r,top,count);
  polygon([...b.slice(0,count/2+1),...a.slice(0,count/2+1).reverse()],colors[1]);
  polygon(b,colors[0],colors[2]);
}
function roundShadow(x,z,r,opacity=.25) {
  const [px,py,s]=project(plane(x+.065,z+.11));
  ctx.save();
  ctx.translate(px,py);
  ctx.scale(1,.69);
  const shade=ctx.createRadialGradient(0,0,0,0,0,r*s);
  shade.addColorStop(0,'rgba(7,4,19,'+opacity+')');
  shade.addColorStop(1,'rgba(7,4,19,0)');
  ctx.fillStyle=shade;
  ctx.fillRect(-r*s,-r*s,r*s*2,r*s*2);
  ctx.restore();
}
function ribbon(points,r,height,colors) {
  for (let i=0;i<points.length-1;i++) {
    const [ax,az]=points[i], [bx,bz]=points[i+1];
    const len=Math.hypot(bx-ax,bz-az);
    const sx=(bz-az)*r/len, sz=(ax-bx)*r/len;
    const top=[plane(ax+sx,az+sz,height),plane(bx+sx,bz+sz,height),
               plane(bx-sx,bz-sz,height),plane(ax-sx,az-sz,height)];
    const facing=(ax+bx)<0 ? [0,1] : [3,2];
    const [u,v]=facing.map(i=>top[i]);
    polygon([u,v,[v[0],.02,v[2]],[u[0],.02,u[2]]],colors[1]);
    polygon(top,colors[0]);
  }
  line(points.map(([x,z])=>plane(x,z,height+.008)),colors[2],1.35);
}

const guides = [
  {points:[[-3.32,10.14],[-2.94,11.24],[-2.43,11.97],[-1.64,12.39]], color:['#f2ad85','#6e314c','#ffe1b0']},
  {points:[[3.18,10.02],[2.87,11.15],[2.40,11.95],[1.64,12.39]], color:['#f2ad85','#6e314c','#ffe1b0']},
  {points:[[-4.24,2.20],[-3.83,1.47],[-3.05,.91],[-2.17,.55],[-.80,.34],[1.50,.34],[2.97,.54],[3.82,1.08],[4.31,1.87]], color:['#ffd38e','#683851','#fff0ba']},
  {points:[[3.70,2.95],[3.70,12.95]], color:['#ffcb9e','#64415c','#ffefc3']}
];
const slings = [
  {points:[[-3.53,8.13],[-2.13,10.70],[-3.32,10.14]], color:'#ed74a1', stripe:'#ffe0ad', flash:0},
  {points:[[2.95,8.13],[2.13,10.70],[3.18,10.02]], color:'#63cedc', stripe:'#e0ffed', flash:0}
];
const bumpers = [
  {x:-1.63,z:3.56,r:.63,points:150,light:'#ffc1d5',cap:'#f1659a',shade:'#872754',glow:'rgba(255,105,165,.62)',pitch:615,flash:0},
  {x:1.45,z:3.42,r:.63,points:150,light:'#c5fff6',cap:'#5ad2da',shade:'#235d88',glow:'rgba(83,239,238,.55)',pitch:820,flash:0},
  {x:-.08,z:5.48,r:.74,points:250,light:'#fff0b5',cap:'#ffbe62',shade:'#9c4e42',glow:'rgba(255,184,88,.57)',pitch:705,flash:0}
];
const inserts = [
  {x:-2.28,z:2.19,color:'#ff8aab',letter:'S',flash:0},
  {x:-.30,z:1.91,color:'#ffc279',letter:'O',flash:0},
  {x:1.69,z:2.17,color:'#73dce5',letter:'L',flash:0}
];
const posts = [
  [-3.36,3.7,.14],[2.99,4.47,.14],[-3.21,6.06,.13],[2.91,6.40,.14],
  [-3.68,7.64,.14],[3.29,7.67,.14]
];

function glow(x,z,y,r,rgba) {
  const [px,py,s]=project(plane(x,z,y));
  const grad=ctx.createRadialGradient(px,py,0,px,py,s*r);
  grad.addColorStop(0,rgba);
  grad.addColorStop(1,'transparent');
  ctx.fillStyle=grad;
  ctx.fillRect(px-s*r,py-s*r,2*s*r,2*s*r);
}

function drawBackboard() {
  const lower=-.10, upper=1.93;
  const face=[[ -4.61,lower,-.08],[4.61,lower,-.08],[4.61,1.61,-.08],[4.26,upper,-.08],[-4.26,upper,-.08],[-4.61,1.61,-.08]];
  polygon(face.map(([x,y,z])=>[x,y+.08,z-.16]),'#0c0a16','#8d536b',2);
  polygon(face,linear(120,35,590,116,[[0,'#582b57'],[.53,'#231d3c'],[1,'#653044']]),'#e1a371',2);
  line([[-4.42,1.55,-.065],[-4.15,1.74,-.065],[4.15,1.74,-.065],[4.42,1.55,-.065]],'#ffb985',1);
  const [x,y,s]=project(plane(0,-.03,1.05));
  ctx.save();
  ctx.translate(x,y);
  ctx.fillStyle='#ffbc7e';
  ctx.font='italic 900 '+(.46*s)+'px system-ui, sans-serif';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.letterSpacing='4px';
  ctx.shadowColor='#f26788';
  ctx.shadowBlur=10;
  ctx.fillText('SOLAR FLARE',0,0);
  ctx.restore();
  for (const side of [-1,1]) {
    for (let i=0;i<3;i++) {
      const [lx,ly]=project(plane(side*(2.95+i*.35),-.06,.91+i*.13));
      ctx.fillStyle=['#f08a9e','#ffc58a','#ffe0ac'][i];
      ctx.beginPath(); ctx.arc(lx,ly,2.1,0,Math.PI*2); ctx.fill();
    }
  }
}

function drawFloor() {
  const floor=quad(-4.36,.04,4.41,14.09);
  const fill=linear(0,109,190,725,[[0,'#9d3e59'],[.22,'#6c2d61'],[.48,'#46294f'],[.76,'#272645'],[1,'#191c34']]);
  polygon(floor,fill);
  ctx.save();
  path(floor.map(project),true);
  ctx.clip();

  let seed=2945;
  const random=()=>{
    seed=(Math.imul(seed,1664525)+1013904223)>>>0;
    return seed/4294967296;
  };
  for (let i=0;i<290;i++) {
    const [x,y,s]=project(plane(mix(-4.37,4.5,random()),mix(.15,13.6,random())));
    const radius=(.011+random()*.024)*s;
    ctx.fillStyle=i%7===0 ? '#ffd2aab5' : '#ffbcd33f';
    ctx.beginPath(); ctx.arc(x,y,radius,0,2*Math.PI); ctx.fill();
    if (i%29===0) {
      ctx.strokeStyle='#ffd8adad';
      ctx.lineWidth=.95;
      path([[x-radius*2.65,y],[x+radius*2.65,y]]);
      ctx.stroke();
      path([[x,y-radius*2.65],[x,y+radius*2.65]]);
      ctx.stroke();
    }
  }

  for (const side of [-1,1]) {
    const sx=side===1?3.5:-4.35;
    for (let k=0;k<3;k++) {
      const from=side===1?sx-.10*k:sx+.10*k;
      const to=side===1?2.36-.19*k:-2.65+.19*k;

    ...outlineCircle(x,z,root,y,16,facing+Math.PI/2,facing+Math.PI*1.5),
    ...outlineCircle(tx,tz,tip,y,16,facing-Math.PI/2,facing+Math.PI/2)

}

function resize() {
  const ratio=Math.min(window.devicePixelRatio||1,2);
  const canvasScale=Math.max(canvas.clientWidth/width,.5)*ratio;
  canvas.width=backdrop.width=Math.round(width*canvasScale);
  canvas.height=backdrop.height=Math.round(height*canvasScale);
  ctx=backdrop.getContext('2d');
  ctx.setTransform(canvas.width/width,0,0,canvas.height/height,0,0);
  drawCabinet();
  ctx=screen;
  render();
}
function render() {
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(backdrop,0,0);
  ctx.setTransform(canvas.width/width,0,0,canvas.height/height,0,0);
  for (const insert of inserts) drawInsert(insert,insert.flash>0);
  for (const bumper of bumpers) drawBumper(bumper);
  for (const sling of slings) if (sling.flash>0) drawSling(sling);
  drawPlunger();
  for (const flip of flippers) drawFlipper(flip);
  drawBall();
  drawPopups();
}

function prepareAudio() {
  if (!soundOn) return;
  const Audio=window.AudioContext||window.webkitAudioContext;
  if (!Audio) return;
  if (!audio) audio=new Audio();
  if (audio.state==='suspended') audio.resume().catch(()=>{});
}
function tone(frequency,duration,volume,end=frequency,type='triangle',delay=0) {
  if (!soundOn || !audio || audio.state!=='running') return;
  const start=audio.currentTime+delay;
  const oscillator=audio.createOscillator(), gain=audio.createGain();
  oscillator.type=type;
  oscillator.frequency.setValueAtTime(frequency,start);
  oscillator.frequency.exponentialRampToValueAtTime(end,start+duration);
  gain.gain.setValueAtTime(.001,start);
  gain.gain.exponentialRampToValueAtTime(volume,start+.009);
  gain.gain.exponentialRampToValueAtTime(.001,start+duration);
  oscillator.connect(gain);
  gain.connect(audio.destination);
  oscillator.start(start);
  oscillator.stop(start+duration+.01);
}
function setStatus(text) {

  const {ball}=state;
  const section=routeSections.find(part=>part.at+part.length>=distance);
  if (!section) {
    state.phase='play';
    ball.x=launchRoute.at(-1)[0];
    ball.z=launchRoute.at(-1)[1];
    ball.y=BALL_RADIUS;
    ball.vx=mix(4.0,7.4,state.launchPower);
    ball.vz=mix(6.0,11.8,state.launchPower);
    for (const insert of inserts) insert.flash=.85;
    score(100,-.32,1.34,'#ffe2ab');
    tone(488,.10,.075,560);
    tone(732,.14,.074,870,'triangle',.06);
    return;
  }
  const t=(distance-section.at)/section.length;
  ball.x=mix(section.start[0],section.end[0],t);
  ball.z=mix(section.start[1],section.end[1],t);
  ball.y=BALL_RADIUS+.04*Math.sin(Math.PI*clamp((distance-8)/10,0,1));
  ball.vx=(section.end[0]-section.start[0])/section.length*speed;
  ball.vz=(section.end[1]-section.start[1])/section.length*speed;
}
function drain() {
  state.phase='drain';
  state.drainTime=.65;
  state.drainEntry=state.ball.z;
  state.ball.vz=Math.max(5,state.ball.vz);
  state.balls--;
  showBalls();
  setStatus('BALL DRAINED');
  tone(196,.28,.12,70);
}
function finish() {
  state.phase='over';
  setStatus('');
  document.getElementById('final-score').textContent=state.score.toLocaleString('en-US');
  gameOver.hidden=false;
  replay.focus({preventScroll:true});
}

function resolveContact(x,z,radius,bounce,surfaceX=0,surfaceZ=0) {
  const {ball}=state;
  const dx=ball.x-x, dz=ball.z-z, distance=Math.hypot(dx,dz);
  if (distance>=radius+BALL_RADIUS) return null;
  const velocity=Math.hypot(ball.vx,ball.vz)||1;
  const nx=distance>1e-6 ? dx/distance : -ball.vx/velocity;
  const nz=distance>1e-6 ? dz/distance : -ball.vz/velocity;
  const push=radius+BALL_RADIUS-distance+.0005;
  ball.x+=nx*push;
  ball.z+=nz*push;
  const incoming=(ball.vx-surfaceX)*nx+(ball.vz-surfaceZ)*nz;
  if (incoming>=0) return null;
  ball.vx-=(1+bounce)*incoming*nx;
  ball.vz-=(1+bounce)*incoming*nz;
  return {nx,nz,incoming};
}
function collideRail(rail) {
  const {ax,az,bx,bz,r,bounce,sling}=rail;
  const {ball}=state;
  const dx=bx-ax,dz=bz-az;
  const t=clamp(((ball.x-ax)*dx+(ball.z-az)*dz)/(dx*dx+dz*dz),0,1);
  const hit=resolveContact(ax+dx*t,az+dz*t,r,bounce);
  if (hit && sling && sling.flash<.045 && hit.incoming<-1.3) {
    ball.vx+=hit.nx*4.6;
    ball.vz+=hit.nz*4.6;
    sling.flash=.24;
    score(50,ball.x,ball.z,'#ffc6b6');
    tone(240,.10,.085,355);
  }
}
function collideBumper(bumper) {
  const hit=resolveContact(bumper.x,bumper.z,bumper.r+.04,.96);
  if (!hit || bumper.flash>.29 || hit.incoming>-.55) return;
  const {ball}=state;
  const outward=ball.vx*hit.nx+ball.vz*hit.nz;
  const kick=Math.max(5.8,12.5-outward);
  ball.vx+=hit.nx*kick;
  ball.vz+=hit.nz*kick;
  bumper.flash=.37;
  score(bumper.points,bumper.x,bumper.z,bumper.light);
  tone(bumper.pitch,.13,.13,bumper.pitch*1.36,'sine');
}
function collideFlipper(flip) {
  const {ball}=state;
  const {angle,dir,x,z,length,omega}=flip;
  const dx=dir*Math.cos(angle),dz=Math.sin(angle);
  const t=clamp((ball.x-x)*dx+(ball.z-z)*dz,0,length);
  const vx=-dir*Math.sin(angle)*omega*t, vz=Math.cos(angle)*omega*t;
  const r=mix(.222,.129,t/length);
  const hit=resolveContact(x+dx*t,z+dz*t,r,.79,vx,vz);
  if (hit && omega<-2 && hit.nz<-.13) {
    ball.vz=Math.min(ball.vz,-(9+11*t/length));
    ball.vx+=dir*(1.1+2.0*t/length);
  }
}
function playBall(dt) {
  const {ball}=state;
  ball.vz+=7.75*dt;
  const magnitude=Math.hypot(ball.vx,ball.vz);
  const drag=Math.max(0,1-dt*(.16+.009*magnitude));
  const damping=magnitude>34 ? 34/magnitude : 1;
  ball.vx*=drag*damping;
  ball.vz*=drag*damping;
  ball.x+=ball.vx*dt;
  ball.z+=ball.vz*dt;
  for (const rail of walls) collideRail(rail);
  for (const [x,z,r] of posts) resolveContact(x,z,r,.80);
  for (const bumper of bumpers) collideBumper(bumper);
  for (const flip of flippers) collideFlipper(flip);
  const outlane=ball.z>13.01 && (ball.x<-3.47 || ball.x>3.13);
  if (outlane || ball.z>13.68 || Math.abs(ball.x)>4.66 || ball.z<.02) {
    drain();
  } else {
    state.stuck=magnitude<.75 ? state.stuck+dt : 0;
    if (state.stuck>1.0) {
      ball.vx=ball.x<0 ? 2.25 : -2.25;
      ball.vz=4;
      state.stuck=0;
    }
  }
}
function update(dt) {
  for (const flip of flippers) {
    const target=inputs[flip.control].size ? -.62 : .47;
    const rate=inputs[flip.control].size ? 24 : 15;
    const delta=clamp(target-flip.angle,-rate*dt,rate*dt);
    flip.angle+=delta;
    flip.omega=delta/dt;
  }
  for (const item of [...bumpers,...slings,...inserts]) item.flash=Math.max(0,item.flash-dt);
  for (let i=state.popups.length-1;i>=0;i--) {
    state.popups[i].life-=dt;
    if (state.popups[i].life<=0) state.popups.splice(i,1);
  }
  switch (state.phase) {
    case 'ready':
      if (inputs.launch.size) {
        state.charge=Math.min(1,state.charge+dt*1.18);
        state.ball.z=12.59+state.charge*.64;
      }
      break;
    case 'launch': moveOnOrbit(dt); break;
    case 'play': playBall(dt); break;
    case 'drain':
      state.ball.z+=state.ball.vz*dt;
      state.drainTime-=dt;
      if (state.drainTime<=0) {
        if (state.balls>0) readyBall();
        else finish();
      }
      break;
  }
}

function input(control,source,down,cancel=false) {
  const sources=inputs[control];
  const wasDown=sources.size>0;
  if (down) sources.add(source);
  else sources.delete(source);
  const isDown=sources.size>0;
  buttons[control].setAttribute('aria-pressed',String(isDown));
  if (down && !wasDown) {
    prepareAudio();
    if (control!=='launch' && state.phase!=='over') tone(control==='left'?132:163,.053,.055,77);
    if (control==='launch' && state.phase==='ready') setStatus('RELEASE TO LAUNCH');
  }
  if (control==='launch' && wasDown && !isDown && state.phase==='ready') {
    if (cancel) readyBall();
    else launch();
  }
}
function clearInputs() {
  for (const control of Object.keys(inputs)) {
    for (const source of inputs[control]) input(control,source,false,true);
  }
}
const keyBindings={
  ArrowLeft:'left', KeyA:'left', KeyZ:'left', ShiftLeft:'left',
  ArrowRight:'right', KeyD:'right', Slash:'right', ShiftRight:'right',
  Space:'launch', ArrowDown:'launch'
};
window.addEventListener('keydown',event=>{
  if (event.ctrlKey||event.metaKey||event.altKey) return;
  if (event.code==='KeyF' && !event.repeat) {
    event.preventDefault();
    toggleFullscreen();
    return;
  }
  if (state.phase==='over') {
    if (event.code==='Enter' && !event.repeat) {
      event.preventDefault();
      restart();
    }
    return;
  }
  const control=keyBindings[event.code];
  if (!control || (event.code==='Space' && event.target.closest?.('.icon-btn'))) return;
  event.preventDefault();
  if (!event.repeat) input(control,event.code,true);
});
window.addEventListener('keyup',event=>{
  const control=keyBindings[event.code];
  if (!control || !inputs[control].has(event.code)) return;
  event.preventDefault();
  input(control,event.code,false);
});
window.addEventListener('blur',clearInputs);
document.addEventListener('visibilitychange',()=>{ if (document.hidden) clearInputs(); });
for (const [control,button] of Object.entries(buttons)) {
  const pointerKey=event=>'pointer:'+event.pointerId;
  button.addEventListener('pointerdown',event=>{
    if (event.button!==0 || state.phase==='over') return;
    event.preventDefault();
    button.setPointerCapture(event.pointerId);
    input(control,pointerKey(event),true);
  });
  button.addEventListener('pointerup',event=>input(control,pointerKey(event),false));
  button.addEventListener('pointercancel',event=>input(control,pointerKey(event),false,true));
  button.addEventListener('lostpointercapture',event=>input(control,pointerKey(event),false,true));
}
replay.addEventListener('click',restart);
soundButton.addEventListener('click',()=>{
  soundOn=!soundOn;
  soundButton.setAttribute('aria-pressed',String(soundOn));
  soundButton.querySelector('span').textContent=soundOn?'SOUND ON':'SOUND OFF';
  if (soundOn) prepareAudio();
});
function toggleFullscreen() {
  if (document.fullscreenElement) document.exitFullscreen().catch(()=>{});
  else document.documentElement.requestFullscreen?.().catch(()=>{});
}
fullscreenButton.addEventListener('click',toggleFullscreen);
document.addEventListener('fullscreenchange',()=>{
  fullscreenButton.setAttribute('aria-pressed',String(Boolean(document.fullscreenElement)));
  resize();
});
if (!document.fullscreenEnabled) fullscreenButton.hidden=true;

let accumulator=0, last=performance.now(), manual=false;
function step(seconds) {
  accumulator+=seconds;
  while (accumulator>=STEP) {
    update(STEP);
    accumulator-=STEP;
  }
}
function animate(now) {
  if (!manual && !document.hidden) {
    step(clamp((now-last)/1000,0,.05));
    render();
  }
  last=now;
  requestAnimationFrame(animate);
}
window.advanceTime=ms=>{
  if (!manual) { manual=true; accumulator=0; }
  step(Math.max(0,ms/1000));
  render();
};
window.render_game_to_text=()=>JSON.stringify({
  coordinates:'table units, x right, z down the table, y above the deck',
  phase:state.phase,score:state.score,best,ballsLeft:state.balls,plungerCharge:+state.charge.toFixed(3),
  ball:Object.fromEntries(Object.entries(state.ball).map(([key,value])=>[key,+value.toFixed(3)])),
  flippers:Object.fromEntries(flippers.map(flip=>[flip.control,+flip.angle.toFixed(3)])),
  bumpers:bumpers.map(bumper=>({x:bumper.x,z:bumper.z,points:bumper.points,lit:bumper.flash>0})),
  orbitLit:inserts.some(insert=>insert.flash>0)
});
showScore();
showBalls();
resize();
new ResizeObserver(resize).observe(canvas);
requestAnimationFrame(animate);
</script>
</body>
</html>
