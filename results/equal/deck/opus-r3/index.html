<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A Field Guide to Club Merch — Pins, Tees &amp; Patches for Four School Clubs</title>
<style>
:root{
  --ink:#1E2B26;--paper:#F1E8D2;--card:#FBF6EA;--rule:#BFAE86;--muted:#6E6248;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:"Avenir Next","Segoe UI","Helvetica Neue",Arial,sans-serif;
  --cond:"Avenir Next Condensed","Arial Narrow","Roboto Condensed","Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#25221c;overflow:hidden}
#sprite{position:absolute;width:0;height:0;overflow:hidden}

/* artwork line classes (used inside SVG symbols; --line lets pins swap ink for gold metal) */
.k,.k3,.k2{stroke:var(--line,#1E2B26);stroke-linejoin:round;stroke-linecap:round}
.k{stroke-width:4}.k3{stroke-width:3}.k2{stroke-width:2}
.kl{fill:none;stroke:var(--line,#1E2B26);stroke-linecap:round;stroke-linejoin:round}
.ko{fill:var(--line,#1E2B26);stroke:var(--line,#1E2B26);stroke-width:8;stroke-linejoin:round}
.t{font-family:var(--cond);font-weight:800}

/* stage */
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:50% 50%;
  box-shadow:0 30px 80px rgba(0,0,0,.45)}
.slide{position:absolute;inset:0;padding:30px 56px 64px;display:flex;flex-direction:column;
  background:
    radial-gradient(circle at 18% 12%,rgba(255,255,255,.55),transparent 42%),
    radial-gradient(circle at 88% 92%,rgba(150,115,50,.13),transparent 46%),
    repeating-linear-gradient(0deg,rgba(120,100,60,.03) 0 1px,transparent 1px 4px),
    var(--paper);
  color:var(--ink);font-family:var(--serif);
  opacity:0;visibility:hidden;transition:opacity .4s ease,visibility 0s linear .4s}
.slide.active{opacity:1;visibility:visible;transition:opacity .4s ease}
.slide::before{content:"";position:absolute;inset:14px;border:1px solid var(--rule);pointer-events:none}
.slide::after{content:"";position:absolute;inset:18px;border:.5px solid rgba(191,174,134,.55);pointer-events:none}
.run{display:flex;justify-content:space-between;align-items:center;font:600 11px/1 var(--sans);
  letter-spacing:.2em;text-transform:uppercase;color:var(--muted);padding:6px 0 9px;border-bottom:1px solid var(--rule)}
.run b{color:var(--ink);font-weight:700}
.run .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--acc,var(--ink));margin-right:8px;vertical-align:-1px}
h1{font:600 32px/1.14 var(--serif);margin:16px 0 18px;max-width:1130px;letter-spacing:-.005em;text-wrap:balance}
.body{flex:1;min-height:0}
.foot{position:absolute;left:56px;right:56px;bottom:26px;display:flex;justify-content:space-between;align-items:center;
  font:500 10.5px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
  border-top:1px solid var(--rule);padding-top:8px}
.foot .hint{letter-spacing:.08em;text-transform:none;font-size:11px}
.progress{position:absolute;left:0;bottom:0;height:4px;background:var(--ink);transition:width .4s ease;z-index:5}
.kicker{font:700 11px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
code{font-family:var(--mono);font-size:.86em}

/* cover */
.coverbody{display:grid;grid-template-columns:1fr 470px;gap:44px;align-items:center}
.cover h1.big{font-size:47px;line-height:1.07;margin:16px 0 20px;max-width:640px}
.lede{font-size:19px;line-height:1.45;max-width:610px;margin:0;color:#3a392f}
.stats{display:flex;gap:34px;margin-top:28px}
.stats div{border-top:2px solid var(--ink);padding-top:8px;min-width:96px}
.stats b{display:block;font:600 40px/1 var(--serif)}
.stats span{font:600 11px/1.4 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.emblem{width:470px;height:470px;display:block}

/* overview */
.ov{display:flex;flex-direction:column;gap:18px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.mcard{background:var(--card);border:1px solid var(--rule);padding:12px 16px 16px;text-align:center;position:relative}
.mtop{display:flex;justify-content:space-between;font:600 10.5px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.mhalo{position:relative;width:170px;height:170px;margin:8px auto 4px}
.mhalo::before{content:"";position:absolute;inset:14px;border-radius:50%;background:var(--tint)}
.mhalo svg{position:relative;width:170px;height:170px}
.mname{font:600 19px/1.2 var(--serif)}
.msci{font:italic 14px/1.3 var(--serif);color:var(--muted)}
.mclub{font:700 11px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--dark);margin:10px 0 8px}
.mjoke{font:italic 16px/1.3 var(--serif);border-top:1px dashed var(--rule);padding-top:9px}
.system{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;border-top:2px solid var(--ink);padding-top:12px}
.system b{display:block;font:700 12px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px}
.system span{font-size:14.5px;line-height:1.4;color:#3a392f}

/* species */
.species{display:grid;grid-template-columns:540px 1fr;gap:36px}
.specimen{position:relative;background:var(--card);border:1px solid var(--rule);display:flex;align-items:center;justify-content:center;overflow:hidden}
.specimen::before{content:"";position:absolute;inset:9px;border:1px dashed rgba(191,174,134,.8)}
.specimen .halo{position:absolute;width:350px;height:350px;border-radius:50%;background:var(--tint);top:50%;left:50%;transform:translate(-50%,-52%)}
.specimen svg.big{position:relative;width:350px;height:350px;margin-top:-18px}
.specimen .pno{position:absolute;top:20px;left:22px}
.specimen .clubchip{position:absolute;top:16px;right:20px;font:700 11px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;
  background:var(--acc);color:#FBF6EA;padding:6px 10px;border-radius:20px}
.specimen .tag{position:absolute;left:22px;right:22px;bottom:18px;font:italic 14px/1.35 var(--serif);color:var(--muted);
  border-top:1px solid var(--rule);padding-top:8px}
.notes{display:flex;flex-direction:column}
.notes dl{display:grid;grid-template-columns:150px 1fr;margin:10px 0 0}
.notes dt,.notes dd{border-bottom:1px dotted var(--rule);padding:8px 0}
.notes dt{font:700 10.5px/1.7 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.notes dd{margin:0;font-size:16.5px;line-height:1.3}
.joke{margin-top:16px;background:var(--tint);border-left:6px solid var(--acc);padding:12px 18px 13px}
.joke .line{font:800 27px/1.1 var(--cond);text-transform:uppercase;letter-spacing:.02em;color:var(--dark);margin:6px 0 6px}
.joke p{margin:0;font-size:15px;line-height:1.4}
.swatches{display:flex;gap:20px;margin-top:auto;padding-top:12px}
.sw{display:flex;align-items:center;gap:8px}
.sw span{width:26px;height:26px;border-radius:50%;border:1.5px solid rgba(30,43,38,.5)}
.sw b{display:block;font:600 12px/1.2 var(--sans)}
.sw code{font-size:11px;color:var(--muted)}

/* formats */
.formats{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.fcard{background:var(--card);border:1px solid var(--rule);padding:12px 18px 16px;display:flex;flex-direction:column}
.fig{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--rule);padding-bottom:8px}
.fig b{font:600 17px/1 var(--serif)}
.fig b i{font-style:normal;color:var(--dark);margin-right:6px}
.fig span{font:600 11px/1 var(--mono);color:var(--muted)}
.artwrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.fcard .pin,.fcard .patch{width:286px;height:286px}
.fcard .tee{width:290px;height:309px}
.fcard p{margin:0;font-size:15px;line-height:1.42;border-top:1px dashed var(--rule);padding-top:10px}

/* lineup */
.lineup{display:grid;grid-template-columns:92px repeat(4,1fr);grid-template-rows:30px repeat(3,1fr);gap:8px 14px;height:100%}
.lh{font:700 11.5px/30px var(--sans);letter-spacing:.16em;text-transform:uppercase;text-align:center;border-bottom:2px solid var(--acc)}
.lh span{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--acc);margin-right:7px}
.rl{font:600 16px/1.2 var(--serif);display:flex;align-items:center;border-right:1px solid var(--rule)}
.cell{background:var(--card);border:1px solid var(--rule);display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden}
.cell .pin,.cell .patch{width:134px;height:134px}
.cell .tee{width:128px;height:137px}

/* production */
.prod{display:flex;flex-direction:column;gap:12px}
.specs{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.spec{background:var(--card);border:1px solid var(--rule);padding:10px 14px 10px 10px;display:grid;grid-template-columns:86px 1fr;gap:10px;align-items:start}
.spec .pin,.spec .patch{width:86px;height:86px}
.spec .tee{width:86px;height:92px}
.spec h3{margin:2px 0 6px;font:600 17px/1.15 var(--serif)}
.spec h3 span{display:block;font:600 10.5px/1.45 var(--mono);color:var(--dark,#7a4d12)}
.spec dl{margin:0;display:grid;grid-template-columns:70px 1fr;gap:3px 8px;font-size:12.6px;line-height:1.3}
.spec dt{font:700 9.5px/1.6 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.spec dd{margin:0}
.colours{display:grid;grid-template-columns:1fr 360px;gap:22px;flex:1;min-height:0}
.ctab{width:100%;border-collapse:collapse;font-size:13px;line-height:1.3}
.ctab th{font:700 10px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 8px 7px 0;border-bottom:2px solid var(--ink)}
.ctab td{padding:7px 8px 7px 0;border-bottom:1px dotted var(--rule);vertical-align:middle}
.ctab tr.shared td{border-bottom:none;padding-top:8px}
.chip{display:inline-block;width:13px;height:13px;border-radius:3px;border:1px solid rgba(30,43,38,.45);vertical-align:-2px;margin-right:5px}
.chip.gold{background:linear-gradient(135deg,#F6DE97,#C9A04A 55%,#E9C66E)}
.rules{background:var(--card);border:1px solid var(--rule);padding:12px 16px}
.rules ol{margin:8px 0 0;padding-left:20px;font-size:13.6px;line-height:1.38}
.rules li{margin-bottom:6px}
.rules li::marker{font-weight:700}

</style>
</head>

/* ===================== SLIDES ===================== */
const slide = (run, inner, style='', cls='') =>

function cover(){

  const art = `<svg class="emblem" viewBox="0 0 460 460" role="img" aria-label="Field guide emblem showing the four club mascots">
    <circle cx="230" cy="230" r="226" fill="#FBF6EA" stroke="#1E2B26" stroke-width="2.5"/>

function overview(){
  return slide('Introduction · How to read this guide', `

    <div class="body ov">
      <div class="grid4">${CLUBS.map(c=>`
        <div class="mcard" style="${vars(c)}">

        <div><b>Same layout</b><span>Every club gets two plates: a species page (mascot + joke), then a formats page (pin, tee, patch).</span></div>
        <div><b>Same ink</b><span>One dark ink, <code>#1E2B26</code>, for every outline and letter — it turns to gold metal on pins.</span></div>
        <div><b>One accent each</b><span>Green, orange, blue, pink: the mascot’s body colour <em>is</em> the club colour.</span></div>
        <div><b>One light joke</b><span>A single in-joke per club that members get instantly and nobody else is excluded from.</span></div>
      </div>
    </div>`);
}

function species(c){
  return slide(`<span class="dot"></span>Plate ${c.plate} · <b>${c.club}</b> · Species`, `
    <h1>${c.titleS}</h1>
    <div class="body species">
      <div class="specimen">
        <div class="kicker pno">Plate ${c.plate} · Fig. 1</div>
        <div class="clubchip">${c.club}</div>

          <dt>Common name</dt><dd>${c.nick}</dd>
          <dt>Scientific name</dt><dd><i>${c.sci}</i></dd>

function formats(c){
  const card = (L, name, dim, art, cap) => `
    <div class="fcard"><div class="fig"><b><i>Fig. ${L}</i>${name}</b><span>${dim}</span></div>

  return slide(`<span class="dot"></span>Plate ${c.plate} · <b>${c.club}</b> · Formats`, `

function lineup(){
  const rows = [['pin','Enamel pin'],['tee','T-shirt'],['patch','Backpack patch']];

function production(){
  const ref = CLUBS[0];
  const chip = h => `<span class="chip" style="background:${h}"></span>`;
  const spec = (art, title, size, rows) => `

  return slide('Production brief · Sizes &amp; colour', `

      <div class="specs">

          ['Back','2 posts + rubber clutches; backstamp “Field Guide · [Club]”'],
          ['Minimum','Metal line 0.3 mm · text cap height 1.5 mm']])}

          ['Method','Screen print, water-based inks, Natural 100% cotton, XS–XXL'],

          ['Tints','Light tints as halftones; highlights knock out to garment'],
          ['Minimum','Line 1 mm · text cap height 5 mm']])}
        ${spec(patch(ref),'Backpack patch','Ø 76 mm (3″) · 3 mm merrowed edge',[
          ['Method','Embroidered, 75% coverage on club-tint twill'],
          ['Colours','Max 7 threads; merrow border always in Ink'],
          ['Back','Iron-on plus sew-on (recommended for backpacks)'],
          ['Minimum','Satin line 1.2 mm · text cap height 4 mm']])}
      </div>
      <div class="colours">
        <table class="ctab">
          <thead><tr><th>Club</th><th>Accent · mascot body</th><th>Support colours</th><th>Patch twill</th></tr></thead>
          <tbody>
            ${CLUBS.map(c=>`<tr><td><b>${c.club}</b></td>
              <td>${chip(c.acc)}${c.accName} <code>${c.acc}</code> · PMS ${c.pms}</td>
              <td>${c.support.map(([n,h,p])=>`${chip(h)}${n} <code>${h}</code> · PMS ${p}`).join('<br>')}</td>
              <td>${chip(c.tint)}<code>${c.tint}</code></td></tr>`).join('')}
            <tr class="shared"><td><b>All clubs</b></td><td colspan="3">${chip('#1E2B26')}Ink <code>#1E2B26</code> · PMS 5535 C &nbsp;·&nbsp; ${chip('#F6EEDB')}Cream pin field <code>#F6EEDB</code> &nbsp;·&nbsp; <span class="chip gold"></span>Gold plating (pin lines) &nbsp;·&nbsp; ${chip('#F1E7CD')}Natural tee</td></tr>
          </tbody>
        </table>
        <div class="rules">
          <div class="kicker">Colour instructions</div>
          <ol>
            <li><b>Ink carries every outline and letter</b>; on pins it becomes gold metal, on patches the merrow thread.</li>
            <li><b>Accents are fixed per club</b> — the mascot’s body colour is never swapped between clubs.</li>
            <li><b>Backgrounds:</b> cream on pins, club tint on patch twill, Natural garment on tees.</li>
            <li><b>PMS codes are nearest matches</b> — sign off a physical proof of each piece before the run.</li>
          </ol>
        </div>
      </div>
    </div>`);
}

/* ===================== BUILD + NAVIGATION ===================== */
const stage = document.getElementById('stage');
stage.innerHTML = [cover(), overview(), ...CLUBS.flatMap(c=>[species(c), formats(c)]), lineup(), production()].join('')
  + '<div class="progress"></div>';

const slides = [...stage.querySelectorAll('.slide')];
const N = slides.length;
slides.forEach((s,i)=>{
  s.querySelector('.pg').textContent = String(i+1).padStart(2,'0') + ' / ' + String(N).padStart(2,'0');
  if(i===0) s.querySelector('.hint').textContent = 'Use ← → arrow keys to turn the pages';
});
const bar = stage.querySelector('.progress');
let cur = 0;

function go(n){
  n = Math.max(0, Math.min(N-1, n));
  slides[cur].classList.remove('active');
  cur = n;
  slides[cur].classList.add('active');
  bar.style.width = ((cur+1)/N*100) + '%';
  if(location.hash !== '#'+(cur+1)) history.replaceState(null,'','#'+(cur+1));
}
addEventListener('keydown', e=>{
  if(e.altKey||e.ctrlKey||e.metaKey) return;
  if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){ e.preventDefault(); go(cur+1); }
  else if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){ e.preventDefault(); go(cur-1); }
  else if(e.key==='Home'){ e.preventDefault(); go(0); }
  else if(e.key==='End'){ e.preventDefault(); go(N-1); }
});

function fit(){
  const s = Math.min(innerWidth/1280, innerHeight/720);
  stage.style.transform = `translate(-50%,-50%) scale(${s})`;
}
addEventListener('resize', fit); fit();
addEventListener('hashchange', ()=>{ const h = parseInt(location.hash.slice(1),10); if(h) go(h-1); });
go((parseInt(location.hash.slice(1),10)||1)-1);
</script>
</body>
</html>
