<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#202b24">
<title>Clubcraft — A Field Guide to Club Merch</title>
<style>
  :root {
    color-scheme: light;
    --shell: #202b24;
    --outer-text: #e9e6d3;
    --outer-muted: #b6bdad;
    --paper: #f6efd9;
    --ink: #25352b;
    --cream: #fff3d9;
    --muted: #526050;
    --rule: #b9b7a2;
    --serif: Georgia, 'Times New Roman', serif;
    --sans: 'Trebuchet MS', Arial, sans-serif;
    --mono: ui-monospace, 'Courier New', monospace;
  }

  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: var(--shell); color: var(--ink); font-family: var(--sans); }
  button { font: inherit; }
  button:focus-visible { outline: 2px solid #edce84; outline-offset: 3px; }
  [hidden] { display: none !important; }
  .svg-library { display: block; width: 0; height: 0; position: absolute; overflow: hidden; }
  .app {
    height: 100vh;
    height: 100dvh;
    display: grid;
    grid-template-rows: 62px minmax(0, 1fr) 72px;
    justify-items: center;
    padding-inline: 34px;
  }
  .deck-header, .deck-footer {
    width: var(--stage-width, min(100%, 1440px));
    display: flex;
    align-items: center;
    color: var(--outer-text);
  }
  .deck-header { justify-content: space-between; }
  .deck-brand { display: flex; gap: 10px; align-items: center; font-family: var(--serif); font-size: 21px; font-weight: bold; }
  .deck-brand svg { width: 25px; height: 25px; color: #e4cc91; }
  .deck-edition, .key-hint, .page-count {
    font: 11px/1.35 var(--mono);
    font-weight: 700;
    letter-spacing: .11em;
    text-transform: uppercase;
  }
  .deck-edition { color: var(--outer-muted); }
  .stage-frame {
    width: 100%;
    min-width: 0;
    min-height: 0;
    display: grid;
    place-items: center;
  }
  .viewport {
    width: var(--stage-width);
    height: var(--stage-height);
    position: relative;
    overflow: hidden;
    background: var(--paper);
    box-shadow: 0 10px 36px #12191565, 0 0 0 1px #f6efd933;
  }
  .stage {
    width: 1440px;
    height: 810px;
    position: absolute;
    transform-origin: top left;
    transform: scale(var(--stage-scale, 1));
  }
  .slide {
    position: absolute;
    inset: 0;
    overflow: hidden;
    background: var(--paper);
    animation: page-in 260ms ease-out both;
  }
  @keyframes page-in {
    from { opacity: .55; transform: translateX(var(--turn, 7px)); }
    to { opacity: 1; transform: translateX(0); }
  }
  .grain { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .2; pointer-events: none; z-index: 2; }
  .deck-footer { gap: 18px; }
  .page-count { white-space: nowrap; font-size: 12px; }
  .page-count span { color: var(--outer-muted); }
  .page-index { display: flex; flex: 1; min-width: 0; gap: 5px; align-items: center; }
  .page-index button {
    padding: 0;
    height: 24px;
    flex: 1 1 0;
    min-width: 0;
    border: 0;
    background: transparent;
    cursor: pointer;
    color: #899486;
  }
  .page-index button::after { content: ''; display: block; height: 3px; background: currentColor; transition: height 150ms, color 150ms; }
  .page-index button.past { color: #b8bca4; }
  .page-index button[aria-current="step"] { color: #ebce8d; }
  .page-index button:hover::after, .page-index button[aria-current="step"]::after { height: 5px; }
  .key-hint { color: var(--outer-muted); white-space: nowrap; }
  .deck-controls { display: flex; gap: 6px; }
  .deck-controls button {
    width: 38px;
    height: 36px;
    padding: 7px;
    display: grid;
    place-items: center;
    border: 1px solid #68776a;
    border-radius: 3px;
    background: transparent;
    color: var(--outer-text);
    cursor: pointer;
    transition: background 150ms, color 150ms;
  }
  .deck-controls svg { width: 19px; height: 19px; }
  .deck-controls button:hover:enabled { background: var(--paper); color: var(--ink); }
  .deck-controls button:disabled { color: #869389; opacity: .65; cursor: default; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  h1, h2, h3, p, figure { margin: 0; }
  h1, h2, h3 { font-family: var(--serif); }
  .eyebrow, .label, .running, .cover-formats {
    font: 700 15px/1.35 var(--mono);
    letter-spacing: .14em;
    text-transform: uppercase;
  }
  .running {
    position: absolute;
    left: 72px;
    right: 72px;
    bottom: 31px;
    display: flex;
    justify-content: space-between;
    padding-top: 13px;
    border-top: 1px solid var(--rule);
    color: var(--muted);
    font-size: 13px;
  }
  .slide-heading { position: relative; z-index: 3; margin: 47px 72px 0; }
  .slide-heading .eyebrow, .field-copy .eyebrow {
    display: flex;
    align-items: center;
    gap: 13px;
    color: var(--muted);
  }
  .slide-heading .eyebrow::before, .field-copy .eyebrow::before {
    content: '';
    display: inline-block;
    width: 27px;
    height: 4px;
    background: var(--accent, var(--ink));
  }
  .slide-heading h2 {
    margin-top: 12px;
    font-size: 64px;
    line-height: 1.02;
    letter-spacing: -.058em;
  }
  .slide-heading p { margin-top: 12px; font-size: 21px; color: var(--muted); }
  .cover { background: #f8f0d9; }
  .cover-copy { position: absolute; inset: 48px auto 0 72px; width: 590px; z-index: 3; }
  .cover-kicker { display: inline-flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--rule); padding: 0 0 16px; color: var(--muted); }
  .cover-kicker svg { width: 24px; height: 24px; }
  .cover h1 { margin: 49px 0 26px -6px; font-size: 111px; line-height: .91; letter-spacing: -.082em; }
  .cover h1 em { color: #546449; font-weight: 400; }
  .cover-copy p { max-width: 426px; font-size: 24px; line-height: 1.43; color: var(--muted); }
  .cover-formats {
    width: 523px;
    position: absolute;
    top: 641px;
    padding-top: 20px;
    border-top: 1px solid var(--rule);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 7px;
    font-size: 13px;
  }
  .cover-formats i { width: 5px; height: 5px; background: #8c936e; transform: rotate(45deg); }
  .cover-art { position: absolute; inset: 0 0 0 675px; background: #334638; color: #eee9ce; }
  .cover-art > svg { width: 100%; height: 100%; display: block; }
  .cover-art .cover-stamp { position: absolute; bottom: 41px; left: 65px; right: 65px; display: flex; justify-content: space-between; opacity: .9; font-size: 13px; }
  .cover-art .cover-plate { position: absolute; top: 52px; left: 65px; right: 65px; display: flex; justify-content: space-between; opacity: .9; font-size: 13px; }
  .cover-art .cover-plate span:first-child::before, .cover-art .cover-stamp span:first-child::before { content: '+ '; color: #e8cc90; }
  .cover h1, .cover-copy p { animation: rise 470ms ease-out both; }
  .cover-copy p { animation-delay: 75ms; }
  @keyframes rise { from { transform: translateY(12px); opacity: .2; } to { transform: translateY(0); opacity: 1; } }

  .index-grid { display: grid; grid-template-columns: repeat(4, 1fr); margin: 42px 72px 0; border-block: 1px solid var(--rule); }
  .index-entry { padding: 25px 22px 28px; position: relative; }
  .index-entry + .index-entry { border-left: 1px solid var(--rule); }
  .index-id { color: var(--muted); display: flex; align-items: center; justify-content: space-between; }
  .index-id svg { width: 20px; height: 20px; color: var(--muted); }
  .index-entry svg.badge { display: block; width: 100%; height: 246px; margin: 10px auto 9px; }
  .index-entry h3 { letter-spacing: -.045em; font-size: 35px; line-height: 1.04; }
  .index-entry p { margin-top: 8px; color: var(--muted); font-size: 19px; }

  .field-copy { position: absolute; top: 68px; left: 72px; width: 600px; z-index: 3; }
  .field-copy h2 { font-size: 76px; letter-spacing: -.065em; line-height: .98; margin: 30px 0 22px -3px; }
  .field-copy .intro { font-size: 23px; line-height: 1.4; color: var(--muted); max-width: 487px; }
  .field-quote { max-width: 505px; padding: 20px 0 21px 23px; border-left: 5px solid var(--accent); margin: 31px 0; }
  .field-quote .label { display: block; color: var(--muted); margin-bottom: 9px; font-size: 13px; }
  .field-quote q { font-family: var(--serif); font-size: 31px; font-weight: bold; font-style: italic; line-height: 1.13; }
  .field-facts { margin: 0; display: grid; grid-template-columns: repeat(2, 1fr); max-width: 530px; border-top: 1px solid var(--rule); }
  .field-facts div { padding: 14px 12px 0 0; }
  .field-facts dt { color: var(--muted); font-size: 13px; }
  .field-facts dd { margin: 5px 0 0; font-size: 19px; line-height: 1.25; }
  .field-plate {
    position: absolute;
    inset: 49px 64px 91px 702px;
    background: var(--tint);
    border: 1px solid var(--ink);
    overflow: hidden;
  }
  .field-plate svg { display: block; width: 100%; height: 100%; }
  .field-plate-label, .field-plate-scale { position: absolute; font-size: 13px; }
  .field-plate-label { top: 23px; left: 25px; }
  .field-plate-scale { right: 23px; bottom: 19px; }

  .products { margin: 36px 72px 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .product { min-width: 0; }
  .product-art {
    width: 100%;
    height: 385px;
    display: block;
    background: var(--tint);
    border: 1px solid var(--rule);
  }
  .product figcaption { min-height: 98px; padding: 18px 3px 0; position: relative; }
  .product h3 { font-size: 30px; line-height: 1.03; letter-spacing: -.04em; }
  .product p { font-size: 18px; color: var(--muted); margin-top: 7px; }
  .product figcaption .label { position: absolute; top: 26px; right: 3px; font-size: 12px; color: var(--muted); }

  .matrix { margin: 24px 72px 0; display: grid; grid-template-columns: 255px repeat(3, 1fr); }
  .matrix > div { border-bottom: 1px solid var(--rule); }
  .matrix .col-head { padding: 0 10px 10px; color: var(--muted); text-align: center; }
  .matrix .col-head:first-child { text-align: left; padding-left: 0; }
  .matrix .row-head { display: flex; align-items: center; gap: 13px; padding-right: 12px; }
  .matrix .row-head i { width: 12px; height: 12px; background: var(--accent); border: 1px solid var(--ink); transform: rotate(45deg); }
  .matrix .row-head strong { display: block; font: bold 26px/1.05 var(--serif); letter-spacing: -.035em; }
  .matrix .row-head small { font-size: 15px; color: var(--muted); }
  .matrix .matrix-item { height: 116px; background: var(--tint); border-left: 5px solid var(--paper); }
  .matrix-item svg { display: block; height: 100%; width: 100%; }

  .production-grid { margin: 34px 72px 0; display: grid; grid-template-columns: 827px 1fr; gap: 32px; }
  .spec-table { border-collapse: collapse; width: 100%; }
  .spec-table th { text-align: left; font-size: 13px; color: var(--muted); padding: 2px 12px 12px 0; }
  .spec-table td { padding: 17px 18px 17px 0; border-top: 1px solid var(--rule); vertical-align: top; font-size: 17px; line-height: 1.36; }
  .spec-table td:first-child { width: 160px; font: bold 22px/1.1 var(--serif); }
  .spec-table td:nth-child(2) { width: 168px; font-weight: bold; }
  .palette { border: 1px solid var(--rule); padding: 18px 20px 16px; background: #eee6cd; }
  .palette h3 { font-size: 27px; line-height: 1; letter-spacing: -.045em; margin-bottom: 11px; }
  .swatch { display: grid; grid-template-columns: 25px 1fr auto; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid #c7c2aa; font-size: 16px; }
  .swatch i { display: block; width: 25px; height: 19px; border: 1px solid #25352b55; }
  .swatch code { font: 700 13px var(--mono); }
  .palette p { color: var(--muted); margin-top: 10px; font-size: 15px; line-height: 1.35; }
  .production-note { margin: 27px 72px 0; border-top: 1px solid var(--rule); padding-top: 13px; font-size: 16px; line-height: 1.4; color: var(--muted); }
  .production-note strong { color: var(--ink); margin-right: 6px; }

  @media (max-width: 640px) {
    .app { grid-template-rows: 54px minmax(0, 1fr) 64px; padding-inline: 12px; }
    .deck-header, .deck-footer { width: 100%; }
    .deck-brand { font-size: 18px; }
    .deck-edition { font-size: 9px; }
    .deck-footer { gap: 10px; }
    .key-hint { display: none; }
    .page-index { gap: 3px; }
    .page-count { font-size: 10px; }
    .deck-controls button { width: 34px; height: 32px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
</head>

  const formats = [

  const stepNumber = (value) => String(value).padStart(2, '0');

  function objectLayer(x, y, size, content) {
    return `<svg x="${x}" y="${y}" width="${size}" height="${size}" viewBox="0 0 320 320" overflow="visible" aria-hidden="true">${content}</svg>`;
  }

  function badgeBase(club) {
    return `
    <use href="#medallion" transform="translate(0 7)" fill="#1f2d25" opacity=".62"/>

    <use href="#spark" x="252" y="199" width="17" height="17" color="#25352b"/>`;
  }

  function pinBase(club) {
    return `
    <use href="#medallion" fill="url(#pin-metal)" stroke="#74552d" stroke-width="3.5" filter="url(#object-shadow)"/>

    <use href="#spark" x="244" y="197" width="17" height="17" color="#25352b"/>`;
  }

  function patchBase(club) {
    return `
    <use href="#patch-outline" fill="#25352b" stroke="#25352b" stroke-width="4" filter="url(#object-shadow)"/>
    <use href="#patch-outline" fill="url(#thread)"/>
    <use href="#patch-outline" transform="translate(12 12) scale(.925)" fill="${club.accent}" stroke="#fff3d9" stroke-width="2.1" stroke-dasharray="2.2 4.5" stroke-linecap="round"/>

    <use href="#patch-outline" transform="translate(20 20) scale(.875)" fill="url(#thread)"/>
    <path d="M69 198c18 23 50 41 91 56 40-15 72-33 91-56" fill="none" stroke="#25352b" opacity=".50" stroke-width="1.8" stroke-dasharray="2 4"/>`;
  }

  function badge(club, x, y, size, rotation = 0) {
    return `<g style="${clubColours(club)}" transform="rotate(${rotation} ${x + size / 2} ${y + size / 2})">
      ${objectLayer(x, y, size, badgeBase(club))}
      ${art(club.id, x + size * .14, y + size * .12, size * .72)}
    </g>`;
  }

  function productArt(club, format, x, y, size) {
    const mascot = (left, top, scale) => art(club.id, x + size * left, y + size * top, size * scale);
    const label = (left, top, copy, scale, tracking) =>
      `<text x="${x + size * left}" y="${y + size * top}" text-anchor="middle" font-family="ui-monospace, monospace" font-weight="bold" font-size="${size * scale}" letter-spacing="${size * tracking}" fill="#25352b">${copy}</text>`;

    let base;
    let imprint;
    if (format.id === 'tee') {
      base = art('tee-base', x, y, size);
      imprint = mascot(.315, .244, .37) + label(.5, .60, club.club.toUpperCase(), .033, .002);
    } else if (format.id === 'patch') {
      base = objectLayer(x, y, size, patchBase(club));
      imprint = mascot(.138, .07, .724) + label(.5, .79, club.name.toUpperCase(), .059, .011);
    } else {
      base = objectLayer(x, y, size, pinBase(club));
      imprint = mascot(.141, .125, .72);
    }

    return `<g style="${clubColours(club)}">${base}${imprint}</g>`;
  }

  function slide(title, label, body, className = '', styles = '', hasFolio = true) {
    return { title, label, body, className, styles, hasFolio };
  }

  function heading(eyebrow, title, detail) {
    return `<header class="slide-heading">

      <p>${detail}</p>

  }

  function coverSlide() {

        <div class="cover-kicker eyebrow"><svg aria-hidden="true"><use href="#compass"/></svg> A field guide to club merch</div>

        <p>Meet four school club mascots, drawn for enamel pins, T-shirts and stitched backpack patches.</p>
        <div class="cover-formats"><span>Enamel pins</span><i></i><span>T-shirts</span><i></i><span>Stitched patches</span></div>
      </div>
      <div class="cover-art">
        <svg viewBox="0 0 765 810" role="img" aria-label="A collection plate of Pixel the fox, Rivet the beaver, Echo the owl and Nova the axolotl">

          <g fill="#efead1" font-family="ui-monospace, monospace" font-size="13" font-weight="bold" letter-spacing="2">

          <p>${club.club} · ${club.colour}</p>

  function fieldSlide(club) {

      owl: [[403, 165], [339, 450]],
      axolotl: [[443, 165], [347, 459]]

    const [[ax, ay], [bx, by]] = anchors[club.id];
    const marks = Array.from({ length: 31 }, (_, i) => {
      const x = 217 + i * 8;
      return `M${x} 554v${i % 5 === 0 ? 12 : 6}`;
    }).join(' ');
    return slide(club.fieldTitle, `Specimen ${club.letter} · ${club.club}`, `
      <div class="field-copy">
        <div class="eyebrow">Specimen ${club.letter} &nbsp;/&nbsp; ${club.club}</div>

          ${formats.map(format => `
            <div class="matrix-item" style="${clubColours(club)}">
              <svg viewBox="0 0 320 116" role="img" aria-label="${club.name} on a ${format.name.toLowerCase()}">
                ${productArt(club, format, 105, 2, 110)}
              </svg>
            </div>`).join('')}
        `).join('')}
      </div>`);
  }

  function productionSlide() {
    const title = 'One spec keeps the collection consistent.';
    const palette = [['Shared ink', '#25352B'], ['Shared cream', '#FFF3D9'],
      ...clubs.map(club => [`${club.name} / ${club.colour}`, club.accent])];
    return slide(title, 'Production',
      heading('Production notes', title, 'Proposed dimensions and colour instructions for the first vendor samples.') +
      `<div class="production-grid">
        <table class="spec-table">
          <thead><tr><th scope="col" class="label">Format</th><th scope="col" class="label">Size</th><th scope="col" class="label">Materials &amp; colours</th></tr></thead>
          <tbody>${formats.map(format => `
            <tr><td>${format.name}</td><td>${format.size}</td><td>${format.spec}</td></tr>
          `).join('')}</tbody>
        </table>
        <aside class="palette">
          <h3>Colour targets</h3>
          ${palette.map(([name, hex]) => `<div class="swatch"><i style="background:${hex}" aria-hidden="true"></i><span>${name}</span><code>${hex}</code></div>`).join('')}
          <p>Match these digital targets to physical enamel, ink and thread swatches. Use solid fills for production.</p>
        </aside>
      </div>
      <p class="production-note"><strong>Sample approval</strong> Check small features at final size, agree on the colour matches and approve one physical sample of each format before the full run.</p>`);
  }

  const slides = [coverSlide(), indexSlide(), ...clubs.flatMap(club => [fieldSlide(club), merchandiseSlide(club)]), collectionSlide(), productionSlide()];
  const stage = document.querySelector('#stage');
  const app = document.querySelector('.app');
  const frame = document.querySelector('.stage-frame');
  const count = document.querySelector('#page-count');
  const index = document.querySelector('.page-index');
  const previous = document.querySelector('#previous');
  const next = document.querySelector('#next');
  const announcement = document.querySelector('#announcement');
  let current = -1;

  stage.innerHTML = slides.map((entry, i) => `
    <section hidden class="slide ${entry.className}" style="${entry.styles}" aria-label="${stepNumber(i + 1)} · ${entry.title}">
      ${entry.body}${texture}
      ${entry.hasFolio ? `<div class="running" aria-hidden="true"><span>Clubcraft / Field guide</span><span>${entry.label} &nbsp;·&nbsp; ${stepNumber(i + 1)}</span></div>` : ''}
    </section>`
  ).join('');
  index.innerHTML = slides.map((entry, i) => `
    <button type="button" data-page="${i}" title="${entry.title}" aria-label="Slide ${i + 1}: ${entry.title}"></button>`
  ).join('');

  const pages = Array.from(stage.children);
  const indexButtons = Array.from(index.children);

  function fit() {
    const scale = Math.min(frame.clientWidth / 1440, frame.clientHeight / 810, 1);
    app.style.setProperty('--stage-scale', scale);
    app.style.setProperty('--stage-width', `${1440 * scale}px`);
    app.style.setProperty('--stage-height', `${810 * scale}px`);
  }

  function showSlide(requestedPage) {
    const page = Math.max(0, Math.min(requestedPage, slides.length - 1));
    if (page === current) return;
    stage.style.setProperty('--turn', page < current ? '-7px' : '7px');
    if (current >= 0) pages[current].hidden = true;
    pages[page].hidden = false;
    indexButtons.forEach((button, i) => {
      button.classList.toggle('past', i < page);
      if (i === page) button.setAttribute('aria-current', 'step');
      else button.removeAttribute('aria-current');
    });
    count.innerHTML = `${stepNumber(page + 1)} <span>/ ${stepNumber(slides.length)}</span>`;
    announcement.textContent = `Slide ${page + 1} of ${slides.length}. ${slides[page].title}`;
    current = page;
    previous.disabled = current === 0;
    next.disabled = current === slides.length - 1;
  }

  previous.addEventListener('click', () => showSlide(current - 1));
  next.addEventListener('click', () => showSlide(current + 1));
  index.addEventListener('click', event => {
    const button = event.target.closest('button[data-page]');
    if (button) showSlide(Number(button.dataset.page));
  });
  document.addEventListener('keydown', event => {
    if (event.altKey || event.ctrlKey || event.metaKey || event.shiftKey || event.defaultPrevented) return;
    const keyboardPages = {
      ArrowRight: current + 1, ArrowDown: current + 1, PageDown: current + 1,
      ArrowLeft: current - 1, ArrowUp: current - 1, PageUp: current - 1,
      Home: 0, End: slides.length - 1
    };
    if (!Object.hasOwn(keyboardPages, event.key)) return;
    event.preventDefault();
    showSlide(keyboardPages[event.key]);
  });

  fit();
  new ResizeObserver(fit).observe(frame);
  showSlide(0);
</script>
</body>
</html>
