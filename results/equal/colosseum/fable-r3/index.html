<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Colosseum — interactive 3D reconstruction</title>
<style>
  :root{
    --ink:#f6ecdb; --muted:#d5c9b3; --gold:#e6bc6e; --gold-ink:#2b1e0b;
    --panel:rgba(26,20,14,.62); --line:rgba(255,236,200,.17);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#cfdfee;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  #scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}
  #scene:active{cursor:grabbing}

  .scrim{position:fixed;left:0;right:0;pointer-events:none;z-index:1}
  .scrim.top{top:0;height:150px;background:linear-gradient(rgba(20,14,8,.42),rgba(20,14,8,0))}
  .scrim.bottom{bottom:0;height:300px;background:linear-gradient(rgba(20,14,8,0),rgba(20,14,8,.5))}

  .panel{background:var(--panel);-webkit-backdrop-filter:blur(14px) saturate(1.25);backdrop-filter:blur(14px) saturate(1.25);
    border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.28)}

  header.title{position:fixed;z-index:2;top:max(18px,env(safe-area-inset-top));left:22px;pointer-events:none;text-shadow:0 1px 14px rgba(0,0,0,.45)}
  header.title .over{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);font-weight:600}
  header.title h1{font-family:var(--serif);font-weight:500;font-size:clamp(26px,3.4vw,40px);line-height:1.05;margin:6px 0 2px;letter-spacing:.01em}
  header.title .sub{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:15px}

  details.settings{position:fixed;z-index:3;top:max(18px,env(safe-area-inset-top));right:18px;width:252px;padding:0;font-size:13px}
  details.settings summary{list-style:none;cursor:pointer;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;
    font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:600;user-select:none}
  details.settings summary::-webkit-details-marker{display:none}
  details.settings summary::after{content:"";width:7px;height:7px;border-right:1.5px solid var(--gold);border-bottom:1.5px solid var(--gold);transform:rotate(-135deg) translate(-2px,-2px);transition:transform .2s}
  details.settings:not([open]) summary::after{transform:rotate(45deg) translate(-2px,-2px)}
  .settings .body{padding:2px 16px 16px;display:grid;gap:14px}
  .row-label{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px;color:var(--muted)}
  .row-label b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;margin:0;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(90deg,#f0a35c,#fff3d6 45%,#fff3d6 60%,#ee9a58)}
  input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:linear-gradient(90deg,#f0a35c,#fff3d6 45%,#fff3d6 60%,#ee9a58)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--gold);border:2px solid #fff6e2;margin-top:-7px;box-shadow:0 2px 8px rgba(0,0,0,.4)}
  input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:var(--gold);border:2px solid #fff6e2;box-shadow:0 2px 8px rgba(0,0,0,.4)}
  .seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .seg button{appearance:none;border:0;background:transparent;color:var(--muted);font:600 12px/1 var(--sans);padding:9px 0;cursor:pointer}
  .seg button+button{border-left:1px solid var(--line)}
  .seg button[aria-pressed=true]{background:var(--gold);color:var(--gold-ink)}
  .switch{display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;color:var(--muted)}
  .switch input{position:absolute;opacity:0;pointer-events:none}
  .switch i{flex:none;width:36px;height:20px;border-radius:20px;background:rgba(255,240,210,.2);position:relative;transition:background .2s}
  .switch i::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff6e2;transition:transform .2s}
  .switch input:checked+i{background:var(--gold)}
  .switch input:checked+i::after{transform:translateX(16px)}
  .switch input:focus-visible+i,.seg button:focus-visible,.views button:focus-visible,summary:focus-visible{outline:2px solid #fff;outline-offset:2px}

  .dock{position:fixed;z-index:2;left:0;right:0;bottom:0;padding:0 18px max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;align-items:flex-start;pointer-events:none}
  .dock>*{pointer-events:auto}
  .caption{max-width:440px;padding:16px 18px 15px;transition:opacity .22s ease,transform .22s ease}
  .caption.swap{opacity:0;transform:translateY(6px)}
  .caption .kicker{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:600}
  .caption h2{font-family:var(--serif);font-weight:500;font-size:23px;line-height:1.15;margin:5px 0 7px}
  .caption p{margin:0;font-size:13.8px;line-height:1.55;color:var(--muted)}
  .views{display:flex;flex-wrap:wrap;gap:8px;max-width:100%}
  .views button{appearance:none;display:inline-flex;align-items:center;gap:8px;font:600 13px/1 var(--sans);color:var(--ink);white-space:nowrap;
    padding:10px 15px 10px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);cursor:pointer;
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);transition:background .18s,color .18s,transform .18s}
  .views button:hover{transform:translateY(-1px);background:rgba(60,46,30,.72)}
  .views button .k{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:rgba(255,236,200,.14);font-size:11px;color:var(--gold)}
  .views button[aria-pressed=true]{background:var(--gold);color:var(--gold-ink);border-color:transparent}
  .views button[aria-pressed=true] .k{background:rgba(43,30,11,.16);color:var(--gold-ink)}
  .hint{position:fixed;z-index:2;right:20px;bottom:max(22px,env(safe-area-inset-bottom));font-size:12px;color:var(--muted);text-shadow:0 1px 8px rgba(0,0,0,.6);pointer-events:none;transition:opacity .8s}
  .hint.gone{opacity:0}

  #loader{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#1c1610;color:var(--ink);transition:opacity .7s ease;text-align:center;padding:24px}
  #loader.done{opacity:0;pointer-events:none}
  #loader .mark{font-family:var(--serif);font-size:30px;margin-bottom:10px}
  #loader .msg{font-size:13px;color:var(--muted);letter-spacing:.06em}

  @media (max-width:760px){
    header.title{left:16px}
    header.title .sub{font-size:13px}
    details.settings{width:216px;right:12px;top:calc(max(18px,env(safe-area-inset-top)) + 84px)}
    details.settings:not([open]){width:auto}
    details.settings summary{gap:12px;padding:10px 14px}
    .dock{padding-left:12px;padding-right:12px;gap:10px}
    .caption{max-width:none;width:100%;padding:13px 14px}
    .caption h2{font-size:19px}
    .caption p{font-size:13px;line-height:1.48}
    .views{flex-wrap:nowrap;overflow-x:auto;width:100%;padding-bottom:2px;scrollbar-width:none}
    .views::-webkit-scrollbar{display:none}
    .hint{display:none}
  }
  @media (prefers-reduced-motion:reduce){.caption,.views button{transition:none}}
</style>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
} }

</head>
<body>
<canvas id="scene" tabindex="0" aria-label="Interactive 3D model of the Colosseum. Drag to orbit, scroll to zoom."></canvas>
<div class="scrim top"></div><div class="scrim bottom"></div>

<header class="title">
  <div class="over">Rome · AD 80</div>
  <h1>The Colosseum</h1>
  <div class="sub">Amphitheatrum Flavium, as it stood when new</div>
</header>

<details class="settings panel" id="settings" open>
  <summary>Scene</summary>
  <div class="body">
    <div>
      <div class="row-label"><span>Time of day</span><b id="timeLabel">16:30</b></div>
      <input type="range" id="time" min="6.5" max="19.75" step="0.25" value="16.5" aria-label="Time of day">
    </div>
    <div>
      <div class="row-label"><span>Arena floor</span></div>
      <div class="seg" id="floorSeg" role="group" aria-label="Arena floor">
        <button type="button" data-mode="full" aria-pressed="false">Full</button>
        <button type="button" data-mode="half" aria-pressed="true">Half</button>
        <button type="button" data-mode="open" aria-pressed="false">Open</button>
      </div>
    </div>
    <label class="switch"><span>Velarium (awning)</span><input type="checkbox" id="velarium"><i></i></label>
    <label class="switch"><span>Slow rotation</span><input type="checkbox" id="rotate"><i></i></label>
  </div>
</details>

<div class="dock">
  <section class="caption panel" id="caption" aria-live="polite">
    <div class="kicker" id="capKicker"></div>
    <h2 id="capTitle"></h2>
    <p id="capText"></p>
  </section>
  <nav class="views" id="views" aria-label="Viewpoints"></nav>
</div>
<div class="hint" id="hint">Drag to orbit · scroll to zoom · right-drag to pan · keys 1–6</div>

<div id="loader"><div><div class="mark">The Colosseum</div><div class="msg" id="loaderMsg">Raising the amphitheatre…</div></div></div>

<script>
  // If the 3D engine never arrives (offline, CDN blocked), say so instead of hanging on the loader.
  setTimeout(function(){
    if(!window.__colosseumReady){
      document.getElementById('loaderMsg').textContent =
        'The 3D engine (three.js from unpkg.com) could not be loaded. Check your internet connection and reload.';
    }
  }, 12000);
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const V3 = THREE.Vector3, M4 = THREE.Matrix4;
const TAU = Math.PI * 2, DEG = Math.PI / 180;
const UP = new V3(0, 1, 0);
const clamp = THREE.MathUtils.clamp, lerp = THREE.MathUtils.lerp;

/* deterministic randomness so the model looks the same on every load */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd = mulberry32(80);

try { init(); } catch (err) {
  console.error(err);
  document.getElementById('loaderMsg').textContent = 'This browser could not start WebGL, which the 3D model needs.';
  window.__colosseumReady = true;
}

function init(){

/* ------------------------------------------------------------------ renderer */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
const coarse = matchMedia('(pointer:coarse)').matches;
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, coarse ? 1.5 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = .92;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;          // the scene is static: redraw shadows only when something changes
renderer.localClippingEnabled = true;
const maxAniso = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xcfdfee, 420, 2100);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.5, 6000);

/* ------------------------------------------------------------------ plan geometry
   Everything is laid out on curves parallel to the outer ellipse (188 x 156 m).
   u = position around the ring in bays (0..80, u=0 on the east end of the long axis),
   d = distance inward from the facade, y = height. +x is east, +z is south.        */
const A = 94, B = 78, NB = 80;
const TN = 8192, cum = new Float64Array(TN + 1);
{ let px = A, pz = 0;
  for (let i = 1; i <= TN; i++){ const t = i / TN * TAU, x = A * Math.cos(t), z = B * Math.sin(t);
    cum[i] = cum[i-1] + Math.hypot(x - px, z - pz); px = x; pz = z; } }
const PERIM = cum[TN], W0 = PERIM / NB;          // W0: width of one bay on the facade (~6.8 m)
function tAt(s){ s %= PERIM; if (s < 0) s += PERIM; let lo = 0, hi = TN;
  while (hi - lo > 1){ const m = (lo + hi) >> 1; if (cum[m] <= s) lo = m; else hi = m; }
  return (lo + (s - cum[lo]) / (cum[hi] - cum[lo])) / TN * TAU; }
function frame(u){ const t = tAt(u * W0), c = Math.cos(t), s = Math.sin(t);
  let nx = B * c, nz = A * s; const l = Math.hypot(nx, nz); nx /= l; nz /= l;
  return { x: A * c, z: B * s, nx, nz, tx: -nz, tz: nx }; }
function P(u, d, y = 0){ const f = frame(u); return new V3(f.x - d * f.nx, y, f.z - d * f.nz); }

/* instance matrices */
function chordMatrix(i, d, y){            // flat panel spanning bay i: local x along the wall, +z inward
  const a = P(i - .5, d), b = P(i + .5, d), x = b.clone().sub(a), len = x.length(); x.divideScalar(len);
  const z = new V3().crossVectors(x, UP);
  const m = new M4().makeBasis(x.clone().multiplyScalar(len / W0), UP, z);
  return m.setPosition((a.x + b.x) / 2, y, (a.z + b.z) / 2); }
function frameMatrix(u, d, y){            // local -z points out of the building
  const f = frame(u);
  return new M4().makeBasis(new V3(f.tx, 0, f.tz), UP, new V3(-f.nx, 0, -f.nz)).setPosition(f.x - d * f.nx, y, f.z - d * f.nz); }
function outMatrix(u, d, y){              // local +z points out of the building (front faces the arena)
  const f = frame(u);
  return new M4().makeBasis(new V3(-f.tx, 0, -f.tz), UP, new V3(f.nx, 0, f.nz)).setPosition(f.x - d * f.nx, y, f.z - d * f.nz); }
function slopeMatrix(u, dA, yA, dB, yB, lift){   // a strip lying on the line from (dA,yA) up to (dB,yB)
  const f = frame(u), N = new V3(f.nx, 0, f.nz);
  const s = N.clone().multiplyScalar(dA - dB).add(new V3(0, yB - yA, 0)).normalize();
  const x = new V3(-f.tx, 0, -f.tz), yv = new V3().crossVectors(s, x).normalize();
  const mid = P(u, (dA + dB) / 2, (yA + yB) / 2).addScaledVector(yv, lift);
  return new M4().makeBasis(x, yv, s).setPosition(mid); }

const merge = list => mergeGeometries(list.map(g => g.index ? g.toNonIndexed() : g), false);

/* Sweep a closed cross-section [[d,y],...] around the ring (or part of it). */
function sweep(profile, { seg = 160, u0 = 0, u1 = NB, caps = false, ao = false } = {}){
  const n = profile.length; let area = 0;
  for (let i = 0; i < n; i++){ const a = profile[i], b = profile[(i + 1) % n]; area += a[0] * b[1] - b[0] * a[1]; }
  const sgn = area > 0 ? 1 : -1, pos = [], nor = [], uv = [], idx = [], col = [];
  const frames = []; for (let j = 0; j <= seg; j++) frames.push(frame(u0 + (u1 - u0) * j / seg));
  const tri = (a, b, c) => {              // keep the winding that agrees with the vertex normal
    const ax = pos[a*3], ay = pos[a*3+1], az = pos[a*3+2];
    const e1x = pos[b*3]-ax, e1y = pos[b*3+1]-ay, e1z = pos[b*3+2]-az, e2x = pos[c*3]-ax, e2y = pos[c*3+1]-ay, e2z = pos[c*3+2]-az;
    const cx = e1y*e2z - e1z*e2y, cy = e1z*e2x - e1x*e2z, cz = e1x*e2y - e1y*e2x;
    if (cx*nor[a*3] + cy*nor[a*3+1] + cz*nor[a*3+2] < 0) idx.push(a, c, b); else idx.push(a, b, c); };
  let vAcc = 0;
  for (let e = 0; e < n; e++){
    const [d1, y1] = profile[e], [d2, y2] = profile[(e + 1) % n];
    const dd = d2 - d1, dy = y2 - y1, len = Math.hypot(dd, dy); if (len < 1e-7) continue;
    const nd = sgn * dy / len, ny = -sgn * dd / len, base = pos.length / 3;
    // darken the foot of each riser and the back of each tread so the rows read in any light
    const c1 = Math.abs(dd) < 1e-6 ? (dy > 0 ? .62 : .8) : (dd < 0 ? 1 : .85), c2 = Math.abs(dd) < 1e-6 ? (dy > 0 ? .92 : .8) : (dd < 0 ? .8 : .85);
    for (let j = 0; j <= seg; j++){ const f = frames[j], su = (u0 + (u1 - u0) * j / seg) * W0;
      pos.push(f.x - d1*f.nx, y1, f.z - d1*f.nz, f.x - d2*f.nx, y2, f.z - d2*f.nz);
      nor.push(-nd*f.nx, ny, -nd*f.nz, -nd*f.nx, ny, -nd*f.nz);
      uv.push(su, vAcc, su, vAcc + len); if (ao) col.push(c1, c1, c1, c2, c2, c2); }
    for (let j = 0; j < seg; j++){ const a = base + 2*j; tri(a, a+1, a+2); tri(a+1, a+3, a+2); }
    vAcc += len;
  }
  if (caps){
    const tris = THREE.ShapeUtils.triangulateShape(profile.map(p => new THREE.Vector2(p[0], p[1])), []);
    for (const [st, sign] of [[0, -1], [seg, 1]]){ const f = frames[st], base = pos.length / 3;
      for (const [d, y] of profile){ pos.push(f.x - d*f.nx, y, f.z - d*f.nz); nor.push(sign*f.tx, 0, sign*f.tz); uv.push(d, y); }
      for (const t of tris) tri(base + t[0], base + t[1], base + t[2]); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  if (ao && !caps) g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setIndex(idx); return g;
}
const rect = (d1, d2, y1, y2) => [[d1, y1], [d2, y1], [d2, y2], [d1, y2]];

/* A wall panel with an arched opening (yb = sill height, ys = springing height). */
function archPanel(W, H, w, yb, ys, T, curve = 9){
  const s = new THREE.Shape(), hw = W / 2, r = w / 2;
  if (yb <= 0){
    s.moveTo(-hw, 0); s.lineTo(-r, 0); s.lineTo(-r, ys); s.absarc(0, ys, r, Math.PI, 0, true);
    s.lineTo(r, 0); s.lineTo(hw, 0); s.lineTo(hw, H); s.lineTo(-hw, H); s.closePath();
  } else {
    s.moveTo(-hw, 0); s.lineTo(hw, 0); s.lineTo(hw, H); s.lineTo(-hw, H); s.closePath();
    const h = new THREE.Path(); h.moveTo(-r, yb); h.lineTo(-r, ys); h.absarc(0, ys, r, Math.PI, 0, true); h.lineTo(r, yb); h.closePath();
    s.holes.push(h);
  }
  return new THREE.ExtrudeGeometry(s, { depth: T, bevelEnabled: false, curveSegments: curve });
}
function metricBox(w, h, d){              // box whose texture coordinates are in metres
  const g = new THREE.BoxGeometry(w, h, d), uv = g.attributes.uv, dims = [[d,h],[d,h],[w,d],[w,d],[w,h],[w,h]];
  for (let f = 0; f < 6; f++) for (let k = 0; k < 4; k++){ const i = f*4 + k; uv.setXY(i, uv.getX(i) * dims[f][0], uv.getY(i) * dims[f][1]); }
  return g;
}

/* ------------------------------------------------------------------ procedural textures */
function canvasTex(size, metres, draw){
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'); draw(g, size);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(1 / metres, 1 / metres); t.anisotropy = maxAniso; return t;
}
function speckle(g, S, amt){ const img = g.getImageData(0, 0, S, S), d = img.data;
  for (let i = 0; i < d.length; i += 4){ const n = (rnd() - .5) * amt; d[i] += n; d[i+1] += n; d[i+2] += n; }
  g.putImageData(img, 0, 0); }
function blotch(g, S, n, cols, rmin, rmax, alpha){
  for (let i = 0; i < n; i++){ const x = rnd()*S, y = rnd()*S, r = rmin + rnd()*(rmax - rmin), col = cols[(rnd()*cols.length)|0];
    for (const ox of [-S, 0, S]) for (const oy of [-S, 0, S]){
      const cx = x + ox, cy = y + oy; if (cx + r < 0 || cx - r > S || cy + r < 0 || cy - r > S) continue;
      const gr = g.createRadialGradient(cx, cy, 0, cx, cy, r);
      gr.addColorStop(0, col); gr.addColorStop(1, col + '00');
      g.globalAlpha = alpha; g.fillStyle = gr; g.fillRect(cx - r, cy - r, 2*r, 2*r); } }
  g.globalAlpha = 1; }

const texTrav = canvasTex(1024, 8, (g, S) => {
  g.fillStyle = '#d7c6a4'; g.fillRect(0, 0, S, S);
  blotch(g, S, 150, ['#e8dabc', '#c2ad86', '#b6a27d', '#ecdfc5', '#cdb892'], 40, 180, .24);

  if (first){ first = false; window.__colosseumReady = true; document.getElementById('loader').classList.add('done'); }
}
tick();

} // init
</script>
