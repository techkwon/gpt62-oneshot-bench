<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Colosseum 3D · Interactive Flavian Amphitheatre</title>
<style>
  :root{
    --ink:#f7f0e3; --muted:#cdbfa6; --gold:#e6b866; --gold2:#f3d79b;
    --panel:rgba(26,19,12,.56); --line:rgba(255,232,190,.17);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#0d0b09;color:var(--ink);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased}
  #app,#app canvas{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none}
  .glass{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    -webkit-backdrop-filter:blur(12px) saturate(1.25);backdrop-filter:blur(12px) saturate(1.25);
    box-shadow:0 12px 34px rgba(0,0,0,.32)}
  .serif{font-family:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif}

  #title{position:fixed;left:18px;top:16px;padding:13px 18px 12px}
  #title h1{margin:0;font-size:21px;font-weight:600;letter-spacing:.34em;text-transform:uppercase}
  #title .sub{margin-top:4px;font-size:11.5px;letter-spacing:.09em;color:var(--muted)}

  #panel{position:fixed;right:18px;top:16px;width:292px;padding:14px 15px 12px}
  .row{margin:0 0 13px}
  .row:last-child{margin-bottom:2px}
  .row .lab{display:flex;justify-content:space-between;align-items:baseline;font-size:10.5px;
    letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
  .row .lab b{font-weight:600;color:var(--gold2);letter-spacing:.06em;font-size:12px}
  .seg{display:flex;gap:3px;padding:3px;border-radius:10px;background:rgba(0,0,0,.3)}
  .seg button{flex:1;border:0;border-radius:7px;padding:7px 6px;background:transparent;color:var(--ink);
    font:inherit;font-size:12px;cursor:pointer;opacity:.78;transition:background .2s,opacity .2s,color .2s}
  .seg button:hover{opacity:1;background:rgba(255,255,255,.07)}
  .seg button.on{opacity:1;background:linear-gradient(180deg,#f0c97c,#c99645);color:#2a1c08;font-weight:600}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;cursor:pointer;margin:0}
  input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:5px;
    background:linear-gradient(90deg,#f19a52,#ffe9b8 50%,#f19a52)}
  input[type=range]::-moz-range-track{height:5px;border-radius:5px;background:linear-gradient(90deg,#f19a52,#ffe9b8 50%,#f19a52)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;margin-top:-6px;border-radius:50%;
    background:#fff6dc;border:3px solid #d99a3e;box-shadow:0 0 12px rgba(255,200,100,.8)}
  input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:#fff6dc;border:3px solid #d99a3e}

  #views{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:6px;padding:7px;
    max-width:calc(100vw - 24px);overflow-x:auto;scrollbar-width:none}
  #views::-webkit-scrollbar{display:none}
  #views button{display:flex;align-items:center;gap:8px;white-space:nowrap;border:1px solid transparent;border-radius:10px;
    padding:9px 14px;background:rgba(255,255,255,.05);color:var(--ink);font:inherit;font-size:13px;cursor:pointer;
    transition:background .2s,border-color .2s,transform .15s}
  #views button:hover{background:rgba(255,255,255,.12);transform:translateY(-1px)}
  #views button.active{border-color:rgba(240,201,124,.75);background:rgba(240,201,124,.17)}
  #views button .k{font-size:10px;opacity:.55;border:1px solid rgba(255,255,255,.3);border-radius:4px;padding:0 4px}
  #views button svg{width:17px;height:17px;stroke:var(--gold2);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

  #caption{position:fixed;left:50%;bottom:86px;transform:translate(-50%,0);width:min(660px,calc(100vw - 28px));
    padding:15px 44px 16px 20px;transition:opacity .45s ease,transform .45s ease}
  #caption.hidden{opacity:0;transform:translate(-50%,12px);pointer-events:none}
  #caption .kick{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
  #caption h2{margin:3px 0 6px;font-size:21px;font-weight:600;letter-spacing:.03em}
  #caption p{margin:0;font-size:13.6px;line-height:1.55;color:#eadfcb}
  #caption p em{color:var(--gold2);font-style:italic}
  #caption .close{position:absolute;right:10px;top:9px;width:26px;height:26px;border-radius:50%;border:0;
    background:rgba(255,255,255,.08);color:var(--ink);cursor:pointer;font-size:15px;line-height:26px}
  #caption .close:hover{background:rgba(255,255,255,.18)}

  #hint{position:fixed;left:18px;bottom:24px;font-size:11.5px;color:var(--muted);line-height:1.6;
    text-shadow:0 1px 3px rgba(0,0,0,.7);pointer-events:none}
  #compass{position:fixed;right:18px;bottom:20px;width:54px;height:54px;padding:0;display:grid;place-items:center;border-radius:50%}
  #compass svg{width:46px;height:46px}

  #loader{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#2b2117,#0d0a07);
    z-index:10;transition:opacity .9s ease}
  #loader.gone{opacity:0;pointer-events:none}
  #loader .box{text-align:center}
  #loader .arch{width:84px;height:84px;margin:0 auto 18px;border:3px solid rgba(230,184,102,.25);border-top-color:var(--gold);
    border-radius:50%;animation:spin 1.1s linear infinite}
  #loader .t{letter-spacing:.3em;text-transform:uppercase;font-size:13px;color:var(--muted)}
  #loader .err{max-width:420px;margin-top:14px;font-size:13px;color:#ffb39a;line-height:1.5}
  @keyframes spin{to{transform:rotate(360deg)}}

  @media (max-width:900px){
    #hint{display:none}
    #panel{left:12px;right:auto;top:auto;bottom:76px;width:auto;max-width:calc(100vw - 24px);padding:10px 12px 8px;display:flex;gap:12px;flex-wrap:wrap}
    #panel .row{margin:0;min-width:150px}
    #title{left:12px;top:12px;padding:10px 14px}
    #title h1{font-size:16px}
    #caption{top:74px;bottom:auto;padding:12px 40px 12px 14px}
    #caption h2{font-size:17px}
    #caption p{font-size:12.5px}
    #compass{top:14px;bottom:auto;right:12px}
    #views{bottom:12px}
    #views button{padding:8px 11px;font-size:12px}
    #views button .k{display:none}
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.170.0/build/three.module.js",

<body>
<div id="app"></div>

<div id="title" class="glass">
  <h1 class="serif">Colosseum</h1>
  <div class="sub">Amphitheatrum Flavium · Rome · AD 80</div>
</div>

<div id="panel" class="glass">
  <div class="row">
    <div class="lab">Era</div>
    <div class="seg" id="seg-era">
      <button data-v="restored">Restored · AD 80</button>
      <button data-v="today">Today</button>

  </div>
  <div class="row">
    <div class="lab">Arena floor</div>

      <button data-v="open">Open</button>

  <div class="row">

<div id="caption" class="glass hidden" role="status" aria-live="polite">

<nav id="views" class="glass" aria-label="Viewpoints">
  <button data-view="aerial"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="13" rx="9" ry="6"/><ellipse cx="12" cy="13" rx="4.5" ry="2.6"/><path d="M12 2v4M10 4l2 2 2-2"/></svg>Aerial view<span class="k">1</span></button>
  <button data-view="exterior"><svg viewBox="0 0 24 24"><path d="M3 21V5h18v16"/><path d="M6 21v-4a2 2 0 0 1 4 0v4M14 21v-4a2 2 0 0 1 4 0v4M6 12v-2a2 2 0 0 1 4 0v2M14 12v-2a2 2 0 0 1 4 0v2"/></svg>Façade<span class="k">2</span></button>
  <button data-view="arena"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="16" rx="10" ry="4"/><path d="M12 4v8M9 7l3-3 3 3"/></svg>Arena floor<span class="k">3</span></button>
  <button data-view="hypogeum"><svg viewBox="0 0 24 24"><path d="M2 8h20M5 8v12M10 8v12M14 8v12M19 8v12M2 20h20"/><path d="M12 2v3"/></svg>Hypogeum<span class="k">4</span></button>
  <button data-view="top"><svg viewBox="0 0 24 24"><path d="M3 20l5-5 4 3 4-6 5 3"/><path d="M3 4h18M6 4v4M12 4v4M18 4v4"/></svg>Top tier<span class="k">5</span></button>
</nav>

<div id="hint">Drag to orbit · Scroll / pinch to zoom · Right‑drag or two fingers to pan<br>Keys 1–5 jump to viewpoints</div>
<div id="compass" class="glass" title="North"><svg viewBox="0 0 46 46"><circle cx="23" cy="23" r="20" fill="none" stroke="rgba(255,235,200,.25)"/><g id="needle"><path d="M23 6l5 17h-10z" fill="#e6b866"/><path d="M23 40l5-17h-10z" fill="rgba(255,255,255,.35)"/><text x="23" y="5" fill="#f3d79b" font-size="7" text-anchor="middle" font-family="sans-serif" dy="-0.5">N</text></g></svg></div>

<div id="loader"><div class="box"><div class="arch"></div><div class="t">Raising the Colosseum…</div><div class="err" id="err"></div></div></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Sky } from 'three/addons/objects/Sky.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const qs = new URLSearchParams(location.search);

/* ------------------------------------------------------------------ *
 *  Renderer / scene / camera
 * ------------------------------------------------------------------ */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.52;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.25, 6000);
camera.position.set(420, 260, 520);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 0.6;
controls.maxDistance = 900;
controls.maxPolarAngle = Math.PI * 0.96;
controls.screenSpacePanning = true;
controls.zoomToCursor = true;
controls.target.set(0, 5, 0);

const MAX_ANISO = renderer.capabilities.getMaxAnisotropy();

/* ------------------------------------------------------------------ *
 *  Utilities
 * ------------------------------------------------------------------ */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ---------- procedural canvas textures (1 UV unit = 1 metre) ---------- */
function makeTex(size, metres, seed, draw) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  draw(g, size, mulberry32(seed));
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = MAX_ANISO;
  t.repeat.set(1 / metres, 1 / metres);
  return t;
}
// draw a rect that wraps horizontally & vertically (for seamless tiling)
function wrect(g, x, y, w, h, s) {
  for (const ox of [-s, 0, s]) for (const oy of [-s, 0, s]) {
    if (x + ox + w < 0 || x + ox > s || y + oy + h < 0 || y + oy > s) continue;
    g.fillRect(x + ox, y + oy, w, h);
  }
}
function speckle(g, s, r, n, cols, a, wMin = 1, wMax = 2.5, hMul = 1) {
  for (let i = 0; i < n; i++) {
    g.globalAlpha = a * (0.3 + 0.7 * r());
    g.fillStyle = cols[(r() * cols.length) | 0];
    const w = wMin + r() * (wMax - wMin);
    wrect(g, r() * s, r() * s, w, Math.max(1, w * hMul * (0.4 + r() * 0.6)), s);
  }
  g.globalAlpha = 1;
}
function stoneBlocks(g, s, r, opt) {
  const { base, rows, ppm, hue, sat, lit, joint, pores = 4000, streaks = 30 } = opt;
  g.fillStyle = base; g.fillRect(0, 0, s, s);
  const rh = s / rows;
  for (let row = 0; row < rows; row++) {
    let x = r() * 60;
    const end = x + s;
    while (x < end) {
      const w = Math.min((1.0 + r() * 1.1) * ppm, end - x);
      g.globalAlpha = 0.4;
      g.fillStyle = `hsl(${hue + r() * 8},${sat + r() * 10}%,${lit + r() * 10}%)`;
      wrect(g, x, row * rh, w, rh, s);
      g.globalAlpha = 1;
      g.fillStyle = joint; wrect(g, x, row * rh, 2, rh, s);
      x += w;
    }
    g.fillStyle = joint; wrect(g, 0, row * rh, s, 2, s);
  }
  // horizontal travertine pores
  speckle(g, s, r, pores, ['#7a6448', '#8d7759', '#a38c6b', '#5f4f3b'], 0.5, 2, 9, 0.18);
  speckle(g, s, r, pores * 1.5, ['#ffffff', '#efe5cf', '#6b5a44'], 0.18, 1, 2);
  // weathering streaks
  for (let i = 0; i < streaks; i++) {
    const x = r() * s, w = 3 + r() * 26, y = r() * s, h = s * (0.2 + r() * 0.6);
    const grd = g.createLinearGradient(0, y, 0, y + h);
    grd.addColorStop(0, 'rgba(90,72,52,0.08)'); grd.addColorStop(1, 'rgba(70,60,50,0)');
    g.fillStyle = grd; wrect(g, x, y, w, h, s);
  }
}

const TEX = {};
TEX.trav = makeTex(512, 4, 11, (g, s, r) => stoneBlocks(g, s, r, {
  base: '#dcc9a2', rows: 7, ppm: 128, hue: 38, sat: 30, lit: 70, joint: 'rgba(110,88,60,0.38)', streaks: 14 }));
TEX.stone = makeTex(512, 4, 23, (g, s, r) => stoneBlocks(g, s, r, {
  base: '#ddd7cc', rows: 5, ppm: 128, hue: 40, sat: 6, lit: 76, joint: 'rgba(80,70,60,0.55)', pores: 2500, streaks: 18 }));
TEX.brick = makeTex(512, 2, 37, (g, s, r) => {
  g.fillStyle = '#b5a68e'; g.fillRect(0, 0, s, s);
  const rows = 32, rh = s / rows;
  for (let row = 0; row < rows; row++) {
    let x = (row % 2) * 50 + r() * 30;
    const end = x + s;
    while (x < end) {
      const w = 80 + r() * 60;
      g.fillStyle = r() < 0.18 ? `hsl(${38 + r() * 10},${14 + r() * 10}%,${52 + r() * 12}%)` : `hsl(${12 + r() * 14},${26 + r() * 14}%,${36 + r() * 12}%)`;
      wrect(g, x + 1.5, row * rh + 2.5, w - 3, rh - 4, s);
      x += w;
    }
  }
  speckle(g, s, r, 6000, ['#3d2418', '#d8b49a', '#6d4130'], 0.25, 1, 2.5);
});
TEX.sand = makeTex(512, 4, 41, (g, s, r) => {
  g.fillStyle = '#cfb68b'; g.fillRect(0, 0, s, s);
  for (let i = 0; i < 40; i++) {
    const x = r() * s, y = r() * s, rad = 20 + r() * 90;
    const grd = g.createRadialGradient(x, y, 0, x, y, rad);
    grd.addColorStop(0, r() > 0.5 ? 'rgba(160,125,80,0.18)' : 'rgba(245,228,195,0.2)');
    grd.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grd; wrect(g, x - rad, y - rad, rad * 2, rad * 2, s);
  }
  speckle(g, s, r, 26000, ['#9c805a', '#e7d3ab', '#b39367', '#fff1d0', '#7d6446'], 0.55, 1, 2);
});
TEX.wood = makeTex(512, 4, 53, (g, s, r) => {
  const ph = s / 16; // 25 cm planks
  for (let i = 0; i < 16; i++) {
    let x = r() * s;
    const L = 1.6 + r() * 1.8;
    for (let k = 0; k < 4; k++) {
      g.fillStyle = `hsl(${26 + r() * 9},${34 + r() * 14}%,${30 + r() * 14}%)`;
      wrect(g, x, i * ph, L * 128, ph, s);
      g.fillStyle = 'rgba(30,18,8,.6)'; wrect(g, x, i * ph, 2, ph, s);
      x += L * 128;
    }
    g.fillStyle = 'rgba(25,14,6,.7)'; wrect(g, 0, i * ph, s, 1.5, s);
  }
  for (let i = 0; i < 900; i++) {
    g.globalAlpha = 0.12 + r() * 0.16;
    g.fillStyle = r() > 0.5 ? '#2c1a0c' : '#c99c6c';
    wrect(g, r() * s, r() * s, 20 + r() * 120, 1, s);
  }
  g.globalAlpha = 1;
});
TEX.ground = makeTex(512, 40, 61, (g, s, r) => {
  g.fillStyle = '#948a62'; g.fillRect(0, 0, s, s);
  for (let i = 0; i < 70; i++) {
    const x = r() * s, y = r() * s, rad = 20 + r() * 110;
    const grd = g.createRadialGradient(x, y, 0, x, y, rad);
    const c = r();
    grd.addColorStop(0, c < 0.4 ? 'rgba(150,130,95,.16)' : c < 0.8 ? 'rgba(90,100,58,.16)' : 'rgba(110,112,70,.14)');
    grd.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grd; wrect(g, x - rad, y - rad, rad * 2, rad * 2, s);
  }
  speckle(g, s, r, 30000, ['#6d7342', '#a99d70', '#5d6038', '#bcae84'], 0.3, 1, 2);
});
TEX.paving = makeTex(512, 6, 71, (g, s, r) => {
  g.fillStyle = '#7f776a'; g.fillRect(0, 0, s, s);
  const ppm = s / 6, rows = 5, rh = s / rows;
  for (let row = 0; row < rows; row++) {
    let x = r() * 40; const end = x + s;
    while (x < end) {
      const w = Math.min((0.9 + r() * 1.4) * ppm, end - x);
      g.fillStyle = `hsl(${34 + r() * 8},${10 + r() * 8}%,${50 + r() * 10}%)`;
      wrect(g, x + 1.5, row * rh + 1.5, w - 3, rh - 3, s);
      x += w;
    }
  }
  speckle(g, s, r, 9000, ['#6e6455', '#d9d0bd', '#857a68'], 0.3, 1, 3, 0.4);
});
TEX.dirt = makeTex(512, 6, 83, (g, s, r) => {
  g.fillStyle = '#7b6a55'; g.fillRect(0, 0, s, s);
  speckle(g, s, r, 20000, ['#5c4c3b', '#958169', '#a8957a', '#4d3f31'], 0.5, 1, 3);
});

/* ---------- materials ---------- */
const MAT = {
  trav: new THREE.MeshStandardMaterial({ map: TEX.trav, bumpMap: TEX.trav, bumpScale: 0.6, roughness: 0.9 }),
  travIn: new THREE.MeshStandardMaterial({ map: TEX.trav, color: 0xd9ccb6, roughness: 0.95 }),
  stone: new THREE.MeshStandardMaterial({ map: TEX.stone, bumpMap: TEX.stone, bumpScale: 0.8, vertexColors: true, roughness: 0.9 }),
  brick: new THREE.MeshStandardMaterial({ map: TEX.brick, bumpMap: TEX.brick, bumpScale: 0.8, roughness: 0.95, color: 0xe8ddd0 }),
  wood: new THREE.MeshStandardMaterial({ map: TEX.wood, roughness: 0.85 }),
  sand: new THREE.MeshStandardMaterial({ map: TEX.sand, roughness: 1 }),
  ground: new THREE.MeshStandardMaterial({ map: TEX.ground, roughness: 1 }),
  paving: new THREE.MeshStandardMaterial({ map: TEX.paving, roughness: 0.92 }),
  dirt: new THREE.MeshStandardMaterial({ map: TEX.dirt, roughness: 1 }),
  marble: new THREE.MeshStandardMaterial({ color: 0xf3efe6, roughness: 0.45 }),
  bronze: new THREE.MeshStandardMaterial({ color: 0x8a6a3a, roughness: 0.5, metalness: 0.6 }),
  dark: new THREE.MeshStandardMaterial({ color: 0x241a13, roughness: 1 }),
  cloth: new THREE.MeshStandardMaterial({ color: 0x6e1530, roughness: 0.9, side: THREE.DoubleSide }),
  mast: new THREE.MeshStandardMaterial({ color: 0x6b4b2e, roughness: 0.8 }),
  pine: new THREE.MeshStandardMaterial({ color: 0x3d5530, roughness: 0.95 }),
  trunk: new THREE.MeshStandardMaterial({ color: 0x5b4532, roughness: 1 }),
  iron: new THREE.MeshStandardMaterial({ color: 0x2e2a27, roughness: 0.6, metalness: 0.5 }),
};

/* ------------------------------------------------------------------ *
 *  Elliptical geometry of the amphitheatre
 *  All rings are "offset" ellipses with semi-axes (A0+d, B0+d).
 *  +x = east, -z = north, y = up. Units are metres.
 * ------------------------------------------------------------------ */
const A0 = 43, B0 = 27;      // arena semi-axes  (86 × 54 m)
const D_OUT = 51;            // outer façade -> 188 × 156 m
const NB = 80;               // 80 arches per storey
const PIT = -6.5;            // hypogeum floor
const WALL = 2.4;            // façade thickness
const R2D = 44, R2W = 1.6;   // second (inner) arcaded ring
const XCUT = 12;             // partial arena deck covers x > XCUT

  const { pos, target } = v.get();
  flyTo(pos, target, instant);
  document.querySelectorAll('#views button').forEach((b) => b.classList.toggle('active', b.dataset.view === name));
  showCaption(name);
}
const capEl = document.getElementById('caption');
function showCaption(name) {
  const v = VIEWS[name];
  capEl.querySelector('h2').textContent = v.title;
  capEl.querySelector('p').innerHTML = v.text();
  capEl.classList.remove('hidden');
}
capEl.querySelector('.close').addEventListener('click', () => capEl.classList.add('hidden'));

/* ------------------------------------------------------------------ *
 *  UI wiring
 * ------------------------------------------------------------------ */
document.querySelectorAll('#views button').forEach((b) => b.addEventListener('click', () => goView(b.dataset.view)));
document.querySelectorAll('#seg-era button').forEach((b) => b.addEventListener('click', () => setEra(b.dataset.v)));
document.querySelectorAll('#seg-floor button').forEach((b) => b.addEventListener('click', () => setFloor(b.dataset.v)));
const hourEl = document.getElementById('hour');
hourEl.addEventListener('input', () => setSun(parseFloat(hourEl.value)));
addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' && e.target.type !== 'range') return;
  const names = ['aerial', 'exterior', 'arena', 'hypogeum', 'top'];
  const i = parseInt(e.key, 10) - 1;
  if (i >= 0 && i < names.length) goView(names[i]);
});
renderer.domElement.addEventListener('pointerdown', () => {
  if (flight) { flight = null; controls.enabled = true; }
});
controls.addEventListener('start', () => {
  viewActive = false;
  document.querySelectorAll('#views button').forEach((b) => b.classList.remove('active'));
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ------------------------------------------------------------------ *
 *  Init & loop
 * ------------------------------------------------------------------ */
const initHour = parseFloat(qs.get('hour') || '10.5');
hourEl.value = initHour;
setSun(initHour);
updateEnv();
setEra(qs.get('era') === 'today' ? 'today' : 'restored');
setFloor(['full', 'partial', 'open'].includes(qs.get('floor')) ? qs.get('floor') : 'partial');
const startView = VIEWS[qs.get('view')] ? qs.get('view') : 'aerial';
goView(startView, qs.has('nofly'));
if (qs.get('cam')) { const c = qs.get('cam').split(',').map(Number); flyTo(V3(c[0], c[1], c[2]), V3(c[3], c[4], c[5]), true); capEl.classList.add('hidden'); }

const needle = document.getElementById('needle');
const tmpV = new THREE.Vector3();
function animate(now) {
  if (flight) {
    let k = Math.min(1, (now - flight.start) / flight.dur);
    const e = ease(k), a = (1 - e) * (1 - e), b = 2 * e * (1 - e), c = e * e;
    camera.position.set(
      a * flight.p0.x + b * flight.ctrl.x + c * flight.p1.x,
      a * flight.p0.y + b * flight.ctrl.y + c * flight.p1.y,
      a * flight.p0.z + b * flight.ctrl.z + c * flight.p1.z);
    const et = ease(Math.min(1, k * 1.15));
    controls.target.lerpVectors(flight.t0, flight.t1, et);
    camera.lookAt(controls.target);
    if (k >= 1) { flight = null; controls.enabled = true; controls.update(); }
  } else controls.update();
  // keep the shadow frustum centred on the amphitheatre
  sun.target.position.set(0, 0, 0);
  camera.getWorldDirection(tmpV);
  needle.setAttribute('transform', `rotate(${-THREE.MathUtils.radToDeg(Math.atan2(tmpV.x, -tmpV.z))} 23 23)`);
  renderer.render(scene, camera);
}
renderer.setAnimationLoop(animate);
requestAnimationFrame(() => requestAnimationFrame(() => document.getElementById('loader').classList.add('gone')));
</script>
<script>
  // Surface load failures (e.g. offline / blocked CDN) instead of an endless spinner
  addEventListener('error', (e) => {
    const el = document.getElementById('err');
    if (el) el.textContent = 'Could not start the 3D scene: ' + (e.message || 'a resource failed to load') + '. three.js is loaded from unpkg.com — check your connection.';
  }, true);
</script>
</body>
