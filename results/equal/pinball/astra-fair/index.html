<title>Neon Drift Pinball · Nightshift Arcade</title>
<style>
:root{color-scheme:dark;--ink:#f5f3fa;--sub:#a5a2b7;--pink:#ff448f;--line:#ffffff20;--mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#0b0b15;color:var(--ink);font-family:Arial,Helvetica,sans-serif}
body{min-height:100svh;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible{outline:2px solid #79f6fa;outline-offset:5px}
button:disabled{cursor:default}
button svg,.keys svg,.brand svg{display:block}
header{height:72px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(22px,4.8vw,88px);background:#0d0c16;border-bottom:1px solid #35303e;z-index:2}
.brand{display:flex;align-items:center;gap:13px;user-select:none}
.brandmark{width:42px;height:38px}
.brandname{font-family:"Arial Black","Arial",sans-serif;font-style:italic;font-size:19px;font-weight:1000;letter-spacing:-.8px;line-height:.95}
.brandname small{display:block;font:700 8px/1.4 var(--mono);letter-spacing:4.9px;color:#f38ebb;margin-top:4px}
.tools{display:flex;align-items:center;gap:10px}
.tool,.restart{height:34px;border-radius:5px;background:#191720;border:1px solid #38333f;display:flex;gap:9px;align-items:center;justify-content:center;font:700 10px var(--mono);letter-spacing:1px;text-transform:uppercase;transition:background .15s,color .15s}
.tool{width:38px}.tool.sound{width:auto;padding:0 14px}
.tool svg,.restart svg{width:15px;height:15px;color:#ded9e8}
.tool:hover,.restart:hover,.key-action:hover kbd{background:#2f293a;border-color:#75617c}
.stage{flex:1;isolation:isolate;position:relative;overflow:hidden;display:grid;align-items:center;background:radial-gradient(ellipse at 71% 40%,#2b193c 0,transparent 46%),linear-gradient(#100f22 0%,#18132d 50%,#27203c 74%,#100d1a 100%)}
#landscape{width:100%;height:100%;position:absolute;inset:0;z-index:-2;pointer-events:none}
.stage::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(90deg,#0c0b1890,transparent 54%),linear-gradient(0deg,#0b0a13b0,transparent 14%)}

.console{width:100%;align-self:center;position:relative;z-index:1;padding:18px 0 26px}
h1{margin:0 0 clamp(18px,3.1vh,36px);line-height:0}
.title-art{width:100%;height:auto;max-width:304px;overflow:visible}
.screen{padding:18px 20px 0;border:1px solid #413545;background:linear-gradient(130deg,#211a27,#14121d 70%);box-shadow:inset 0 1px 0 #ffffff0c,0 7px 20px #08061155;border-radius:7px;position:relative}
.label,.status,.record,.ball-num,.hint,.controls-name,.mode-text{font-family:var(--mono)}
.label,.controls-name{font-weight:700;font-size:11px;letter-spacing:1.7px;color:#b5adc2}
.screen-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.status{display:flex;align-items:center;gap:6px;font-size:9px;font-weight:700;letter-spacing:1.15px;color:#d0c6d5}
.led{width:6px;height:6px;display:block;border-radius:50%;background:#7af6d9;box-shadow:0 0 7px #52e8c48c}
.dmd{overflow:hidden;background-color:#130e14;background-image:radial-gradient(#51352655 .75px,transparent 1px);background-size:4px 4px;border:1px solid #3c2b37;box-shadow:inset 0 2px 5px #040305aa;border-radius:3px;height:62px;display:flex;align-items:center;justify-content:center}
.dmd svg{width:90%;height:68%;filter:drop-shadow(0 0 3px #ff992938)}
.record{display:flex;align-items:center;justify-content:space-between;height:44px;font-size:11px;letter-spacing:1.3px;color:#d7cfdb}
.record-name{display:flex;align-items:center;gap:8px;color:#a69cab;font-size:10px;letter-spacing:1.1px}
.record-name svg{height:13px;width:13px;color:#c4ad83}
.ball-row{margin:20px 1px 23px;display:flex;align-items:center;gap:12px}
.ball-row .label{margin-right:auto}
.balls{display:flex;gap:6px}
.ball-lamp{width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 32% 23%,white 0%,#eee6f3 12%,#9696af 26%,#343343 50%,#aba5b8 73%,#4b4658 97%);box-shadow:0 1px 3px #000}
.ball-lamp.spent{background:#2d263a;box-shadow:inset 0 1px 2px #090710;border:1px solid #44394c}
.ball-num{font-size:11px;color:#9d96aa;letter-spacing:1px;border-left:1px solid #4c4054;padding-left:11px}
.launch{border:1px solid #ff89b9;border-bottom:3px solid #a72361;border-radius:5px;background:linear-gradient(105deg,#ff659f,#ff478c);color:#261022;height:49px;width:100%;display:flex;align-items:center;justify-content:center;gap:11px;position:relative;overflow:hidden;box-shadow:0 0 22px #f736901c;font:bold 12px var(--mono);letter-spacing:1.6px;user-select:none;touch-action:none}
.launch>*{position:relative}.launch svg{width:16px;height:16px}
.launch::before{content:"";position:absolute;inset:0;background:#ffbd69;transform:scaleX(var(--charge,0));transform-origin:left;transition:transform 50ms linear}
.launch:enabled:hover{filter:brightness(1.1)}.launch:enabled:active{transform:translateY(1px)}
.launch:disabled{background:#252133;border-color:#504254;color:#d0bfcd;box-shadow:none}
.hint{display:block;font-size:10px;letter-spacing:.35px;color:#aba1b6;text-align:center;margin:10px 0 0;min-height:15px}
.cabinet{height:clamp(450px,calc(100svh - 147px),900px);width:100%;position:relative;display:grid;place-items:center}
#table{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
footer{background:#0e0d17;border-top:1px solid #302a3c;min-height:63px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:9px clamp(22px,4.8vw,88px);z-index:2}
.keys{display:flex;align-items:center;gap:clamp(12px,2.5vw,44px)}
.key-action{background:transparent;border:0;color:#c5becd;display:inline-flex;align-items:center;gap:9px;padding:2px 0;font-size:12px;white-space:nowrap;touch-action:none;user-select:none}
kbd{padding:4px 7px;min-width:25px;height:23px;background:#211e2c;border:1px solid #484050;border-bottom-width:2px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;line-height:1;font:700 10px var(--mono);color:#ede6f0;letter-spacing:.3px}
.key-action.active kbd{border-color:#ff67a8;color:#fff;background:#743a64}
.restart{padding:0 10px;height:31px;font-size:9px;border-color:transparent;background:transparent;color:#bcb1c5;letter-spacing:1.1px}
.overlay-wrap{position:absolute;inset:0;display:grid;place-items:center;background:#0d091e66;z-index:3}
[hidden]{display:none!important}
.dialog{width:min(318px,90%);padding:30px;text-align:center;color:#f6edf6;background:linear-gradient(145deg,#251e31,#12101d);border:1px solid #69516c;border-top:3px solid #ff538f;border-radius:7px;box-shadow:0 18px 65px #08050bd4}
.dialog h2{font:italic 1000 34px/.95 "Arial Black",Arial,sans-serif;letter-spacing:-2px;text-transform:uppercase;margin:0 0 18px}
.dialog p{margin:3px 0 12px;color:#c8b8cc;font:11px var(--mono);letter-spacing:1.2px;text-transform:uppercase}
.dialog strong{display:block;font:700 30px var(--mono);letter-spacing:3px;color:#ffbd72;margin-bottom:20px}
.dialog .launch{font-size:11px;height:42px}

@media(max-width:800px) and (min-width:701px){.workspace{width:95%;grid-template-columns:220px 1fr;gap:5px}.controls-name{display:none}}

@media(prefers-reduced-motion:reduce){*{transition:none!important}}

@media(max-width:700px){
  .mobile-caption{display:inline}.desktop-caption{display:none}
  footer{min-height:64px;padding:7px 9px;gap:4px}.keys{gap:5px}.controls-name{display:none}
  .keys .key-action{flex:1;min-width:0;justify-content:center;min-height:44px;gap:4px;border:1px solid #4b3c51;border-bottom-width:3px;border-radius:5px;background:#251f30;font-size:11px;font-weight:600}
  .keys .pause-key{display:none}.keys .mobile-launch{color:#281324;background:#ff609d;border-color:#ff88b5;border-bottom-color:#b13369;position:relative;overflow:hidden}

  .mobile-launch .mobile-caption{position:relative}
  .mobile-launch:disabled{color:#d4c6dd;background:#352b40;border-color:#54435e}

  .keys .right-key kbd{color:#94ebed}.keys .mobile-launch kbd{display:none}

  footer .restart{margin:0;width:32px;height:44px;gap:0}footer .restart span{display:none}footer .restart svg{flex:none;width:16px;height:16px}.workspace{min-height:calc(100svh - 116px)}
  .console{row-gap:5px}
  .console>.hint{display:block;grid-column:1/-1;margin:3px 0 0;font-size:9px;color:#bdb4c6;min-height:12px}
  .cabinet{height:clamp(275px,calc(100svh - 237px),740px)}
}

@media(min-width:701px) and (max-height:510px){
  header{height:39px}.brandmark{width:27px;height:27px}.brandname{font-size:14px}.brandname small{font-size:6px;margin-top:2px}.tool{height:26px}
  footer{min-height:39px;padding-top:4px;padding-bottom:4px}.workspace{min-height:calc(100svh - 78px);max-width:710px;grid-template-columns:190px 1fr;gap:16px}
  .cabinet{height:calc(100svh - 80px);min-height:220px}.console{padding:4px 0}.title-art{height:70px;display:block;margin:auto}h1{margin-bottom:6px}.screen{padding:7px 10px 0}.screen-head{margin-bottom:4px}.dmd{height:34px}.record{height:24px}.ball-row{margin:8px 0}.hint{font-size:8px;margin-top:5px}.launch{height:32px;font-size:10px}.screen-head .label{font-size:9px}
}

@media(min-width:1000px) and (min-height:681px) and (max-height:785px){.workspace{width:min(1050px,91%);grid-template-columns:280px minmax(0,1fr)}}
</style>

/* Screen-printed playfield, in table coordinates. */
window.paintPlayfield = function paintPlayfield(c) {
  c.save();
  const W = 400, H = 660;
  const grad = (x1,y1,x2,y2,stops) => {
    const g = c.createLinearGradient(x1,y1,x2,y2);
    for (const [pos,col] of stops) g.addColorStop(pos,col);
    return g;
  };
  function polygon(points,fill,stroke,width=1) {
    c.beginPath(); points.forEach(([x,y],i) => i ? c.lineTo(x,y) : c.moveTo(x,y));
    c.closePath();
    if (fill) { c.fillStyle=fill; c.fill(); }
    if (stroke) { c.strokeStyle=stroke; c.lineWidth=width; c.stroke(); }
  }
  function line(points,color,width=1) {
    c.beginPath(); points.forEach(([x,y],i) => i ? c.lineTo(x,y) : c.moveTo(x,y));
    c.strokeStyle=color; c.lineWidth=width; c.stroke();
  }
  function ellipse(x,y,rx,ry,fill) {
    c.beginPath(); c.ellipse(x,y,rx,ry,0,0,Math.PI*2); c.fillStyle=fill; c.fill();
  }
  function box(x,y,w,h,color) { c.fillStyle=color; c.fillRect(x,y,w,h); }
  function print(txt,x,y,size,color,align='center') {
    c.fillStyle=color; c.textAlign=align; c.textBaseline='middle';
    c.font='bold '+size+'px "Arial Narrow",Arial,sans-serif'; c.fillText(txt,x,y);
  }
  let seed=842697;
  function rand() { seed=(Math.imul(1664525,seed)+1013904223)>>>0; return seed/4294967296; }

      if(e.code==='Space' && document.activeElement?.matches('button:focus-visible') && !document.activeElement.matches('[data-control]'))return;
      e.preventDefault();if(!e.repeat)input(keyMap[e.code],e.code,true);
    }else if(e.code==='KeyP'||e.code==='Escape'&&!document.fullscreenElement){
      e.preventDefault();if(!e.repeat)togglePause();
    }else if(e.code==='KeyF'&&!e.repeat)fullscreen();
  });
  window.addEventListener('keyup',e=>{
    if(e.code in keyMap && held.has(keyMap[e.code]+':'+e.code)){e.preventDefault();input(keyMap[e.code],e.code,false);}
  });
  document.querySelectorAll('[data-control]').forEach(el=>{
    const name=el.dataset.control;
    el.addEventListener('pointerdown',e=>{
      if(e.button!==0)return;e.preventDefault();el.setPointerCapture(e.pointerId);input(name,e.pointerId,true);
    });
    const stop=e=>input(name,e.pointerId,false);
    el.addEventListener('pointerup',stop);el.addEventListener('pointercancel',stop);el.addEventListener('lostpointercapture',stop);
    // Enter and assistive-technology activations provide a single tap.
    el.addEventListener('click',e=>{if(e.detail===0){input(name,'click',true);step(.09);input(name,'click',false);}});
  });
  function backgroundPause(){
    if(!state.paused && (state.mode==='playing'||state.mode==='drain'||held.size))togglePause();
  }
  window.addEventListener('blur',backgroundPause);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)backgroundPause();});
  let uiSignature='',lastScore=-1;
  window.addEventListener('resize',()=>{uiSignature='';updateUI();});
  function updateUI(){
    const charging=state.mode==='ready'&&Array.from(held.values()).includes('launch');
    const power=Math.round(state.charge*100);
    const sig=[state.mode,state.paused,state.ballNumber,state.score,power,charging].join('/');
    if(sig===uiSignature)return;uiSignature=sig;
    if(state.score!==lastScore){scoreDisplay(state.score);lastScore=state.score;}
    if(state.score>best){
      best=state.score;
      try{localStorage.setItem('nightshift.neondrift.best',String(best));}catch{}
    }
    $('best').textContent=String(best).padStart(6,'0');
    $('ball-num').textContent=String(state.ballNumber).padStart(2,'0')+' / 03';
    document.querySelectorAll('.ball-lamp').forEach((lamp,i)=>lamp.classList.toggle('spent',i<state.ballNumber-1||state.mode==='over'));
    const statuses={ready:'READY',playing:'IN PLAY',drain:'DRAINED',over:'GAME OVER'};
    $('mode').textContent=state.paused?'PAUSED':charging?'CHARGING':statuses[state.mode];
    launch.style.setProperty('--charge',state.charge);
    launch.disabled=state.paused||state.mode!=='ready';
    const mobileLaunch=document.querySelector('.mobile-launch');
    mobileLaunch.disabled=launch.disabled;
    mobileLaunch.style.setProperty('--charge',state.charge);
    mobileLaunch.querySelector('.mobile-caption').textContent=charging?'Release':state.mode==='ready'?'Hold to launch':state.mode==='playing'?'In play':'Plunger';
    if(state.mode==='playing' && !state.paused && state.multiplier>1)$('mode').textContent=state.multiplier+'× IN PLAY';
    $('action-label').textContent=state.paused?'PAUSED':charging?'POWER '+power+'%':({ready:'HOLD TO LAUNCH',playing:'BALL IN PLAY',drain:'BALL DRAINED',over:'GAME OVER'})[state.mode];
    $('hint').textContent=state.paused?'Press P to resume':({ready:'Hold Space to charge, release to launch',playing:'Use the arrow keys to flip',drain:state.ballNumber===3?'Last ball':'Next ball up',over:'Three balls played'})[state.mode];
    $('pause').querySelector('use').setAttribute('href',state.paused?'#i-play':'#i-pause');
    $('pause').setAttribute('aria-label',state.paused?'Resume':'Pause');$('pause').title=state.paused?'Resume (P)':'Pause (P)';
    $('pause').disabled=$('pause-foot').disabled=state.mode==='over';
    if(matchMedia('(max-width:700px)').matches && state.mode==='ready' && !state.paused)$('hint').textContent=charging?'Release to launch':'Hold the plunger, then release to launch';
    const showDialog=state.paused||state.mode==='over',wasOpen=!overlay.hidden;
    overlay.hidden=!showDialog;
    if(showDialog){
      const over=state.mode==='over';
      $('dialog-title').textContent=over?'Game over':'Paused';$('final-score').hidden=!over;
      $('final-value').textContent=String(state.score).padStart(6,'0');$('resume').textContent=over?'PLAY AGAIN':'RESUME GAME';
      if(!wasOpen)$('resume').focus({preventScroll:true});
    }
  }
  window.render_game_to_text=()=>JSON.stringify({
    mode:state.mode,paused:state.paused,score:state.score,ballNumber:state.ballNumber,ballsPerGame:3,charge:+state.charge.toFixed(2),
    coordinates:'400 x 660 playfield, origin top left, +y toward drain',
    ball:Object.fromEntries(['x','y','vx','vy'].map(k=>[k,+state.ball[k].toFixed(2)])),
    multiplier:state.multiplier||1,bumpers:state.bumpers.map(b=>({x:b.x,y:b.y,r:b.r,lit:+b.lit.toFixed(2),points:b.points})),
    flippers:state.flippers.map(f=>({x:f.x,y:f.y,tx:+f.tx.toFixed(2),ty:+f.ty.toFixed(2)}))
  });
  function frame(dt){step(dt);window.drawTable(table,state);updateUI();}
  let previous=performance.now();
  function loop(now){frame(Math.min(Math.max(0,(now-previous)/1000),.06));previous=now;requestAnimationFrame(loop);}
  window.advanceTime=ms=>{if(Number.isFinite(ms)&&ms>=0){frame(ms/1000);previous=performance.now();}};
  frame(0);requestAnimationFrame(loop);
})();

</script>
</body>
</html>
