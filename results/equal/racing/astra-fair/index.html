<style>
:root{color-scheme:dark;--cream:#fff2df;--muted:#b6a7bf;--pink:#ff3d99;--gold:#ffe78b;--cyan:#7cfff5;--pad:clamp(20px,4.35vw,84px);--mono:"Space Mono",ui-monospace,"SFMono-Regular",Consolas,"Liberation Mono",monospace}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#100b19;color:var(--cream);font-family:Arial,Helvetica,sans-serif}button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:2px solid var(--cyan);outline-offset:5px}svg{display:block}button svg{pointer-events:none}

main{min-height:0;position:relative;overflow:hidden;background:radial-gradient(ellipse at 70% 43%,#ff5e7d,#441139 32%,#180e2e 67%)}#scene,.shade,.grain{position:absolute;inset:0;width:100%;height:100%}#scene{display:block}.shade,.grain{pointer-events:none}.shade{background:linear-gradient(90deg,rgba(16,6,25,.67),rgba(21,6,29,.34) 29%,transparent 53%),linear-gradient(0deg,#19092144,transparent 19%);transition:opacity .4s}.grain{opacity:.15;background:repeating-linear-gradient(0deg,transparent 0 2px,#11052366 2px 3px)}body:not([data-mode=menu]) .shade{opacity:0}
#start-screen{position:absolute;inset:0;display:flex;align-items:center;padding:0 calc(var(--pad) + 1.7vw);pointer-events:none}.intro{margin-top:-1.1vh;position:relative;width:min(40vw,590px)}.eyebrow{display:flex;gap:11px;align-items:center;text-transform:uppercase;letter-spacing:2.8px;font:700 11px var(--mono);letter-spacing:2.5px;color:var(--gold)}.tiny-flag{width:24px;height:16px;fill:currentColor}h1{margin:clamp(17px,2.5vh,29px) 0 0;line-height:1}.wordmark{width:100%;height:auto;overflow:visible;filter:drop-shadow(2px 4px 0 #2d0a29) drop-shadow(0 0 13px #ea357b20)}.game-meta{font:700 11px var(--mono);letter-spacing:1.7px;color:#d9cbdf;display:flex;gap:15px;align-items:center;margin:clamp(17px,2.8vh,29px) 0 clamp(25px,4.1vh,42px)}.game-meta i{display:block;width:24px;height:2px;background:var(--pink)}.game-meta b{color:#ad748e;font-weight:400}.start-row{display:flex;gap:20px;align-items:center}.primary{position:relative;pointer-events:auto;display:inline-flex;align-items:center;justify-content:space-between;gap:32px;background:var(--gold);color:#291329;border:0;min-height:52px;padding:0 23px 0 25px;box-shadow:4px 4px 0 #b64c76;font-family:"Archivo Black","Arial Black",Arial,sans-serif;font-weight:950;letter-spacing:1px;font-size:16px;font-style:italic}.primary:hover{background:#fff2b4;transform:translate(-1px,-1px);box-shadow:5px 5px 0 #f75792}.primary:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #b64c76}.primary svg{width:21px;height:15px;fill:currentColor}.shortcut{display:flex;align-items:center;gap:7px;color:#dcc7dc;font:700 10px var(--mono);letter-spacing:1.1px}.shortcut svg{width:14px;height:13px;fill:none;stroke:currentColor;stroke-width:1.5}.console{border-top:1px solid #523047;gap:20px}.course{display:flex;align-items:center;gap:15px}.route{width:49px;height:35px;fill:none;stroke:var(--pink);stroke-linejoin:bevel;stroke-width:2}.course-copy{display:grid;gap:6px}.small-label{color:#afa1b9;font:600 9px var(--mono);letter-spacing:1.8px;line-height:1.2}.course-name{font-weight:700;font-size:14px;letter-spacing:.2px}.control-guide{display:flex;align-items:center;gap:clamp(12px,2.5vw,42px)}.ctrl{display:flex;align-items:center;gap:8px;font:500 11px var(--mono);color:#cec1d4;white-space:nowrap}.keys{display:flex;gap:3px}kbd{display:inline-flex;align-items:center;justify-content:center;border:1px solid #6a526b;border-bottom:2px solid #6a526b;background:#281c2d;height:22px;min-width:21px;border-radius:3px;font:600 10px var(--mono);color:#f4e5f4;padding:0 4px}.wide-key{padding:0 8px}.keys-or{font:10px var(--mono);color:#948098}.touch-tip{display:none}
.hidden,[hidden]{display:none!important}.race-hud{position:absolute;inset:0;pointer-events:none}.hud-top{position:absolute;left:var(--pad);right:var(--pad);top:clamp(17px,3vh,37px);display:flex;align-items:flex-start;justify-content:space-between}.telemetry{display:flex;gap:22px;align-items:center;padding:12px 17px;border-left:3px solid var(--pink);background:linear-gradient(95deg,#150b20ef,#190b21b5);font-family:var(--mono)}.telemetry .small-label,.instrument .small-label{display:block;color:#dec4dd;font-size:9px;margin-bottom:5px}.telemetry strong{font:700 clamp(16px,2vw,25px) var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-1.2px}.lapnum{color:var(--gold)}.slash{color:#aa8aa7;font-size:.65em}.timecell{border-left:1px solid #664562;padding-left:19px}.pause-btn{pointer-events:auto}.instrument{position:absolute;right:var(--pad);bottom:clamp(19px,4vh,46px);min-width:150px;text-align:right;text-shadow:0 2px 5px #140d21,0 2px 12px #140d21}.instrument strong{font:italic 950 clamp(45px,5.7vw,85px)/.95 "Arial Black",Arial,sans-serif;letter-spacing:-4px}.instrument .unit{font:700 11px var(--mono);color:var(--gold);letter-spacing:1px;margin-left:8px}.boost-meter{margin-top:12px;display:flex;align-items:center;justify-content:flex-end;gap:9px;font:700 9px var(--mono);letter-spacing:1.6px}.meter{width:98px;height:8px;background:#30203c;border:1px solid #b384a2;position:relative}.meter span{display:block;height:100%;background:var(--cyan);transform-origin:left}.meter:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 7px,#391e48 7px 9px)}.active-boost .boost-meter{color:var(--cyan)}
#count{position:absolute;inset:0;display:grid;place-content:center;text-align:center;text-shadow:5px 5px #7c245c,0 0 30px #ae2469;color:var(--gold);pointer-events:none}#count strong{font:italic 1000 clamp(80px,14vw,170px)/1 "Arial Black",Arial,sans-serif}#count .accelerate-hint{margin-top:16px;letter-spacing:1px;font-size:10px;color:#fff1dc;background:#211129e8;text-shadow:none;padding:9px 13px}#lap-split{position:absolute;top:18%;left:50%;transform:translateX(-50%);text-align:center;background:#211128e8;border-bottom:2px solid var(--pink);padding:10px 20px;font:700 10px var(--mono);letter-spacing:1.3px;color:var(--gold);white-space:nowrap}#lap-split strong{display:block;color:#fff1df;margin-top:4px;font-size:19px;letter-spacing:.4px}#count span{font:700 12px var(--mono);letter-spacing:3px;color:#fff2df}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#0e081b9c}.panel{width:min(410px,89vw);padding:clamp(23px,3.3vw,45px);border:1px solid #a94c79;border-top:3px solid var(--pink);box-shadow:7px 7px #2e0d32;background:#170f20f5}.panel h2{font:italic 950 clamp(31px,4vw,49px)/.95 "Arial Black",Arial,sans-serif;text-transform:uppercase;letter-spacing:-2px;margin:14px 0 24px}.panel .primary{width:100%;justify-content:center;min-height:45px}.result-time{font:700 34px var(--mono);letter-spacing:-2px;color:var(--gold);margin:3px 0 15px}.splits{border-top:1px solid #4b324b;margin-bottom:20px;padding-top:6px}.split{display:flex;justify-content:space-between;padding:4px 0;font:11px var(--mono);color:#cfbfd3}.split b{color:#f4e0ed}.subtle{margin:14px auto 0;background:transparent;height:30px}.touch-controls{display:none}.race-progress{position:absolute;left:0;right:0;bottom:0;height:3px;opacity:.8}.race-progress i{background:var(--pink);display:block;height:100%;transform-origin:left}
@media(max-width:840px){#cabinet{grid-template-rows:55px minmax(0,1fr) 65px}.control-guide{gap:15px}.controls-label,.keys-or,.arrows-alternate{display:none}.intro{width:min(45vw,520px)}.utilities{gap:7px}.course{gap:9px}}
@media(max-aspect-ratio:4/5){#start-screen{align-items:flex-start;padding:clamp(35px,6.5vh,75px) 7vw 0}.intro{width:min(70vw,370px)}.shade{background:linear-gradient(140deg,#1a0c2fb0,transparent 61%)}.game-meta{font-size:10px;gap:11px;margin:17px 0 23px}.start-row{gap:13px}.primary{min-height:45px;padding:0 18px;gap:22px;font-size:14px}.eyebrow{font-size:9px;letter-spacing:2px}.shortcut{font-size:9px}.brand small{display:none}.course-name{font-size:12px}.route{width:36px}.control-guide{gap:9px}.ctrl{font-size:10px}.controls-label,.desktop-extra{display:none}.wordmark{max-height:22vh;width:auto;max-width:100%}.instrument{bottom:75px}.telemetry{gap:12px;padding:9px 11px}.timecell{padding-left:11px}}
@media(max-width:510px){:root{--pad:17px}.brand{gap:7px}.brand-mark{width:34px}.brand strong{font-size:18px}.utility{font-size:8px;gap:5px;padding:0 8px}.square{width:30px}.console .ctrl{gap:4px}.console kbd{min-width:15px;height:18px;font-size:8px}.course{gap:6px}.course-copy{gap:3px}.small-label{font-size:8px}.controls-label,.label-drive{display:none}}
@media(pointer:coarse){.touch-tip{display:block;font:10px var(--mono);color:#d0bfd3}.control-guide,.shortcut{display:none}.touch-controls{display:flex;position:absolute;bottom:12px;left:var(--pad);right:var(--pad);justify-content:space-between;pointer-events:none}.touch-group{display:flex;gap:6px}.touch-controls button{pointer-events:auto;border:1px solid #ab7c9a;background:#1d122bc9;color:var(--cream);font:700 12px var(--mono);height:42px;min-width:43px;touch-action:none;user-select:none;-webkit-user-select:none}.touch-controls button.held{background:var(--gold);color:#281728}.instrument{bottom:71px}}
@media(max-height:520px) and (min-aspect-ratio:1/1){#cabinet{grid-template-rows:39px minmax(0,1fr) 43px}.intro{width:min(39vw,51vh)}h1{margin-top:10px}.eyebrow{font-size:8px}.game-meta{margin:10px 0 13px;font-size:8px}.primary{min-height:35px;font-size:12px}.course-copy{gap:1px}.panel{padding:12px 25px}.panel h2{font-size:26px;margin:8px 0}.splits{margin-bottom:8px}.result-time{font-size:24px;margin-bottom:4px}.panel .primary{min-height:32px}.subtle{margin-top:7px}.shortcut{font-size:8px}}
</style>
</head>

<path fill="#ffeabe" d="m277 8 1.9 7.2 7.2 1.8-7.2 1.8L277 26l-2-7.2-7-1.8 7-1.8z"/><path fill="#ef5896" d="m289 1 1 3.5 3.5 1-3.5 1-1 3.5-1-3.5-3.5-1 3.5-1z"/>

<script>
'use strict';
const el = id => document.getElementById(id);
const formatTime = seconds => {
  const ms = Math.floor(Math.max(0,seconds)*1000);
  return String(Math.floor(ms/60000)).padStart(2,'0')+':'+String(Math.floor(ms/1000)%60).padStart(2,'0')+'.'+String(ms%1000).padStart(3,'0');
};
if (window.matchMedia('(pointer:coarse)').matches) el('throttle-hint').textContent='HOLD GAS TO ACCELERATE';
let hudMode='', audioState;
window.paintHUD = state => {
  if(hudMode!==state.mode){
    hudMode=state.mode;
    document.body.dataset.mode=hudMode;
    el('start-screen').hidden=hudMode!=='menu';
    el('hud').hidden=!['racing','countdown'].includes(hudMode);
    el('count').hidden=hudMode!=='countdown';
    el('pause-panel').hidden=hudMode!=='paused';
    el('finish-panel').hidden=hudMode!=='finish';
    if(hudMode==='paused') el('resume').focus({preventScroll:true});
    if(hudMode==='finish'){
      el('race-time').textContent=formatTime(state.elapsed);
      el('splits').replaceChildren(...state.lapTimes.map((time,i)=>{
        const row=document.createElement('div'), value=document.createElement('b');
        row.className='split';row.append('LAP 0'+(i+1));value.textContent=formatTime(time);row.append(value);return row;
      }));
    }
    if(hudMode==='racing'||hudMode==='countdown') document.activeElement?.blur();
  }
  if(audioState!==state.muted){
    audioState=state.muted;document.body.classList.toggle('audio',!audioState);
    el('sound-label').textContent=audioState?'SOUND OFF':'SOUND ON';
    el('sound').setAttribute('aria-pressed',String(!audioState));
  }
  if(hudMode==='countdown') el('count-number').textContent=Math.max(1,Math.ceil(state.countdown));
  if(hudMode==='racing'||hudMode==='countdown'){
    el('speed').textContent=String(Math.round(state.speed)).padStart(3,'0');
    el('lap').textContent=state.lap;el('lap-time').textContent=formatTime(state.lapTime);
    el('energy').style.transform='scaleX('+state.energy+')';
    el('progress').style.transform='scaleX('+state.progress+')';
    el('hud').classList.toggle('active-boost',state.boost);
    const showSplit = state.lap>1 && state.lapTime<2.4;
    el('lap-split').hidden=!showSplit;
    if(showSplit){
      el('split-label').textContent='LAP 0'+(state.lap-1)+' COMPLETE';
      el('split-time').textContent=formatTime(state.lapTimes[state.lap-2]);
    }
  }
};
el('start-btn').onclick=el('replay').onclick=()=>window.raceStart();
el('quit').onclick=el('back').onclick=()=>window.raceMenu();
el('resume').onclick=el('pause-btn').onclick=()=>window.racePause();
el('sound').onclick=()=>window.raceMute();
el('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{}};
if(!document.fullscreenEnabled)el('fullscreen').hidden=true;
document.querySelectorAll('[data-control]').forEach(button=>{
  button.addEventListener('pointerdown',e=>{e.preventDefault();button.setPointerCapture(e.pointerId);button.classList.add('held');window.raceInput(button.dataset.control,true);});
  button.addEventListener('lostpointercapture',()=>{button.classList.remove('held');window.raceInput(button.dataset.control,false);});
});
const drawWorld = (() => {

      } else if (was !== state.countdown) cue(440);
    } else if (state.mode === 'racing') drive(dt);
  }
  function resize() {
    const bounds = canvas.getBoundingClientRect();
    width = Math.max(1, bounds.width);
    height = Math.max(1, bounds.height);
    pixelRatio = Math.min(window.devicePixelRatio || 1, 2, Math.sqrt(2600000 / (width * height)));
    const cw = Math.round(width * pixelRatio), ch = Math.round(height * pixelRatio);
    if (canvas.width !== cw || canvas.height !== ch) { canvas.width = cw; canvas.height = ch; }
  }
  function render() {
    ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
    const menuDrift = state.mode === 'menu' && !reducedMotion.matches ? clock * 3.2 : 0;
    const view = {lapLength, distance: state.distance + menuDrift, speed: state.speed,
      lateral: state.lateral, curve: state.curve, time: clock,
      mode: state.mode, boost: state.boost, focus, steer: state.steer, edge: state.edge};
    drawWorld(ctx, width, height, view);
    drawCraft(ctx, width, height, view);
    window.paintHUD?.(state);
    updateSound();
  }
  function advance(seconds) {
    const steps = Math.max(1, Math.ceil(seconds * 120 - 1e-8));
    for (let i = 0; i < steps; i++) tick(seconds / steps);
  }
  window.advanceTime = ms => {
    if (!Number.isFinite(ms) || ms < 0) return;
    advance(ms / 1000);
    render();
  };
  window.render_game_to_text = () => JSON.stringify({
    ...state, coordinateSystem: 'distance in metres along circuit; lateral -1 left barrier, +1 right barrier; positive curve turns right',
    lapLength, totalLaps, speedUnit: 'km/h', timerUnit: 'seconds'
  });
  function frame(now) {
    advance(lastFrame ? clamp((now - lastFrame) / 1000, 0, 0.1) : 0);
    lastFrame = now;
    render();
    requestAnimationFrame(frame);
  }
  window.addEventListener('resize', () => { resize(); render(); });
  resize();
  render();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
